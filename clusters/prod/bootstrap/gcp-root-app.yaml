# GCP Root Application — GKE 클러스터 초기 부트스트랩을 위한 Root App
# 이 Application은 GCP 전용 인프라(infrastructure/prod/gcp/)를 우선적으로 관리합니다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: goti-gcp-root
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: infra
  source:
    repoURL: "https://github.com/Team-Ikujo/Goti-k8s.git"
    targetRevision: main
    path: "infrastructure/prod/gcp" # GCP 전용 인프라 경로 (ClusterStore, StorageClass 등)
    directory:
      recurse: true
  destination:
    server: "https://kubernetes.default.svc"
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
