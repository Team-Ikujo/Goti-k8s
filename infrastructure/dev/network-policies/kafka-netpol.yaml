apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: kafka
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# goti namespace에서만 Kafka 접근 허용
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka-from-goti
  namespace: kafka
spec:
  podSelector:
    matchLabels:
      strimzi.io/cluster: goti-kafka
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: goti
      ports:
        - port: 9092
          protocol: TCP
        - port: 9093
          protocol: TCP
---
# Kafka 브로커 간 내부 통신
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka-internal
  namespace: kafka
spec:
  podSelector:
    matchLabels:
      strimzi.io/cluster: goti-kafka
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              strimzi.io/cluster: goti-kafka
  egress:
    - to:
        - podSelector:
            matchLabels:
              strimzi.io/cluster: goti-kafka
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
---
# monitoring에서 Kafka 메트릭 scrape 허용
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka-metrics-scrape
  namespace: kafka
spec:
  podSelector:
    matchLabels:
      strimzi.io/cluster: goti-kafka
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9404
          protocol: TCP
