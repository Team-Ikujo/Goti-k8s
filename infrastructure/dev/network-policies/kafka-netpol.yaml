apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: kafka
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# goti namespace에서만 Kafka 접근 허용
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka-from-goti
  namespace: kafka
spec:
  podSelector:
    matchLabels:
      strimzi.io/cluster: goti-kafka
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: goti
      ports:
        - port: 9092
          protocol: TCP
        - port: 9093
          protocol: TCP
---
# Kafka 브로커 간 내부 통신
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka-internal
  namespace: kafka
spec:
  podSelector:
    matchLabels:
      strimzi.io/cluster: goti-kafka
  policyTypes:
    - Ingress
    - Egress
  # TODO: inter-broker 포트(9091, 9090 등) 명시하여 최소 권한 적용
  ingress:
    - from:
        - podSelector:
            matchLabels:
              strimzi.io/cluster: goti-kafka
  egress:
    - to:
        - podSelector:
            matchLabels:
              strimzi.io/cluster: goti-kafka
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# Strimzi Operator: Kafka 브로커 관리 + K8s API 통신
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-strimzi-operator
  namespace: kafka
spec:
  podSelector:
    matchLabels:
      strimzi.io/kind: cluster-operator
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
    # Kind 환경에서 K8s API 서버 IP가 동적이므로 0.0.0.0/0 허용, IMDS만 차단
    # prod에서는 API 서버 ClusterIP/대역으로 제한 필요
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
      ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# monitoring에서 Kafka 메트릭 scrape 허용
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka-metrics-scrape
  namespace: kafka
spec:
  podSelector:
    matchLabels:
      strimzi.io/cluster: goti-kafka
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9404
          protocol: TCP
