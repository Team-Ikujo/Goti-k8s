# goti namespace: defense-in-depth (Istio AuthorizationPolicy L7 + NetworkPolicy L3/L4)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: goti
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Istio Gateway에서의 ingress 허용
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-istio-gateway
  namespace: goti
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
---
# goti namespace 내부 서비스 간 통신
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-goti-internal
  namespace: goti
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
---
# monitoring에서의 scrape 허용 (Alloy metrics + Istio sidecar)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-scrape
  namespace: goti
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8080
          protocol: TCP
        - port: 15020
          protocol: TCP
        - port: 15090
          protocol: TCP
---
# egress: monitoring (OTLP), kafka, DNS, Istio control plane
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-goti-egress
  namespace: goti
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # monitoring: Alloy OTLP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 4317
          protocol: TCP
        - port: 4318
          protocol: TCP
    # kafka: 브로커 접근
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kafka
      ports:
        - port: 9092
          protocol: TCP
        - port: 9093
          protocol: TCP
    # istio-system: Istiod xDS, CA
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - port: 15012
          protocol: TCP
        - port: 15014
          protocol: TCP
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        podSelector:
          matchLabels:
            k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # 외부 HTTPS (AWS SSM, OAuth 등 — Sidecar에서 L7 세분화)
    - ports:
        - port: 443
          protocol: TCP
