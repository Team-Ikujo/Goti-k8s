# =============================================================================
# === 모니터링 도메인 (트레이스 버퍼) ===
# Alloy → Kafka → Alloy(consumer) → Tempo
# Tempo OOMKilled 방지: Kafka가 트레이스를 버퍼링하여 Tempo 유입 속도 제어
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: observability.traces.v1
  labels:
    strimzi.io/cluster: goti-kafka
    domain: observability
spec:
  partitions: 3
  replicas: 3
  config:
    retention.ms: 3600000          # 1시간 (버퍼 목적, 장기 보관 불필요)
    cleanup.policy: delete
    min.insync.replicas: 2
    max.message.bytes: 1048576     # 1MB (트레이스 배치)
# =============================================================================
# DLQ (Dead Letter Queue) 토픽
# 처리 실패한 메시지를 보관. partitions: 1 (순서 보장), retention: 30일
# =============================================================================
---
# === 티켓 도메인 DLQ ===
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: ticket.order-created.v1.dlq
  labels:
    strimzi.io/cluster: goti-kafka
    domain: ticket
    type: dlq
spec:
  partitions: 1
  replicas: 3
  config:
    retention.ms: 2592000000      # 30일
    cleanup.policy: delete
    min.insync.replicas: 2
