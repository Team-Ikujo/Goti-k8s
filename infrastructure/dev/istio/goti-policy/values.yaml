# Goti namespace Istio 정책 기본값
# deny-all + allow 정책은 반드시 동시 배포

denyAll:
  enabled: true

allowGateway:
  enabled: true
  # Istio Gateway Helm release의 ServiceAccount 이름
  gatewaySA: "cluster.local/ns/istio-system/sa/istio-gateway"

allowPrometheus:
  enabled: true

# mTLS PERMISSIVE — scrape 포트만 plaintext 허용 (dev only)
# prod: monitoring에 sidecar 주입 후 enabled: false
peerAuth:
  permissiveForScrape:
    enabled: true

allowKubeletProbes:
  enabled: true

# istiod + envoy sidecar → user JWKS 엔드포인트 접근 허용 (RequestAuthentication용)
# istiod는 sidecar 없이 직접 HTTP 호출 → principals 매칭 불가 → namespaces 사용
allowIstiodJwks:
  enabled: true
  targetSelector:
    app.kubernetes.io/name: goti-user

# Phase 2: 외부 서비스 ServiceEntry
serviceEntries: []
