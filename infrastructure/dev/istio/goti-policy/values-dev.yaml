# dev 환경 Istio 정책
# 기본값(values.yaml)과 동일한 필드는 생략 — 차이값만 오버라이드

# Phase 2: 외부 서비스 허용 (OAuth, SMS, AWS)
serviceEntries:
  - name: oauth-google
    hosts:
      - "accounts.google.com"
      - "oauth2.googleapis.com"
      - "www.googleapis.com"
    ports:
      - number: 443
        name: https
        protocol: TLS
  - name: oauth-naver
    hosts:
      - "nid.naver.com"
      - "openapi.naver.com"
    ports:
      - number: 443
        name: https
        protocol: TLS
  - name: oauth-kakao
    hosts:
      - "kauth.kakao.com"
      - "kapi.kakao.com"
    ports:
      - number: 443
        name: https
        protocol: TLS
  - name: sms-nurigo
    hosts:
      - "api.coolsms.co.kr"
    ports:
      - number: 443
        name: https
        protocol: TLS
  - name: aws-services
    hosts:
      - "ssm.ap-northeast-2.amazonaws.com"
      - "secretsmanager.ap-northeast-2.amazonaws.com"
      - "sts.ap-northeast-2.amazonaws.com"
    ports:
      - number: 443
        name: https
        protocol: TLS
