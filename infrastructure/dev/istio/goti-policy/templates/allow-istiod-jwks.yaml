{{- if .Values.allowIstiodJwks.enabled }}
# istiod + envoy sidecar → user 서비스 JWKS 엔드포인트 접근 허용
# RequestAuthentication의 jwksUri를 istiod와 각 서비스의 envoy sidecar가 fetch한다
# deny-all 하에서 이 접근을 명시적으로 허용해야 한다
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-istiod-jwks
spec:
  selector:
    matchLabels:
      {{- toYaml .Values.allowIstiodJwks.targetSelector | nindent 6 }}
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - {{ .Values.allowIstiodJwks.istiodSA | quote }}
            {{- range .Values.allowIstiodJwks.additionalPrincipals }}
              - {{ . | quote }}
            {{- end }}
      to:
        - operation:
            paths: ["/.well-known/jwks.json"]
            methods: ["GET"]
{{- end }}
