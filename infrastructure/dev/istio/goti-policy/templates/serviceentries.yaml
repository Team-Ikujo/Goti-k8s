{{- range .Values.serviceEntries }}
---
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: {{ .name }}
spec:
  hosts:
    {{- range .hosts }}
    - {{ . | quote }}
    {{- end }}
  location: {{ .location | default "MESH_EXTERNAL" }}
  ports:
    {{- toYaml .ports | nindent 4 }}
  resolution: {{ .resolution | default "DNS" }}
{{- end }}
