# Istio Ingress Gateway 공통 values
gateway:
  replicaCount: 2
  service:
    type: LoadBalancer
    ports:
      - name: http2
        port: 80
        targetPort: 80
        protocol: TCP
      - name: https
        port: 443
        targetPort: 443
        protocol: TCP

sharedGateway:
  hosts:
    - "goti.local"
    - "api.go-ti.shop"

# JWT 헤더 위조 방지: Gateway에서 X-User-Id/X-User-Role strip
stripInternalHeaders:
  enabled: true
