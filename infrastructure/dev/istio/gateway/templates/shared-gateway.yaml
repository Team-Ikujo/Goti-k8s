apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: goti-shared-gateway
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    istio: gateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        {{- range .Values.sharedGateway.hosts }}
        - {{ . | quote }}
        {{- end }}
