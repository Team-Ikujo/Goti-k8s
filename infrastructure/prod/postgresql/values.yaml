auth:
  username: goti
  database: goti
  existingSecret: goti-postgresql-auth
  secretKeys:
    adminPasswordKey: postgres-password
    userPasswordKey: password

primary:
  podAnnotations:
    sidecar.istio.io/inject: "false"
    kyverno.io/exclude-image-tag-policy: "true"
    kyverno.io/exclude-label-policy: "true"
    kyverno.io/exclude-resource-limits: "true"
  persistence:
    enabled: true
    storageClass: gp3
    size: 20Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

metrics:
  enabled: false
