# GCP Secret Manager에서 Goti-monitoring private repo 접근 토큰 가져오기
# gitops-repo와 동일한 org-level PAT 재사용 (goti-prod-argocd-github-pat)
# ArgoCD는 argocd.argoproj.io/secret-type: repository 라벨로 레포 인식
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-repo-goti-monitoring
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-store
    kind: ClusterSecretStore
  target:
    name: argocd-repo-goti-monitoring
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: "https://github.com/Team-Ikujo/Goti-monitoring"
        username: git
        password: "{{ .pat }}"
  data:
    - secretKey: pat
      remoteRef:
        key: goti-prod-argocd-github-pat
