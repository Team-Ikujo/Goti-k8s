# GCP Secret Manager에서 Discord webhook URL 가져오기
# GCP SM 키: goti-prod-monitoring-DISCORD_WEBHOOK_URL_HIGH / _LOW
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-discord-webhook
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-store
    kind: ClusterSecretStore
  target:
    name: alertmanager-discord-webhook
    creationPolicy: Owner
  data:
    - secretKey: url-high
      remoteRef:
        key: goti-prod-monitoring-DISCORD_WEBHOOK_URL_HIGH
    - secretKey: url-low
      remoteRef:
        key: goti-prod-monitoring-DISCORD_WEBHOOK_URL_LOW
