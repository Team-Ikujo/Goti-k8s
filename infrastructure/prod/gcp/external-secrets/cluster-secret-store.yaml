# GCP Secret Manager — GKE Workload Identity 기반 인증
# Terraform prod-gcp/modules/gke의 ESO ServiceAccount (goti-prod-eso) → secretmanager.secretAccessor
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: gcp-store
spec:
  provider:
    gcpsm:
      projectID: "goti-gcp"
      auth:
        workloadIdentity:
          clusterLocation: asia-northeast3
          clusterName: goti-prod
          clusterProjectID: "goti-gcp"
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
