# goti-gcp-infra 앱이 참조하는 namespace 사전 생성
# AWS prod에서는 MSA/monitoring appset의 CreateNamespace=true가 생성하지만,
# GCP는 goti-gcp-infra(wave -2)가 이들 ns 참조 리소스(NetworkPolicy, ExternalSecret)를
# 먼저 적용하므로 race condition 발생. sync-wave -3으로 선행 생성.
apiVersion: v1
kind: Namespace
metadata:
  name: goti
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  labels:
    istio-injection: enabled
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  labels:
    istio-injection: enabled
