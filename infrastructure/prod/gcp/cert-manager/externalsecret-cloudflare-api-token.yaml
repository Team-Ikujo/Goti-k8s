# Cloudflare API Token for cert-manager DNS-01 challenge
# GCP SM key: goti-prod-cert-manager-CLOUDFLARE_API_TOKEN
# Token permissions: Zone:DNS:Edit on go-ti.shop
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-store
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef:
        key: goti-prod-cert-manager-CLOUDFLARE_API_TOKEN
