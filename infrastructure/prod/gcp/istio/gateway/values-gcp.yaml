# Istio Ingress Gateway GKE 프로덕션 설정
# AWS(ALB)와 달리 GCP LoadBalancer(L4)를 직접 활용
gateway:
  replicaCount: 2
  service:
    type: LoadBalancer
    annotations:
      # GCP 외부 부하 분산기(External Passthrough Network LB) 생성
      cloud.google.com/load-balancer-type: "External"
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

sharedGateway:
  hosts:
    - "go-ti.shop"
    - "*.go-ti.shop"
  # 2026-04-15: cert-manager DNS-01 (Cloudflare) 로 발급한 wildcard cert 사용.
  # Cloudflare SSL/TLS 는 Full(strict) 로 설정. 초기엔 letsencrypt-staging 으로 발급,
  # 검증 후 prod 로 전환 (credentialName 은 동일 secret 이름 재사용).
  tls:
    enabled: true
    mode: SIMPLE
    credentialName: go-ti-shop-tls
