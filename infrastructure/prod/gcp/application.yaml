# GCP Infrastructure — GKE 전용 인프라 관리 Application
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: goti-infrastructure-gcp
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: infra
  source:
    repoURL: "https://github.com/Team-Ikujo/Goti-k8s.git"
    targetRevision: main
    path: "infrastructure/prod/gcp"
    directory:
      recurse: true
  destination:
    server: "https://kubernetes.default.svc"
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
