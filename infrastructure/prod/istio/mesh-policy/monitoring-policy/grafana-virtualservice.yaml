apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: grafana
  namespace: monitoring
spec:
  hosts:
    - "monitoring.go-ti.shop"
  gateways:
    - istio-system/goti-shared-gateway
  http:
    - route:
        - destination:
            host: kube-prometheus-stack-prod-grafana.monitoring.svc.cluster.local
            port:
              number: 80
