# Istiod EKS 프로덕션 설정
istiod:
  replicaCount: 2
  autoscaleEnabled: true
  autoscaleMin: 2
  # 부하테스트 중단 임시 축소 (2026-04-18): 5 → 2. 부하 재개 시 5로 복구.
  # 부하 없는 상태에서 HPA가 5까지 띄워 core 노드 CPU 압박 유발.
  autoscaleMax: 2
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  # prod: 트레이싱 샘플링 1% (비용 절감)
  traceSampling: 1.0

  meshConfig:
    # 프로덕션: 접근 로그는 샘플링으로 비용 절감 (필요시 활성화)
    accessLogFile: ""
    enableTracing: true
    extensionProviders:
      - name: otel-tracing
        opentelemetry:
          service: otel-front-prod.monitoring.svc.cluster.local
          port: 4317
    # EKS: sidecar가 앱보다 먼저 완전히 기동되도록 보장
    # init container 완료 후 앱 컨테이너 시작 전에 envoy proxy가 ready 상태여야 함
    defaultConfig:
      holdApplicationUntilProxyStarts: true
