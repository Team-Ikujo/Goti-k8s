# Istio Ingress Gateway EKS 프로덕션 설정
# Terraform ALB + TargetGroupBinding으로 연결 — k8s가 LB 생성 안 함
gateway:
  replicaCount: 2
  service:
    type: ClusterIP
    ports:
      - name: http2
        port: 80
        targetPort: 80
        protocol: TCP
      - name: https
        port: 443
        targetPort: 443
        protocol: TCP
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

sharedGateway:
  hosts:
    - "go-ti.shop"
    - "*.go-ti.shop"
