{{- if .Values.peerAuth.permissiveForScrape.enabled }}
# Prometheus scrape용 포트별 PERMISSIVE mTLS
# mesh-wide STRICT에서 Prometheus가 Pod IP 직접 scrape 시 mTLS 미적용 → 503
# sidecar 주입만으로는 해결 불가 — Pod IP scrape은 envoy outbound mTLS를 우회
# 메트릭 포트만 PERMISSIVE로 열어 scrape 허용, 나머지는 STRICT 유지
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: goti-permissive-for-scrape
spec:
  mtls:
    mode: STRICT
  portLevelMtls:
    # observer metrics
    9090:
      mode: PERMISSIVE
    # guardrail metrics (FastAPI)
    8000:
      mode: PERMISSIVE
    # queue-gate metrics (Go/Gin)
    8080:
      mode: PERMISSIVE
{{- end }}
