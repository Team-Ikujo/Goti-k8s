{{- if .Values.allowPrometheus.enabled }}
# Prometheus → goti 서비스 메트릭 스크랩 허용
# monitoring namespace 소스로 제한
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-prometheus-scrape
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces: ["monitoring"]
      to:
        # Istio sidecar 메트릭
        - operation:
            ports: ["15020", "15090"]
            paths: ["/stats/prometheus"]
            methods: ["GET"]
        # Spring Boot actuator (user, ticketing, payment, resale, stadium, queue)
        - operation:
            ports: ["8080"]
            paths: ["/actuator/prometheus"]
            methods: ["GET"]
        # load-observer (Go metrics collector)
        - operation:
            ports: ["9090"]
            paths: ["/metrics"]
            methods: ["GET"]
        # guardrail (Go/Gin)
        - operation:
            ports: ["8000"]
            paths: ["/metrics"]
            methods: ["GET"]
{{- end }}
