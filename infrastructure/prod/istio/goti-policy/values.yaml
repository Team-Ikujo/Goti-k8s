# Goti namespace Istio 정책 기본값
# deny-all + allow 정책은 반드시 동시 배포

denyAll:
  enabled: true

allowGateway:
  enabled: true
  # Istio Gateway Helm release의 ServiceAccount 이름
  gatewaySA: "cluster.local/ns/istio-system/sa/istio-gateway"

allowPrometheus:
  enabled: true

# prod: Pod IP 직접 scrape 시 envoy mTLS 미적용 → 포트별 PERMISSIVE 필요
peerAuth:
  permissiveForScrape:
    enabled: true

allowKubeletProbes:
  enabled: true

# Phase 2: 외부 서비스 ServiceEntry
serviceEntries: []
