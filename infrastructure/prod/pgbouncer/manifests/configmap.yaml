# PgBouncer config — 서비스별 DB 이름으로 search_path 고정 (ADR 0013)
# pgbouncer 는 databases 섹션에서 `options=` 키를 지원하지 않는다.
# connect_query 로 서버 연결 시점에 search_path 를 고정하고,
# server_reset_query 는 search_path 를 보존하기 위해 DISCARD PLANS 로 약화한다.
# (prepared statement 는 app 이 SimpleProtocol 을 쓰므로 잔류 위험 없음)
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: goti
data:
  pgbouncer.ini: |
    [databases]
    goti_ticketing = host=DB_HOST_PLACEHOLDER port=5432 dbname=goti user=goti connect_query='SET search_path TO ticketing_service'
    goti_stadium   = host=DB_HOST_PLACEHOLDER port=5432 dbname=goti user=goti connect_query='SET search_path TO stadium_service'
    goti_user      = host=DB_HOST_PLACEHOLDER port=5432 dbname=goti user=goti connect_query='SET search_path TO user_service'
    goti_payment   = host=DB_HOST_PLACEHOLDER port=5432 dbname=goti user=goti connect_query='SET search_path TO payment_service'
    goti_resale    = host=DB_HOST_PLACEHOLDER port=5432 dbname=goti user=goti connect_query='SET search_path TO resale_service'
    goti_queue     = host=DB_HOST_PLACEHOLDER port=5432 dbname=goti user=goti connect_query='SET search_path TO queue_service'

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 5432

    auth_type = scram-sha-256
    auth_file = /etc/pgbouncer/userlist.txt

    pool_mode = transaction
    default_pool_size = 40
    min_pool_size = 5
    reserve_pool_size = 10
    reserve_pool_timeout = 3
    max_client_conn = 5000

    server_lifetime = 3600
    server_idle_timeout = 300
    ; search_path 를 connect_query 로 고정했으므로 DISCARD ALL (RESET ALL 포함) 금지.
    ; DISCARD PLANS 로 약화 — SimpleProtocol 사용 중이라 prepared statement 잔류 없음.
    server_reset_query = DISCARD PLANS

    server_tls_sslmode = require

    ignore_startup_parameters = extra_float_digits,application_name,search_path,options

    log_connections = 1
    log_disconnections = 0
    log_pooler_errors = 1
    stats_period = 60

    admin_users = goti
    stats_users = goti
