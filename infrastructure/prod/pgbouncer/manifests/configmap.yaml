# PgBouncer config — 서비스별 DB 이름으로 search_path 고정 (ADR 0013)
# 각 서비스는 pgbouncer 에 dbname=goti_{svc} 로 접속, pgbouncer 는 내부적으로
# options='-c search_path={svc}_service' 로 RDS 연결.
# → transaction pool mode 에서도 search_path 가 server connection 에 안전 고정.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: goti
data:
  pgbouncer.ini: |
    [databases]
    goti_ticketing = host=DB_HOST_PLACEHOLDER port=5432 dbname=goti user=goti options='-c search_path=ticketing_service'
    goti_stadium   = host=DB_HOST_PLACEHOLDER port=5432 dbname=goti user=goti options='-c search_path=stadium_service'
    goti_user      = host=DB_HOST_PLACEHOLDER port=5432 dbname=goti user=goti options='-c search_path=user_service'
    goti_payment   = host=DB_HOST_PLACEHOLDER port=5432 dbname=goti user=goti options='-c search_path=payment_service'
    goti_resale    = host=DB_HOST_PLACEHOLDER port=5432 dbname=goti user=goti options='-c search_path=resale_service'
    goti_queue     = host=DB_HOST_PLACEHOLDER port=5432 dbname=goti user=goti options='-c search_path=queue_service'

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 5432

    auth_type = scram-sha-256
    auth_file = /etc/pgbouncer/userlist.txt

    pool_mode = transaction
    default_pool_size = 40
    min_pool_size = 5
    reserve_pool_size = 10
    reserve_pool_timeout = 3
    max_client_conn = 5000

    server_lifetime = 3600
    server_idle_timeout = 300
    server_reset_query = DISCARD ALL

    server_tls_sslmode = require

    ; search_path 는 서비스별 databases 섹션의 options 로 주입되므로 client 측 startup 에서 제외 가능.
    ignore_startup_parameters = extra_float_digits,application_name,search_path

    log_connections = 1
    log_disconnections = 0
    log_pooler_errors = 1
    stats_period = 60

    admin_users = goti
    stats_users = goti
