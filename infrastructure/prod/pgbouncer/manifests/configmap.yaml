# PgBouncer config — transaction pooling mode
# ADR 0013 — goti-server 계열 Go 서비스의 connection 고갈 대응
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: goti
data:
  pgbouncer.ini: |
    [databases]
    ; goti — primary (write + consistent read). goti_ro 는 replica 도입 후 추가.
    goti = host=${DB_HOST} port=5432 dbname=goti auth_user=${DB_USER}

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 6432

    ; --- Authentication ---
    auth_type = scram-sha-256
    auth_file = /etc/pgbouncer/userlist.txt

    ; --- Pooling ---
    ; transaction mode — prepared statement 공유 제약, LISTEN/NOTIFY 불가
    ; (Goti-go 는 pgx PgBouncerCompat=true 로 Simple Protocol 전환)
    pool_mode = transaction

    ; per (db, user) pool — goti 단일 DB/single user 라 이 값이 실 DB 연결 상한의 메인
    default_pool_size = 40

    ; idle 초과 시 즉시 반환
    min_pool_size = 5
    reserve_pool_size = 10
    reserve_pool_timeout = 3

    ; 클라이언트 수용량 — Goti 앱 논리 conn 총합 (6 services × pool 500 × HPA 고려해도 여유)
    max_client_conn = 5000

    ; 연결 수명
    server_lifetime = 3600
    server_idle_timeout = 300
    server_reset_query = DISCARD ALL

    ; TLS to RDS (AWS 기본 활성)
    server_tls_sslmode = require

    ; 관측 — stats exporter용
    ignore_startup_parameters = extra_float_digits,application_name,search_path

    ; 로그
    log_connections = 1
    log_disconnections = 0
    log_pooler_errors = 1
    stats_period = 60

    admin_users = admin
    stats_users = stats
