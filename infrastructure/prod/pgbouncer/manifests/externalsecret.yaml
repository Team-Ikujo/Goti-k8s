# PgBouncer 가 RDS 로 접속할 때 사용할 credentials
# AWS SSM /prod/pgbouncer/* 또는 /prod/rds/* 에서 주입.
# userlist.txt 내용: "username" "password_hash_or_plain"
#
# 주의: userlist.txt 는 scram-sha-256 해시 또는 cleartext password 중 택일.
# pgbouncer 가 서버에 전달할 때 auth_type 과 맞춰야 한다.
#
# NOTE: AWS SSM Parameter Store 에 아래 2개 파라미터를 사전 등록해야 함
#   /prod/pgbouncer/userlist         — "username" "plainPassword" 포맷 (1 line)
#   /prod/pgbouncer/db-host          — RDS primary endpoint
#   /prod/pgbouncer/db-user          — RDS master username (예: goti)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pgbouncer-secret
  namespace: goti
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: pgbouncer-secret
    creationPolicy: Owner
  dataFrom:
    - find:
        path: /prod/pgbouncer
        name:
          regexp: ".*"
      rewrite:
        - regexp:
            source: "^/prod/pgbouncer/(.*)$"
            target: "$1"
