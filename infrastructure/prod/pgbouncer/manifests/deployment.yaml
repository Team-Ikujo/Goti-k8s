# PgBouncer Deployment — 2 replicas HA (ADR 0013 Phase A)
# ConfigMap 기반 multi-db 설정: 각 서비스는 dbname=goti_{svc} 로 접속,
# PgBouncer 가 options='-c search_path={svc}_service' 를 server conn 에 주입.
# → transaction pool mode 에서도 search_path 안전 고정.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: goti
  labels:
    app: pgbouncer
    version: v1
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
        version: v1
        monitoring: "true"
      annotations:
        # 5432: PostgreSQL wire protocol — sidecar 통과 불가, exclude 필수.
        # 9127: HTTP metrics — sidecar 가 mTLS 받아 exporter 로 전달해야 ambient ztunnel
        #       (monitoring ns) 에서 mTLS 로 scrape 가능. exclude 하면 503 발생.
        traffic.sidecar.istio.io/excludeInboundPorts: "5432"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - key: "node-role"
          value: "spot"
          effect: "NoSchedule"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: pgbouncer
      terminationGracePeriodSeconds: 120
      initContainers:
        - name: render-config
          image: busybox:1.37
          command: ["sh", "-c"]
          args:
            - |
              set -e
              sed "s|DB_HOST_PLACEHOLDER|$DB_HOST|g" /etc/pgbouncer-template/pgbouncer.ini > /etc/pgbouncer/pgbouncer.ini
              printf '"%s" "%s"\n' "$DB_USER" "$DB_PASSWORD" > /etc/pgbouncer/userlist.txt
              chmod 600 /etc/pgbouncer/userlist.txt
          env:
            - name: DB_HOST
              valueFrom: { secretKeyRef: { name: pgbouncer-secret, key: db-host } }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: pgbouncer-secret, key: db-user } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: pgbouncer-secret, key: db-user-password } }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          volumeMounts:
            - name: config-template
              mountPath: /etc/pgbouncer-template
            - name: config-runtime
              mountPath: /etc/pgbouncer
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:v1.23.1-p3
          # initContainer 가 /etc/pgbouncer/pgbouncer.ini 를 미리 생성해두면 edoburu
          # entrypoint 가 env 기반 ini 생성 대신 그 파일을 사용한다.
          ports:
            - containerPort: 5432
              name: pgbouncer
          readinessProbe:
            tcpSocket: { port: 5432 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 5432 }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: false
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          volumeMounts:
            - name: config-runtime
              mountPath: /etc/pgbouncer
        # Prometheus exporter (ADR 0013 Phase D)
        # 비밀번호 특수문자(|, %, ^, #) 때문에 DSN URL parse 실패 → SSM 에 url-encoded 사본
        # (/prod/pgbouncer/db-user-password-urlenc) 을 별도 키로 보관해 그대로 주입한다.
        - name: exporter
          image: prometheuscommunity/pgbouncer-exporter:v0.12.0
          args:
            - "--pgBouncer.connectionString=postgres://$(EXPORTER_USER):$(EXPORTER_PASSWORD_URLENC)@localhost:5432/pgbouncer?sslmode=disable"
            - "--web.listen-address=:9127"
          ports:
            - containerPort: 9127
              name: metrics
          env:
            - name: EXPORTER_USER
              valueFrom: { secretKeyRef: { name: pgbouncer-secret, key: db-user } }
            - name: EXPORTER_PASSWORD_URLENC
              valueFrom: { secretKeyRef: { name: pgbouncer-secret, key: db-user-password-urlenc } }
          readinessProbe:
            httpGet: { path: /metrics, port: 9127 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /metrics, port: 9127 }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
      volumes:
        - name: config-template
          configMap:
            name: pgbouncer-config
        - name: config-runtime
          emptyDir: {}
