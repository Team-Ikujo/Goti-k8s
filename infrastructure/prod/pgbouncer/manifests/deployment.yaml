# PgBouncer Deployment — 2 replicas HA (ADR 0013 Phase A)
# edoburu/pgbouncer 는 env 변수 기반 자동 설정. ConfigMap 마운트 불필요.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: goti
  labels:
    app: pgbouncer
    version: v1
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
        version: v1
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - key: "node-role"
          value: "spot"
          effect: "NoSchedule"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: pgbouncer
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:v1.23.1-p3
          ports:
            - containerPort: 5432
              name: pgbouncer
          env:
            # edoburu entrypoint 가 DATABASE_URL 을 파싱해 pgbouncer.ini 를 생성
            - name: DB_HOST
              valueFrom: { secretKeyRef: { name: pgbouncer-secret, key: db-host } }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: pgbouncer-secret, key: db-user } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: pgbouncer-secret, key: db-user-password } }
            - name: DB_NAME
              value: "goti"
            # 연결 풀 설정 (ADR 0013)
            - name: POOL_MODE
              value: "transaction"
            - name: MAX_CLIENT_CONN
              value: "5000"
            - name: DEFAULT_POOL_SIZE
              value: "40"
            - name: MIN_POOL_SIZE
              value: "5"
            - name: RESERVE_POOL_SIZE
              value: "10"
            - name: RESERVE_POOL_TIMEOUT
              value: "3"
            - name: SERVER_RESET_QUERY
              value: "DISCARD ALL"
            - name: SERVER_IDLE_TIMEOUT
              value: "300"
            - name: SERVER_LIFETIME
              value: "3600"
            - name: AUTH_TYPE
              value: "scram-sha-256"
            - name: SERVER_TLS_SSLMODE
              value: "require"
            - name: IGNORE_STARTUP_PARAMETERS
              value: "extra_float_digits,application_name,search_path"
            - name: LISTEN_ADDR
              value: "0.0.0.0"
            - name: LISTEN_PORT
              value: "5432"
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: false  # edoburu entrypoint 가 /etc/pgbouncer 에 쓰기 필요
