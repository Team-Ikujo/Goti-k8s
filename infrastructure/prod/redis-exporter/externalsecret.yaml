# ElastiCache auth token — SSM /prod/server/REDIS_AUTH_TOKEN
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-exporter-auth
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: redis-exporter-auth
    creationPolicy: Owner
  data:
    - secretKey: REDIS_AUTH_TOKEN
      remoteRef:
        key: /prod/server/REDIS_AUTH_TOKEN
