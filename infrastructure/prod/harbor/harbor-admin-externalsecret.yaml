# Harbor 어드민 비밀번호 — AWS SSM에서 가져오기
# SSM 경로: /prod/harbor/ADMIN_PASSWORD
# Harbor chart의 existingSecretAdminPassword 로 참조됨
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-admin-externalsecret
  namespace: harbor
  annotations:
    argocd.argoproj.io/sync-wave: "4"  # Harbor 설치(wave 5) 전에 시크릿 생성
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: harbor-admin-secret
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: /prod/harbor/ADMIN_PASSWORD
