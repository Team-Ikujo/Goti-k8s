# Harbor Istio VirtualService
# harbor.go-ti.shop → harbor-core:80 (portal/API)
# harbor.go-ti.shop/v2/ → harbor-registry:5000 (Docker Registry v2 API)
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: harbor
  namespace: harbor
spec:
  hosts:
    - "harbor.go-ti.shop"
  gateways:
    - istio-system/goti-shared-gateway
  http:
    - match:
        - uri:
            prefix: /v2/
        - uri:
            prefix: /service/
      route:
        - destination:
            host: harbor-registry
            port:
              number: 5000
    - route:
        - destination:
            host: harbor-portal
            port:
              number: 80
