# Harbor Istio VirtualService
# 모든 트래픽을 harbor-portal:80으로 라우팅
# harbor-portal(nginx)이 내부적으로 처리:
#   /        → portal UI
#   /api/    → harbor-core:8080
#   /v2/     → harbor-core → harbor-registry (인증 포함)
#   /service/→ harbor-core
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: harbor
  namespace: harbor
spec:
  hosts:
    - "harbor.go-ti.shop"
  gateways:
    - istio-system/goti-shared-gateway
  http:
    - route:
        - destination:
            host: harbor
            port:
              number: 80
      headers:
        request:
          set:
            X-Forwarded-Proto: "https"
