# Harbor EKS 프로덕션 설정
# 외부 접근: https://harbor.go-ti.shop (Istio Gateway)
# 어드민 비밀번호: ESO → harbor-admin-secret (harbor-admin-externalsecret.yaml)

expose:
  type: clusterIP  # Istio IngressGateway로 노출, LB는 Harbor가 직접 생성하지 않음
  tls:
    enabled: false  # Istio Gateway에서 TLS 종단

externalURL: https://harbor.go-ti.shop

# 어드민 초기 비밀번호 — ESO가 harbor-admin-secret을 생성한 후 Harbor가 참조
existingSecretAdminPassword: harbor-admin-secret
existingSecretAdminPasswordKey: password

persistence:
  enabled: true
  resourcePolicy: ""
  persistentVolumeClaim:
    registry:
      storageClass: gp3
      size: 100Gi
    jobservice:
      jobLog:
        storageClass: gp3
        size: 5Gi
    database:
      storageClass: gp3
      size: 20Gi
    redis:
      storageClass: gp3
      size: 5Gi
    trivy:
      storageClass: gp3
      size: 10Gi

# Istio sidecar 제외 — Harbor 내부 컴포넌트 간 통신이 mTLS와 충돌
podAnnotations:
  sidecar.istio.io/inject: "false"
  kyverno.io/exclude-image-tag-policy: "true"
  kyverno.io/exclude-label-policy: "true"
  kyverno.io/exclude-resource-limits: "true"

portal:
  podAnnotations:
    sidecar.istio.io/inject: "false"
    kyverno.io/exclude-image-tag-policy: "true"
    kyverno.io/exclude-label-policy: "true"
    kyverno.io/exclude-resource-limits: "true"

core:
  podAnnotations:
    sidecar.istio.io/inject: "false"
    kyverno.io/exclude-image-tag-policy: "true"
    kyverno.io/exclude-label-policy: "true"
    kyverno.io/exclude-resource-limits: "true"

jobservice:
  podAnnotations:
    sidecar.istio.io/inject: "false"
    kyverno.io/exclude-image-tag-policy: "true"
    kyverno.io/exclude-label-policy: "true"
    kyverno.io/exclude-resource-limits: "true"

registry:
  # 노드 교체 시 EBS 볼륨 퍼미션 재적용 보장 (2026-04-08 permission denied 장애 대응)
  podSecurityContext:
    fsGroup: 10000
    fsGroupChangePolicy: Always
  podAnnotations:
    sidecar.istio.io/inject: "false"
    kyverno.io/exclude-image-tag-policy: "true"
    kyverno.io/exclude-label-policy: "true"
    kyverno.io/exclude-resource-limits: "true"

trivy:
  podAnnotations:
    sidecar.istio.io/inject: "false"
    kyverno.io/exclude-image-tag-policy: "true"
    kyverno.io/exclude-label-policy: "true"
    kyverno.io/exclude-resource-limits: "true"

database:
  internal:
    podAnnotations:
      sidecar.istio.io/inject: "false"
      kyverno.io/exclude-image-tag-policy: "true"
      kyverno.io/exclude-label-policy: "true"
      kyverno.io/exclude-resource-limits: "true"

redis:
  internal:
    podAnnotations:
      sidecar.istio.io/inject: "false"
      kyverno.io/exclude-image-tag-policy: "true"
      kyverno.io/exclude-label-policy: "true"
      kyverno.io/exclude-resource-limits: "true"
