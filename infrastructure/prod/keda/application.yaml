apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: infra
  source:
    repoURL: https://kedacore.github.io/charts
    chart: keda
    targetRevision: "2.*.*"
    helm:
      valuesObject:
        podAnnotations:
          operator:
            sidecar.istio.io/inject: "false"
          webhooks:
            sidecar.istio.io/inject: "false"
          metricsAdapter:
            sidecar.istio.io/inject: "false"
        prometheus:
          metricServer:
            enabled: true
            serviceMonitor:
              enabled: true
              additionalLabels:
                release: kube-prometheus-stack-prod
              interval: 30s
            podMonitor:
              enabled: false
          operator:
            enabled: true
            serviceMonitor:
              enabled: true
              additionalLabels:
                release: kube-prometheus-stack-prod
              interval: 30s
            podMonitor:
              enabled: false
          webhooks:
            enabled: false
        resources:
          operator:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          metricServer:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: keda
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
