---
# Blackbox exporter로 Harbor 헬스체크
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: harbor-health
  namespace: monitoring
spec:
  interval: 30s
  module: http_2xx
  prober:
    url: blackbox-exporter-prometheus-blackbox-exporter.monitoring.svc:9115
  targets:
    staticConfig:
      static:
        - https://harbor.go-ti.shop/api/v2.0/health
---
# Harbor 다운 알림 룰
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: harbor-failover
  namespace: monitoring
spec:
  groups:
    - name: harbor.failover
      rules:
        - alert: HarborDown
          expr: probe_success{job="harbor-health"} == 0
          for: 2m        # 2분 연속 실패 시 alert
          labels:
            severity: critical
          annotations:
            summary: "Harbor registry 장애 감지"
            description: "harbor.go-ti.shop 헬스체크 2분 이상 실패"

        - alert: HarborRecovered
          expr: probe_success{job="harbor-health"} == 1
          for: 2m        # 2분 연속 성공 시 복구로 판단
          labels:
            severity: info
          annotations:
            summary: "Harbor registry 복구 감지"
            description: "harbor.go-ti.shop 헬스체크 정상 복구"
