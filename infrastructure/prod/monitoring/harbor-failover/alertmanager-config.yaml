---
# ✅ AlertManager 설정 (Goti-monitoring 레포에 적용)
#
# ExternalSecret 연동 방법:
# 1. ExternalSecret이 SSM에서 webhook URL을 가져와 Secret 생성
# 2. AlertManager가 Secret을 파일로 마운트
# 3. AlertManager config에서 파일 경로 참조
#
# kube-prometheus-stack values.yaml 설정:

alertmanager:
  config:
    global:
      resolve_timeout: 5m
      # ExternalSecret으로 생성된 Secret을 파일로 참조
      slack_api_url_file: /etc/alertmanager/secrets/alertmanager-slack-webhook/url
    
    route:
      group_by: ["alertname", "severity"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: "slack-default"
      routes:
        # Harbor 장애 시 Slack + GitHub Webhook 동시 실행
        - matchers:
            - alertname =~ "HarborDown|HarborRecovered"
          receiver: "harbor-failover-receiver"
          continue: true  # slack-critical도 함께 실행
        
        # Critical 알림
        - matchers:
            - severity = critical
          receiver: "slack-critical"
          repeat_interval: 1h
    
    receivers:
      # Harbor failover: Slack + Webhook
      - name: "harbor-failover-receiver"
        slack_configs:
          - channel: "C0AHGKSGD5Y"
            # api_url 생략 → global.slack_api_url_file 사용
            title: "[{{ .Status | toUpper }}] Harbor 레지스트리 상태 변경"
            text: >-
              *Description*: {{ .CommonAnnotations.description }}
              *Action*: Harbor 장애 감지로 인해 ECR 전환 파이프라인(PR)이 트리거됩니다.
            send_resolved: true
        webhook_configs:
          - url: "http://webhook-bridge.monitoring.svc:8080"
            send_resolved: true
      
      # 기본 Slack 알림
      - name: "slack-default"
        slack_configs:
          - channel: "C0AHGKSGD5Y"
            # api_url 생략 → global.slack_api_url_file 사용
            title: "[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}"
            text: >-
              *Severity*: {{ .CommonLabels.severity }}
              *Description*: {{ .CommonAnnotations.description }}
              *Instance*: {{ .CommonLabels.instance }}
            send_resolved: true
      
      # Critical 알림
      - name: "slack-critical"
        slack_configs:
          - channel: "C0AHGKSGD5Y"
            # api_url 생략 → global.slack_api_url_file 사용
            title: "[CRITICAL] {{ .CommonLabels.alertname }}"
            text: >-
              *Severity*: {{ .CommonLabels.severity }}
              *Description*: {{ .CommonAnnotations.description }}
              *Instance*: {{ .CommonLabels.instance }}
            send_resolved: true
    
    inhibit_rules:
      - source_matchers:
          - severity = critical
        target_matchers:
          - severity = warning
        equal: ["alertname", "instance"]
  
  alertmanagerSpec:
    # ExternalSecret으로 생성된 Secret을 AlertManager에 마운트
    secrets:
      - alertmanager-slack-webhook

apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config-guide
  namespace: monitoring
data:
  README.md: |
    # AlertManager Slack 알림 설정 가이드
    
    ## 현재 상태
    - harbor-failover route: webhook-bridge로만 연결
    - Slack 알림: 미설정
    
    ## 설정 방법
    
    ### 1. SSM에 Slack Webhook URL 저장
    ```bash
    aws ssm put-parameter \
      --name /prod/monitoring/SLACK_WEBHOOK_URL \
      --value "https://hooks.slack.com/services/YOUR/WEBHOOK/URL" \
      --type SecureString \
      --region ap-northeast-2
    ```
    
    ### 2. ExternalSecret 배포
    - 파일: infrastructure/prod/external-secrets/config/alertmanager-slack-externalsecret.yaml
    - 자동으로 Secret 생성: alertmanager-slack-webhook
    
    ### 3. Goti-monitoring 레포 수정
    레포: https://github.com/Team-Ikujo/Goti-monitoring
    파일: values-stacks/prod/kube-prometheus-stack-values.yaml
    
    위 주석의 alertmanager 설정을 추가
    
    ### 4. 채널 ID 확인
    현재 채널: C0AHGKSGD5Y
    
    Slack 채널 ID 확인 방법:
    - Slack 채널 우클릭 → 채널 세부정보 보기
    - 하단에 채널 ID 표시
    
    ## 알림 흐름
    1. Harbor 장애 감지 (PrometheusRule)
    2. AlertManager가 두 receiver로 전송:
       - webhook-bridge (GitHub Actions 트리거)
       - slack-critical (팀 알림)
    3. 복구 시에도 동일하게 알림


---
# 📝 설정 설명

## Secret 마운트 흐름

1. **ExternalSecret** (Goti-k8s 레포)
   ```yaml
   # infrastructure/prod/external-secrets/config/alertmanager-slack-externalsecret.yaml
   data:
     - secretKey: url
       remoteRef:
         key: /prod/monitoring/SLACK_WEBHOOK_URL
   ```
   → SSM에서 webhook URL을 가져와 Secret 생성

2. **AlertManager Secret 마운트** (Goti-monitoring 레포)
   ```yaml
   alertmanagerSpec:
     secrets:
       - alertmanager-slack-webhook  # Secret 이름
   ```
   → Secret이 `/etc/alertmanager/secrets/alertmanager-slack-webhook/url`로 마운트됨

3. **AlertManager Config에서 참조**
   ```yaml
   global:
     slack_api_url_file: /etc/alertmanager/secrets/alertmanager-slack-webhook/url
   ```
   → 모든 slack_configs가 이 파일의 URL 사용

## 왜 api_url을 생략하나?

- `api_url` 생략 시 → `global.slack_api_url_file` 사용
- 모든 receiver가 동일한 webhook URL 사용
- Secret 업데이트 시 자동 반영 (config 수정 불필요)

## 배포 순서

1. Goti-k8s: ExternalSecret 배포
2. SSM에 webhook URL 저장
3. Goti-monitoring: AlertManager 설정 업데이트
4. ArgoCD 동기화
