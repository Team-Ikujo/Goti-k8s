apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: argocd-server
  namespace: argocd
spec:
  hosts:
    - "argocd.go-ti.shop"
  gateways:
    - istio-system/goti-shared-gateway
  http:
    - route:
        - destination:
            host: argocd-server
            port:
              number: 80
