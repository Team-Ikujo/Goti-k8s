apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-google-oauth
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: argocd-google-oauth
    creationPolicy: Owner
  data:
    - secretKey: clientID
      remoteRef:
        key: /prod/argocd/GOOGLE_CLIENT_ID
    - secretKey: clientSecret
      remoteRef:
        key: /prod/argocd/GOOGLE_CLIENT_SECRET
    

       