# gp3 StorageClass — EBS CSI 드라이버 기반 기본 스토리지 클래스
# gp2(in-tree) 대비 성능 향상 및 비용 절감
# WaitForFirstConsumer: Pod 스케줄링 후 AZ에 맞춰 볼륨 생성
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  fsType: ext4
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
