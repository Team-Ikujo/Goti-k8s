apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: goti-app
spec:
  # Bottlerocket — 불변 읽기전용 OS, 공격 표면 최소화
  # v1에서 amiFamily 단독 사용 불가 → amiSelectorTerms[].alias 로 지정
  amiSelectorTerms:
    - alias: bottlerocket@latest
  role: goti-prod-node-group-role  # foundation 모듈의 node_group IAM role 이름
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: goti-prod
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: goti-prod
  # IMDSv2 — hop limit 2: 컨테이너 내부에서도 IMDS 접근 가능하도록
  # (기본값 1은 host-level에서만 동작, Bottlerocket 부트스트랩 안정성 향상)
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 2
    httpTokens: required
  # Bottlerocket bootstrap 명시적 주입 — Karpenter auto-generate 오동작 방지
  # eks:DescribeCluster 결과가 user-data에 정확히 반영되도록 명시
  userData: |
    [settings.kubernetes]
    api-server = "https://14C4EFEEB6DB918B4B79B868A168AF6F.gr7.ap-northeast-2.eks.amazonaws.com"
    cluster-name = "goti-prod"
    cluster-certificate = ""
  tags:
    Name: goti-prod-karpenter-node
    Environment: prod
