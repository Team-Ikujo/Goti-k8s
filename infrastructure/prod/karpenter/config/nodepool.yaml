apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: goti-app
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: goti-app
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]  # Red Team 대비: spot 회수로 인한 서비스 중단 방지 (이후 spot 복원)
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            # 주력 (현재 Spot NodeGroup과 동일)
            - t3a.xlarge   # 4c/16G
            - t3.xlarge    # 4c/16G
            # 대체 (Spot 재고 부족 시 fallback)
            - t3a.large    # 2c/8G
            - t3.large     # 2c/8G
            # 버스트용 (티켓팅 급증 대비)
            - m5a.xlarge   # 4c/16G, 네트워크 성능 우수
            - m5.xlarge    # 4c/16G
            - c5a.xlarge   # 4c/8G, CPU 집약 작업용
            - c5.xlarge    # 4c/8G
        - key: topology.kubernetes.io/zone
          operator: In
          values: ["ap-northeast-2a", "ap-northeast-2b", "ap-northeast-2c"]
      # Spot NodeGroup과 동일한 taint — 앱 Pod만 여기에 스케줄
      taints:
        - key: node-role
          value: spot
          effect: NoSchedule
  limits:
    cpu: "100"
    memory: 400Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    # 티켓팅 특성상 트래픽 급증 대비 — 너무 빠른 consolidation 방지
    consolidateAfter: 5m
