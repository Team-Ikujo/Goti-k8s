apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: goti-app
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: goti-app
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["t3.xlarge", "t3a.xlarge", "m5.xlarge", "m5a.xlarge"]
        - key: topology.kubernetes.io/zone
          operator: In
          values: ["ap-northeast-2a", "ap-northeast-2b", "ap-northeast-2c"]
      # Spot NodeGroup과 동일한 taint — 앱 Pod만 여기에 스케줄
      taints:
        - key: node-role
          value: spot
          effect: NoSchedule
  limits:
    cpu: "100"
    memory: 400Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    # 티켓팅 특성상 트래픽 급증 대비 — 너무 빠른 consolidation 방지
    consolidateAfter: 5m
