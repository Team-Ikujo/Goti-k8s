apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: infra
  source:
    # v1.x는 OCI 레지스트리 사용 (charts.karpenter.sh는 v0.x 전용)
    repoURL: public.ecr.aws/karpenter
    chart: karpenter
    targetRevision: "1.*.*"
    helm:
      valuesObject:
        serviceAccount:
          annotations:
            # terraform output karpenter_role_arn 값
            # 패턴: arn:aws:iam::<account_id>:role/<cluster_name>-karpenter-role
            eks.amazonaws.com/role-arn: "arn:aws:iam::707925622666:role/goti-prod-karpenter-role"
        settings:
          clusterName: goti-prod
          clusterEndpoint: "https://14C4EFEEB6DB918B4B79B868A168AF6F.gr7.ap-northeast-2.eks.amazonaws.com"
          # terraform output → SSM /prod/karpenter/QUEUE_NAME
          # 패턴: <cluster_name>-karpenter
          interruptionQueue: "goti-prod-karpenter"
        serviceMonitor:
          enabled: true
          additionalLabels:
            release: kube-prometheus-stack-prod
          endpointConfig:
            interval: 30s
        podAnnotations:
          sidecar.istio.io/inject: "false"
          kyverno.io/exclude-image-tag-policy: "true"
          kyverno.io/exclude-label-policy: "true"
          kyverno.io/exclude-resource-limits: "true"
  destination:
    server: https://kubernetes.default.svc
    namespace: karpenter
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
