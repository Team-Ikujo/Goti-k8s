apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: goti-redis
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"  # MSA 서비스보다 먼저 배포 (goti-applicationsets wave 0 이전)
spec:
  project: default
  sources:
    - repoURL: https://charts.bitnami.com/bitnami
      chart: redis
      targetRevision: 25.*
      helm:
        valueFiles:
          - $values/infrastructure/prod/redis/values.yaml
    - repoURL: https://github.com/Team-Ikujo/Goti-k8s.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: goti
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
