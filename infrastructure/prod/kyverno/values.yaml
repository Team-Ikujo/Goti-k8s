# Kyverno prod values — 부하테스트 대비 리소스 절약 (replicas 축소)

admissionController:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

backgroundController:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

cleanupController:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

reportsController:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Kyverno webhook은 ArgoCD가 관리하는 Namespace에서 동작해야 하므로
# argocd, kyverno, istio-system namespace는 정책 적용에서 제외
features:
  policyExceptions:
    enabled: true

config:
  excludeGroups:
    - system:nodes
  webhooks:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kyverno
            - argocd
            - istio-system
            - kube-system
