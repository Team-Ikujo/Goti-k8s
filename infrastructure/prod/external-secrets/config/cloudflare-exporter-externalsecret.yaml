# Cloudflare Exporter API Token — SSM Parameter Store에서 동기화
# SSM 경로: /prod/monitoring/CLOUDFLARE_API_TOKEN
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-exporter-secret
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: cloudflare-exporter-secret
    creationPolicy: Owner
  data:
    - secretKey: CF_API_TOKEN
      remoteRef:
        key: /prod/monitoring/CLOUDFLARE_API_TOKEN
