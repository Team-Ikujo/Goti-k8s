# ECR 인증 토큰을 ESO Generator로 자동 갱신하여 ecr-creds 시크릿 생성
# ECRAuthorizationToken: IRSA로 ECR 토큰을 6시간마다 갱신
# (ECR 토큰 만료 시간 12h 기준, 6h 간격으로 갱신)
apiVersion: generators.external-secrets.io/v1alpha1
kind: ECRAuthorizationToken
metadata:
  name: ecr-token
  namespace: goti
spec:
  region: ap-northeast-2
  auth:
    jwt:
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ecr-creds
  namespace: goti
spec:
  refreshInterval: 6h
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ECRAuthorizationToken
          name: ecr-token
  target:
    name: ecr-creds
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"{{ trimPrefix "https://" .proxy_endpoint }}":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
