# ArgoCD Repository 자격증명 — Goti-monitoring private repo 접근
# SSM 경로: /prod/argocd/GITHUB_PAT
# ArgoCD는 argocd.argoproj.io/secret-type: repository 라벨로 레포 인식
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-repo-goti-monitoring
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: argocd-repo-goti-monitoring
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        url: "https://github.com/Team-Ikujo/Goti-monitoring.git"
        type: "git"
        username: "git"
        password: "{{ .githubPat }}"
  data:
    - secretKey: githubPat
      remoteRef:
        key: /prod/argocd/GITHUB_PAT
