# ClusterSecretStore — EKS IRSA 기반 AWS SSM 연결
# dev와 달리 IAM User 대신 IRSA(ServiceAccount annotation)로 인증
# IRSA 설정: external-secrets ServiceAccount에 IAM Role annotation 추가
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-ssm
spec:
  conditions:
    - namespaces:
        - goti
        - monitoring
        - argocd
        - karpenter
  provider:
    aws:
      service: ParameterStore
      region: ap-northeast-2
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
