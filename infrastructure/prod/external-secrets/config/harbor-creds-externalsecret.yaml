# Harbor registry 인증 정보를 SSM에서 가져와 imagePullSecret 생성
# SSM 경로: /prod/harbor/REGISTRY, /prod/harbor/USERNAME, /prod/harbor/PASSWORD
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-creds
  namespace: goti
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: harbor-creds
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"{{ .registry }}":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    - secretKey: registry
      remoteRef:
        key: /prod/harbor/REGISTRY
    - secretKey: username
      remoteRef:
        key: /prod/harbor/USERNAME
    - secretKey: password
      remoteRef:
        key: /prod/harbor/PASSWORD
