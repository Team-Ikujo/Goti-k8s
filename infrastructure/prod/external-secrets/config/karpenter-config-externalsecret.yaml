# Karpenter IRSA Role ARN / SQS Queue 정보를 SSM에서 읽어 karpenter namespace에 Secret 생성
# terraform apply 후 SSM /prod/karpenter/* 에 자동 저장된 값을 참조
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: karpenter-config
  namespace: karpenter
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: karpenter-config
    creationPolicy: Owner
  data:
    - secretKey: roleArn
      remoteRef:
        key: /prod/karpenter/ROLE_ARN
    - secretKey: queueUrl
      remoteRef:
        key: /prod/karpenter/QUEUE_URL
    - secretKey: queueName
      remoteRef:
        key: /prod/karpenter/QUEUE_NAME
