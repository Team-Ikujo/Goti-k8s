# PostgreSQL Bitnami chart용 인증 시크릿
# postgres-password: superuser, password: goti 유저 — SSM DATASOURCE_PASSWORD 사용
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: goti-postgresql-auth
  namespace: goti
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: goti-postgresql-auth
    creationPolicy: Owner
    template:
      data:
        postgres-password: "{{ .password }}"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: /prod/server/DATASOURCE_PASSWORD
