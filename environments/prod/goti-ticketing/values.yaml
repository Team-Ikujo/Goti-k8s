nameOverride: goti-ticketing
image:
  repository: "harbor.go-ti.shop/prod/goti-ticketing"
  tag: "prod-28-71dcf1b"
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: harbor-creds
podAnnotations:
  instrumentation.opentelemetry.io/inject-java: "goti/goti-java"
resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 1Gi
gateway:
  enabled: true
  hosts:
    - "go-ti.shop"
    - "api.go-ti.shop"
  gatewayRef: "istio-system/goti-shared-gateway"
  httpRoutes:
    - match:
        - uri:
            prefix: "/api/v1/orders"
        - uri:
            prefix: "/api/v1/games"
        - uri:
            prefix: "/api/v1/tickets"
        - uri:
            prefix: "/api/v1/seats"
        - uri:
            prefix: "/api/v1/seat-reservations"
        - uri:
            prefix: "/api/v1/stadium-seats"
        - uri:
            prefix: "/api/v1/teams"
        - uri:
            prefix: "/api/v1/stadiums/"
      route:
        - destination:
            host: goti-ticketing-prod
            port:
              number: 8080
    - match:
        - uri:
            prefix: "/api/docs/ticketing/swagger-ui/"
      rewrite:
        uri: "/swagger-ui/"
      route:
        - destination:
            host: goti-ticketing-prod
            port:
              number: 8080
    - match:
        - uri:
            prefix: "/api/docs/ticketing/v3/"
      rewrite:
        uri: "/v3/"
      route:
        - destination:
            host: goti-ticketing-prod
            port:
              number: 8080
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  keda:
    enabled: true
    cooldownPeriod: 60
    triggers:
      - type: prometheus
        metadata:
          serverAddress: http://mimir-prod-query-frontend.monitoring.svc:8080/prometheus
          metricName: http_rps_ticketing
          query: sum(rate(http_server_request_duration_seconds_count{service_name="goti-ticketing"}[1m]))
          threshold: "50"
probes:
  liveness:
    httpGet:
      path: /actuator/health/liveness
      port: http
    initialDelaySeconds: 60
    periodSeconds: 10
  readiness:
    httpGet:
      path: /actuator/health/readiness
      port: http
    initialDelaySeconds: 30
    periodSeconds: 5
env:
  - name: SPRING_PROFILES_ACTIVE
    value: "prod"
  - name: JAVA_TOOL_OPTIONS
    value: "-XX:MaxRAMPercentage=60.0"
  - name: REDIS_PORT
    value: "6379"
  - name: SPRING_DATA_REDIS_SSL_ENABLED
    value: "true"
  - name: SPRING_DATA_REDIS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: goti-ticketing-prod-secrets
        key: REDIS_AUTH_TOKEN
  - name: SPRINGDOC_SWAGGER_UI_CONFIG_URL
    value: "/api/docs/ticketing/v3/api-docs/swagger-config"
  - name: SPRINGDOC_SWAGGER_UI_URL
    value: "/api/docs/ticketing/v3/api-docs"
envFrom:
  - secretRef:
      name: goti-ticketing-prod-secrets
externalSecret:
  enabled: true
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  remoteRef:
    path: /prod/server
    overridePath: /prod/ticketing
