    enabled: true
    allowFrom:
      - name: from-payment
        rules:
          - from:
              - source:
                  principals: ["cluster.local/ns/goti/sa/goti-payment-prod"]
            to:
              - operation:
                  paths: ["/api/v1/orders/*"]
                  methods: ["GET", "POST"]
  requestAuthentication:
    enabled: true
    jwks: '{"keys":[{"alg":"RS256","kty":"RSA","kid":"goti-jwt-key-1","e":"AQAB","use":"sig","n":"tXlfiSkDgSujDP6wUyQc57RrUGkTK6x3Fe-W5VhZhBumzDDoRNglcZ3C9AY_iF9GdlZOgcUdKLEVplLuEZGQpHUdA5CwgzQkwNXs242Mgo6QyHGdbDXZXEhe42vl1gcdgnahY7UQLcWGUr6--Fuc5G2LMW6rlTGwagT05SKzGRbTRef3gt8D8_hdsp654vnrdW2ReRQltnffHR9XL8buuKIduGW5vfiCVtNRFsaiT_o0SA86a5gK9qmXUGJIDPLc9onZ3v6G8gtFOES4MmR0elT2VTf22tM0GeIhnDOrjVRBa5I-M6c4OTMDrmeHKhUJygj-rjfNT5effpQzUz0_Xw"}]}'
  jwtAuthorizationPolicy:
    enabled: true
    excludePaths:
      - "/api/v1/games"
      - "/api/v1/games/*"
      - "/api/v1/stadiums"
      - "/api/v1/stadiums/*"
      - "*/payment-order"
      - "*/payment-confirmations"
      - "/actuator"
      - "/actuator/*"
      - "/swagger-ui"
      - "/swagger-ui/*"
      - "/v3/api-docs"
      - "/v3/api-docs/*"
  destinationRule:
    enabled: true
image:
  repository: harbor.go-ti.shop/prod/goti-ticketing
  tag: prod-51-b39eebc
imagePullSecrets:
  - name: ecr-creds
