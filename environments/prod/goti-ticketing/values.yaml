nameOverride: goti-ticketing
podAnnotations:
  instrumentation.opentelemetry.io/inject-java: "goti/goti-java"
resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 1Gi
gateway:
  enabled: true
  hosts:
    - "go-ti.shop"
    - "api.go-ti.shop"
  gatewayRef: "istio-system/goti-shared-gateway"
  httpRoutes:
    - match:
        - uri:
            prefix: "/api/v1/orders"
        - uri:
            prefix: "/api/v1/games"
        - uri:
            prefix: "/api/v1/tickets"
        - uri:
            prefix: "/api/v1/seats"
        - uri:
            prefix: "/api/v1/seat-reservations"
        - uri:
            prefix: "/api/v1/stadium-seats"
        - uri:
            prefix: "/api/v1/teams"
        - uri:
            prefix: "/api/v1/stadiums/"
      route:
        - destination:
            host: goti-ticketing-prod
            port:
              number: 8080
    - match:
        - uri:
            prefix: "/api/docs/ticketing/swagger-ui/"
      rewrite:
        uri: "/swagger-ui/"
      route:
        - destination:
            host: goti-ticketing-prod
            port:
              number: 8080
    - match:
        - uri:
            prefix: "/api/docs/ticketing/v3/"
      rewrite:
        uri: "/v3/"
      route:
        - destination:
            host: goti-ticketing-prod
            port:
              number: 8080
autoscaling:
  enabled: true
  minReplicas: 3 # 항상 3개 웜 상태 유지 (JVM 워밍업 완료된 인스턴스)
  maxReplicas: 10 # 실제 티켓팅 스파이크 수용
  keda:
    enabled: true
    cooldownPeriod: 300 # 스파이크 후 성급한 scale-down 방지 (60 → 300초)
    triggers:
      # Cron: 티켓 오픈 30분 전(9:30 KST) ~ 정오(12:00 KST) 바닥 6개 보장
      # → Karpenter가 미리 노드 프로비저닝 → JVM 워밍업 완료 후 트래픽 수신
      - type: cron
        metadata:
          timezone: "Asia/Seoul"
          start: "30 10 * * *" # 10:30 KST — 티켓 오픈 30분 전 사전 준비
          end: "0 13 * * *" # 13:00 KST — 판매 마감 후 일반 수준으로 복귀
          desiredReplicas: "6"
      # Prometheus: 실제 RPS 반응형 추가 스케일 (Cron이 바닥 보장, Prometheus가 천장 제어)
      - type: prometheus
        metadata:
          serverAddress: http://mimir-prod-query-frontend.monitoring.svc:8080/prometheus
          metricName: http_rps_ticketing
          query: sum(rate(http_server_request_duration_seconds_count{service_name="goti-ticketing"}[1m]))
          threshold: "50"
probes:
  liveness:
    httpGet:
      path: /actuator/health/liveness
      port: http
    initialDelaySeconds: 60
    periodSeconds: 10
  readiness:
    httpGet:
      path: /actuator/health/readiness
      port: http
    initialDelaySeconds: 30
    periodSeconds: 5
env:
  - name: SPRING_PROFILES_ACTIVE
    value: "prod"
  - name: JAVA_TOOL_OPTIONS
    value: "-XX:MaxRAMPercentage=60.0"
  - name: GOTI_MESH_ENABLED
    value: "true"
  - name: STADIUM_API_URL
    value: "http://goti-stadium-prod.goti.svc.cluster.local:8080"
  - name: RESALE_BASE_URL
    value: "http://goti-resale-prod.goti.svc.cluster.local:8080"
  - name: PAYMENT_BASE_URL
    value: "http://goti-payment-prod.goti.svc.cluster.local:8080"
  - name: REDIS_PORT
    value: "6379"
  - name: SPRING_DATA_REDIS_SSL_ENABLED
    value: "true"
  - name: SPRING_DATA_REDIS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: goti-ticketing-prod-secrets
        key: REDIS_AUTH_TOKEN
  - name: SPRINGDOC_SWAGGER_UI_CONFIG_URL
    value: "/api/docs/ticketing/v3/api-docs/swagger-config"
  - name: SPRINGDOC_SWAGGER_UI_URL
    value: "/api/docs/ticketing/v3/api-docs"
envFrom:
  - secretRef:
      name: goti-ticketing-prod-secrets
