# ============================================================================
# [POC] 준상 대기열 전용 Ticketing 서비스
# ============================================================================
# 목적: 준상 POC 부하테스트 시 ticketing API를 전용 pod에서 처리
# 특징: 준상 브랜치의 ticketing 모듈 — MeshSecuritySupport, ticketing_service 스키마
# 라우팅: /junsang/api/v1/** → rewrite → /api/v1/** → 이 서비스
# 삭제 시점: 최종 구현체 결정 후 정리
# ============================================================================

nameOverride: goti-ticketing-junsang

replicaCount: 1

autoscaling:
  enabled: false

image:
  repository: "707925622666.dkr.ecr.ap-northeast-2.amazonaws.com/goti-ticketing"
  tag: "poc-junsang-38-8856b54"
  pullPolicy: Always

imagePullSecrets:
  - name: ecr-creds

podAnnotations:
  instrumentation.opentelemetry.io/inject-java: "goti/goti-java"

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 1Gi

gateway:
  enabled: true
  hosts:
    - "go-ti.shop"
    - "api.go-ti.shop"
  gatewayRef: "istio-system/goti-shared-gateway"
  httpRoutes:
    - match:
        - uri:
            prefix: "/junsang/api/v1/orders"
      rewrite:
        uri: "/api/v1/orders"
      timeout: 10s
      route:
        - destination:
            host: goti-ticketing-junsang-prod
            port:
              number: 8080
    - match:
        - uri:
            prefix: "/junsang/api/v1/stadium-seats"
      rewrite:
        uri: "/api/v1/stadium-seats"
      timeout: 10s
      route:
        - destination:
            host: goti-ticketing-junsang-prod
            port:
              number: 8080
    - match:
        - uri:
            prefix: "/junsang/api/v1/seat-reservations"
      rewrite:
        uri: "/api/v1/seat-reservations"
      timeout: 10s
      route:
        - destination:
            host: goti-ticketing-junsang-prod
            port:
              number: 8080
    - match:
        - uri:
            prefix: "/junsang/api/v1/game-seats"
      rewrite:
        uri: "/api/v1/game-seats"
      timeout: 10s
      route:
        - destination:
            host: goti-ticketing-junsang-prod
            port:
              number: 8080
    - match:
        - uri:
            prefix: "/junsang/api/v1/teams"
      rewrite:
        uri: "/api/v1/teams"
      timeout: 10s
      route:
        - destination:
            host: goti-ticketing-junsang-prod
            port:
              number: 8080

probes:
  liveness:
    httpGet:
      path: /actuator/health/liveness
      port: http
    initialDelaySeconds: 60
    periodSeconds: 10
  readiness:
    httpGet:
      path: /actuator/health/readiness
      port: http
    initialDelaySeconds: 30
    periodSeconds: 5

serviceMonitor:
  enabled: false

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "prod"
  - name: JAVA_TOOL_OPTIONS
    value: "-XX:MaxRAMPercentage=60.0"
  - name: GOTI_MESH_ENABLED
    value: "true"
  # [POC] Redis DB 격리 — 준상=DB1 (queue-junsang과 동일)
  - name: SPRING_DATA_REDIS_DATABASE
    value: "1"
  - name: REDIS_PORT
    value: "6379"
  - name: SPRING_DATA_REDIS_SSL_ENABLED
    value: "true"
  - name: SPRING_DATA_REDIS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: goti-ticketing-junsang-prod-secrets
        key: REDIS_AUTH_TOKEN
  - name: STADIUM_API_URL
    value: "http://goti-stadium-prod.goti.svc.cluster.local:8080"

envFrom:
  - secretRef:
      name: goti-ticketing-junsang-prod-secrets

externalSecret:
  enabled: true
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  remoteRef:
    path: /prod/server

istioPolicy:
  authorizationPolicy:
    enabled: true
    allowFrom:
      - name: from-payment-junsang
        rules:
          - from:
              - source:
                  principals: ["cluster.local/ns/goti/sa/goti-payment-junsang-prod"]
            to:
              - operation:
                  paths: ["/api/v1/orders/*"]
                  methods: ["GET", "POST"]
  requestAuthentication:
    enabled: true
    jwks: '{"keys":[{"alg":"RS256","kty":"RSA","kid":"goti-jwt-key-1","e":"AQAB","use":"sig","n":"vFL8-RL8O2K_ZTTsCD0kY52DWJNB6KHZY2iN_33vDOrsCyyy6aPBlo-hiF-bWvEyLSuCX09UV1voU0MhI-b6Tfg1GNMXjBzl1YoXEw1sBLYt2jxRl9KBZXuoQtWLGl4xE85FOBJAJ0t7Bk8KBJ5KvVEkGZsQ0zghnYx4UujaSIGFwwYD5N4Vq_RPj-07HScyoNMLzOsB6z_T1u0-ncXVcayjxlg_AJrP8swJoa1bXxZszvV6jIjVjRGDsaLhYpnmStGFZoH2glL3EmTZNZOOXpuxz5JRh9P1gkRfEiZf9ednA1HQdWUjRPqBYLsoZ3ZXKdS3XvKqAjiTSzXfRRs5uw"}]}'
  jwtAuthorizationPolicy:
    enabled: false
  destinationRule:
    enabled: true
  sidecar:
    enabled: true
    egress:
      - hosts:
          - "istio-system/*"
          - "./*"
          - "monitoring/*"
          - "kafka/*"
          - "~/*.amazonaws.com"
