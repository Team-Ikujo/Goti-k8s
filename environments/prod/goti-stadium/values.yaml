nameOverride: goti-stadium
podAnnotations:
  instrumentation.opentelemetry.io/inject-java: "goti/goti-java"
resources:
  requests:
    cpu: 250m
    memory: 384Mi
  limits:
    cpu: 1000m
    memory: 768Mi
gateway:
  enabled: true
  hosts:
    - "go-ti.shop"
    - "api.go-ti.shop"
  gatewayRef: "istio-system/goti-shared-gateway"
  httpRoutes:
    - match:
        - uri:
            exact: "/api/v1/stadiums"
        - uri:
            prefix: "/api/v1/baseball-teams"
      route:
        - destination:
            host: goti-stadium-prod
            port:
              number: 8080
    - match:
        - uri:
            prefix: "/api/docs/stadium/swagger-ui/"
      rewrite:
        uri: "/swagger-ui/"
      route:
        - destination:
            host: goti-stadium-prod
            port:
              number: 8080
    - match:
        - uri:
            prefix: "/api/docs/stadium/v3/"
      rewrite:
        uri: "/v3/"
      route:
        - destination:
            host: goti-stadium-prod
            port:
              number: 8080
probes:
  liveness:
    httpGet:
      path: /actuator/health/liveness
      port: http
    initialDelaySeconds: 60
    periodSeconds: 10
  readiness:
    httpGet:
      path: /actuator/health/readiness
      port: http
    initialDelaySeconds: 30
    periodSeconds: 5
env:
  - name: SPRING_PROFILES_ACTIVE
    value: "prod"
  - name: JAVA_TOOL_OPTIONS
    value: "-XX:MaxRAMPercentage=60.0"
  - name: GOTI_MESH_ENABLED
    value: "true"
  - name: REDIS_PORT
    value: "6379"
  - name: SPRING_DATA_REDIS_SSL_ENABLED
    value: "true"
  - name: SPRING_DATA_REDIS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: goti-stadium-prod-secrets
        key: REDIS_AUTH_TOKEN
  - name: SPRINGDOC_SWAGGER_UI_CONFIG_URL
    value: "/api/docs/stadium/v3/api-docs/swagger-config"
  - name: SPRINGDOC_SWAGGER_UI_URL
    value: "/api/docs/stadium/v3/api-docs"
envFrom:
  - secretRef:
      name: goti-stadium-prod-secrets
# --- Istio 보안/네트워크 정책 ---
istioPolicy:
  # ticketing → stadium (경기장/팀 조회)
  authorizationPolicy:
    enabled: true
    allowFrom:
      - name: from-ticketing
        rules:
          - from:
              - source:
                  principals: ["cluster.local/ns/goti/sa/goti-ticketing-prod"]
            to:
              - operation:
                  paths: ["/api/v1/stadiums*", "/api/v1/baseball-teams*"]
                  methods: ["GET"]
  requestAuthentication:
    enabled: true
    jwks: '{"keys":[{"alg":"RS256","kty":"RSA","kid":"goti-jwt-key-1","e":"AQAB","use":"sig","n":"tXlfiSkDgSujDP6wUyQc57RrUGkTK6x3Fe-W5VhZhBumzDDoRNglcZ3C9AY_iF9GdlZOgcUdKLEVplLuEZGQpHUdA5CwgzQkwNXs242Mgo6QyHGdbDXZXEhe42vl1gcdgnahY7UQLcWGUr6--Fuc5G2LMW6rlTGwagT05SKzGRbTRef3gt8D8_hdsp654vnrdW2ReRQltnffHR9XL8buuKIduGW5vfiCVtNRFsaiT_o0SA86a5gK9qmXUGJIDPLc9onZ3v6G8gtFOES4MmR0elT2VTf22tM0GeIhnDOrjVRBa5I-M6c4OTMDrmeHKhUJygj-rjfNT5effpQzUz0_Xw"}]}'
  jwtAuthorizationPolicy:
    enabled: true
    excludePaths:
      - "/api/v1/stadiums"
      - "/api/v1/stadiums/*"
      - "/api/v1/baseball-teams"
      - "/api/v1/baseball-teams/*"
      - "/actuator"
      - "/actuator/*"
      - "/swagger-ui"
      - "/swagger-ui/*"
      - "/v3/api-docs"
      - "/v3/api-docs/*"
  destinationRule:
    enabled: true
image:
  repository: harbor.go-ti.shop/prod/goti-stadium
  tag: prod-49-4bbdc87
imagePullSecrets:
  - name: harbor-creds
