replicaCount: 4
externalSecret:
  enabled: true
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  remoteRef:
    path: /prod/server
    overridePath: /prod/user
istioPolicy:
  sidecar:
    enabled: true
    egress:
      - hosts:
          - "istio-system/*"
          - "./*"
          - "monitoring/*"
          - "kafka/*"
          - "~/*.googleapis.com"
          - "~/*.naver.com"
          - "~/*.kakao.com"
          - "~/*.nurigo.com"
          - "~/*.amazonaws.com"
