replicaCount: 0
image:
  repository: "harbor.go-ti.shop/prod/goti-user"
  tag: "prod-52-c0a6964"
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: harbor-creds
externalSecret:
  enabled: true
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  remoteRef:
    path: /prod/server
    overridePath: /prod/user
istioPolicy:
  sidecar:
    enabled: true
    egress:
      - hosts:
          - "istio-system/*"
          - "./*"
          - "monitoring/*"
          - "kafka/*"
          - "~/*.googleapis.com"
          - "~/*.naver.com"
          - "~/*.kakao.com"
          - "~/*.nurigo.com"
          - "~/*.amazonaws.com"

# Cutover: Java 비활성, Go 라우팅 take-over
gateway:
  enabled: false
