nameOverride: goti-user

image:
  repository: "707925622666.dkr.ecr.ap-northeast-2.amazonaws.com/goti-user"
  tag: "dev-35-de629ba"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ecr-creds

podAnnotations:
  instrumentation.opentelemetry.io/inject-java: "goti/goti-java"

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

gateway:
  enabled: true
  hosts:
    - "go-ti.shop"
  gatewayRef: "istio-system/goti-shared-gateway"
  httpRoutes:
    - match:
        - uri:
            prefix: "/api/v1/auth"
        - uri:
            prefix: "/api/v1/test"
      route:
        - destination:
            host: goti-user-prod
            port:
              number: 8080
    - match:
        - uri:
            prefix: "/api/docs/user/swagger-ui/"
      rewrite:
        uri: "/swagger-ui/"
      route:
        - destination:
            host: goti-user-prod
            port:
              number: 8080
    - match:
        - uri:
            prefix: "/api/docs/user/v3/"
      rewrite:
        uri: "/v3/"
      route:
        - destination:
            host: goti-user-prod
            port:
              number: 8080

probes:
  liveness:
    httpGet:
      path: /actuator/health/liveness
      port: http
    initialDelaySeconds: 60
    periodSeconds: 10
  readiness:
    httpGet:
      path: /actuator/health/readiness
      port: http
    initialDelaySeconds: 30
    periodSeconds: 5

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "prod"
  - name: JAVA_TOOL_OPTIONS
    value: "-XX:MaxRAMPercentage=60.0"
  - name: SPRINGDOC_SWAGGER_UI_CONFIG_URL
    value: "/api/docs/user/v3/api-docs/swagger-config"
  - name: SPRINGDOC_SWAGGER_UI_URL
    value: "/api/docs/user/v3/api-docs"

envFrom:
  - secretRef:
      name: goti-user-prod-secrets

externalSecret:
  enabled: true
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  remoteRef:
    path: /prod/server
