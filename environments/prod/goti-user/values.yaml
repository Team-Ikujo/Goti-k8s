nameOverride: goti-user
replicaCount: 4
image:
  repository: "707925622666.dkr.ecr.ap-northeast-2.amazonaws.com/prod/goti-user"
  tag: "prod-46-e652be4"
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: ecr-creds
podAnnotations:
  instrumentation.opentelemetry.io/inject-java: "goti/goti-java"
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi
gateway:
  enabled: true
  hosts:
    - "go-ti.shop"
    - "api.go-ti.shop"
  gatewayRef: "istio-system/goti-shared-gateway"
  httpRoutes:
    - match:
        - uri:
            prefix: "/api/v1/auth"
        - uri:
            prefix: "/api/v1/test"
      route:
        - destination:
            host: goti-user-prod
            port:
              number: 8080
    - match:
        - uri:
            prefix: "/api/docs/user/swagger-ui/"
      rewrite:
        uri: "/swagger-ui/"
      route:
        - destination:
            host: goti-user-prod
            port:
              number: 8080
    - match:
        - uri:
            prefix: "/api/docs/user/v3/"
      rewrite:
        uri: "/v3/"
      route:
        - destination:
            host: goti-user-prod
            port:
              number: 8080
probes:
  liveness:
    httpGet:
      path: /actuator/health/liveness
      port: http
    initialDelaySeconds: 60
    periodSeconds: 10
  readiness:
    httpGet:
      path: /actuator/health/readiness
      port: http
    initialDelaySeconds: 30
    periodSeconds: 5
env:
  - name: SPRING_PROFILES_ACTIVE
    value: "prod"
  - name: JAVA_TOOL_OPTIONS
    value: "-XX:MaxRAMPercentage=60.0"
  - name: REDIS_PORT
    value: "6379"
  - name: SPRING_DATA_REDIS_SSL_ENABLED
    value: "true"
  - name: SPRING_DATA_REDIS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: goti-user-prod-secrets
        key: REDIS_AUTH_TOKEN
  - name: GOTI_TEST_USER_ENABLED
    value: "true"
  - name: SPRINGDOC_SWAGGER_UI_CONFIG_URL
    value: "/api/docs/user/v3/api-docs/swagger-config"
  - name: SPRINGDOC_SWAGGER_UI_URL
    value: "/api/docs/user/v3/api-docs"
envFrom:
  - secretRef:
      name: goti-user-prod-secrets
externalSecret:
  enabled: true
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  remoteRef:
    path: /prod/server
    overridePath: /prod/user
# --- Istio 보안/네트워크 정책 ---
istioPolicy:
  # user 서비스는 다른 서비스로부터 호출받지 않음 (Gateway 통해서만 접근)
  authorizationPolicy:
    enabled: true
    allowFrom: []
  requestAuthentication:
    enabled: true
    jwksUri: "http://goti-user-prod.goti.svc.cluster.local:8080/.well-known/jwks.json"
  # 테스트 API IP 제한: Cloudflare WAF에서 이미 IP 제한 중
  # Istio remoteIpBlocks는 Cloudflare→ALB 경로에서 X-Forwarded-For 전달 이슈로 비활성화
  testIpAllowlist:
    enabled: false
    allowedIps:
      - "221.152.162.218/32"
      # - "팀원B_IP/32"
      # - "팀원C_IP/32"
      # - "팀원D_IP/32"
  jwtAuthorizationPolicy:
    enabled: true
    excludePaths:
      - "/api/v1/auth"
      - "/api/v1/auth/*"
      - "/api/v1/test"
      - "/api/v1/test/*"
      - "/actuator"
      - "/actuator/*"
      - "/swagger-ui"
      - "/swagger-ui/*"
      - "/v3/api-docs"
      - "/v3/api-docs/*"
      - "/.well-known"
      - "/.well-known/*"
  destinationRule:
    enabled: true
  sidecar:
    enabled: true
    egress:
      - hosts:
          - "istio-system/*"
          - "./*"
          - "monitoring/*"
          - "kafka/*"
          # OAuth 소셜 로그인 (Google, Naver, Kakao)
          - "~/*.googleapis.com"
          - "~/*.naver.com"
          - "~/*.kakao.com"
          # SMS 발송 (Nurigo/CoolSMS)
          - "~/*.nurigo.com"
          # AWS (SSM Parameter Store, STS)
          - "~/*.amazonaws.com"
