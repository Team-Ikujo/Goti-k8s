nameOverride: goti-user
podAnnotations:
  instrumentation.opentelemetry.io/inject-java: "goti/goti-java"
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi
gateway:
  enabled: true
  hosts:
    - "go-ti.shop"
    - "api.go-ti.shop"
  gatewayRef: "istio-system/goti-shared-gateway"
  httpRoutes:
    - match:
        - uri:
            prefix: "/api/v1/auth"
        - uri:
            prefix: "/api/v1/test"
      route:
        - destination:
            host: goti-user-prod
            port:
              number: 8080
    - match:
        - uri:
            prefix: "/api/docs/user/swagger-ui/"
      rewrite:
        uri: "/swagger-ui/"
      route:
        - destination:
            host: goti-user-prod
            port:
              number: 8080
    - match:
        - uri:
            prefix: "/api/docs/user/v3/"
      rewrite:
        uri: "/v3/"
      route:
        - destination:
            host: goti-user-prod
            port:
              number: 8080
autoscaling:
  enabled: true
  minReplicas: 3 # 야간 비용 절감 (현재 static 4개 → KEDA 관리로 전환)
  maxReplicas: 10
  keda:
    enabled: true
    cooldownPeriod: 300
    triggers:
      # ticketing보다 10분 앞서 준비 (로그인 트래픽이 먼저 발생)
      - type: cron
        metadata:
          timezone: "Asia/Seoul"
          start: "50 10 * * *" # 10:50 KST — 티켓 오픈 10분 전 사전 준비 (로그인 트래픽 선행)
          end: "0 13 * * *" # 13:00 KST
          desiredReplicas: "5"
      - type: prometheus
        metadata:
          serverAddress: http://mimir-prod-query-frontend.monitoring.svc:8080/prometheus
          metricName: http_rps_user
          query: sum(rate(http_server_request_duration_seconds_count{service_name="goti-user"}[1m]))
          threshold: "40"
probes:
  liveness:
    httpGet:
      path: /actuator/health/liveness
      port: http
    initialDelaySeconds: 60
    periodSeconds: 10
  readiness:
    httpGet:
      path: /actuator/health/readiness
      port: http
    initialDelaySeconds: 30
    periodSeconds: 5
env:
  - name: SPRING_PROFILES_ACTIVE
    value: "prod"
  - name: JAVA_TOOL_OPTIONS
    value: "-XX:MaxRAMPercentage=60.0"
  - name: REDIS_PORT
    value: "6379"
  - name: SPRING_DATA_REDIS_SSL_ENABLED
    value: "true"
  - name: SPRING_DATA_REDIS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: goti-user-prod-secrets
        key: REDIS_AUTH_TOKEN
  - name: GOTI_TEST_USER_ENABLED
    value: "true"
  - name: SPRINGDOC_SWAGGER_UI_CONFIG_URL
    value: "/api/docs/user/v3/api-docs/swagger-config"
  - name: SPRINGDOC_SWAGGER_UI_URL
    value: "/api/docs/user/v3/api-docs"
envFrom:
  - secretRef:
      name: goti-user-prod-secrets
istioPolicy:
  authorizationPolicy:
    enabled: true
    allowFrom: []
  requestAuthentication:
    enabled: true
    jwks: '{"keys":[{"alg":"RS256","kty":"RSA","kid":"goti-jwt-key-1","e":"AQAB","use":"sig","n":"tXlfiSkDgSujDP6wUyQc57RrUGkTK6x3Fe-W5VhZhBumzDDoRNglcZ3C9AY_iF9GdlZOgcUdKLEVplLuEZGQpHUdA5CwgzQkwNXs242Mgo6QyHGdbDXZXEhe42vl1gcdgnahY7UQLcWGUr6--Fuc5G2LMW6rlTGwagT05SKzGRbTRef3gt8D8_hdsp654vnrdW2ReRQltnffHR9XL8buuKIduGW5vfiCVtNRFsaiT_o0SA86a5gK9qmXUGJIDPLc9onZ3v6G8gtFOES4MmR0elT2VTf22tM0GeIhnDOrjVRBa5I-M6c4OTMDrmeHKhUJygj-rjfNT5effpQzUz0_Xw"}]}'
  testIpAllowlist:
    enabled: false
    allowedIps:
      - "221.152.162.218/32"
  jwtAuthorizationPolicy:
    enabled: true
    excludePaths:
      - "/api/v1/auth"
      - "/api/v1/auth/*"
      - "/api/v1/test"
