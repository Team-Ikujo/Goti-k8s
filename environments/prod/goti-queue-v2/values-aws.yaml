# SG1: 0% weight 첫 배포 — replicaCount: 0 (Java goti-queue-prod 무영향 보장)
replicaCount: 2
image:
  repository: "harbor.go-ti.shop/prod/goti-queue-go"
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: harbor-creds
externalSecret:
  enabled: true
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  remoteRef:
    path: /prod/queue-go
istioPolicy:
  sidecar:
    enabled: true
    egress:
      - hosts:
          - "istio-system/*"
          - "./*"
          - "monitoring/*"
          - "~/*.amazonaws.com"

# Cutover: Go 활성화
gateway:
  enabled: true
