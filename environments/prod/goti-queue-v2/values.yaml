# TODO(jwks-automation): user-service JWT 키 회전 시 본 파일 inline jwks를
# 모든 Go 서비스(현재 6개)와 수동 동기화 필요. ConfigMap 또는
# RequestAuthentication.jwksUri 참조 방식으로 자동화 예정.
# 메모리: project_jwks_automation_todo.md
nameOverride: goti-queue-v2
service:
  type: ClusterIP
  port: 8080
  name: http
serviceMonitor:
  enabled: true
  port: http
  path: /metrics
  interval: 15s
  release: kube-prometheus-stack-prod
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 256Mi
pdb:
  enabled: true
  minAvailable: 1
# CRITICAL: Java goti-queue VS와 동일 (host, path) 조합 → Istio
# MULTIPLE_VIRTUAL_SERVICES_FOR_HOST. replicaCount=0이어도 VS는 생성되므로
# gateway.enabled=false로 유지. cutover 시점에 다음 중 하나로 활성화:
#   (A) Java values-aws.yaml의 gateway.enabled=false로 먼저 전환 후 본 파일 true
#   (B) 단일 통합 VS chart로 weight 분배 (Java 0 / Go 100)
gateway:
  enabled: false
  hosts:
    - "go-ti.shop"
    - "api.go-ti.shop"
  gatewayRef: "istio-system/goti-shared-gateway"
  httpRoutes:
    - match:
        - uri:
            prefix: "/api/v1/queue"
      timeout: 10s
      retries:
        attempts: 2
        perTryTimeout: 5s
        retryOn: 5xx,reset,connect-failure
      route:
        - destination:
            host: goti-queue-v2-prod
            port:
              number: 8080
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  keda:
    enabled: true
    cooldownPeriod: 300
    triggers:
      - type: prometheus
        metadata:
          serverAddress: http://mimir-prod-query-frontend.monitoring.svc.cluster.local:8080/prometheus
          metricName: http_rps_queue_go
          query: sum(rate(http_server_request_duration_seconds_count{service_name="goti-queue-v2"}[1m]))
          threshold: "50"
probes:
  liveness:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 3
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    httpGet:
      path: /readyz
      port: http
    initialDelaySeconds: 3
    periodSeconds: 5
    failureThreshold: 3
podAnnotations:
  sidecar.istio.io/inject: "true"
  # ElastiCache Redis TLS — Istio sidecar 우회
  traffic.sidecar.istio.io/excludeOutboundPorts: "6379"
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
securityContext:
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault
# 환경변수: QUEUE_ prefix (Viper가 config.Load("queue")에서 자동 생성)
# envFrom 사용하지 않음 — 개별 매핑으로 명시적 관리
env:
  # --- 인프라 (Secret에서 주입) ---
  # --- DATABASE via PgBouncer (ADR 0013) ---
  # TODO: 서비스별 dedicated user 복구 — 현재는 master goti 단일 사용 (pgbouncer 멀티유저 설정 후 복구)
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: pgbouncer-secret
        key: db-user-password
  - name: QUEUE_DATABASE_URL
    value: "host=pgbouncer.goti.svc port=5432 user=goti password=$(DB_PASSWORD) dbname=goti sslmode=disable search_path=queue_service"
  - name: QUEUE_DATABASE_PGBOUNCER_COMPAT
    value: "true" 
  - name: QUEUE_REDIS_URL
    valueFrom:
      secretKeyRef:
        name: goti-queue-v2-prod-secrets
        key: QUEUE_REDIS_URL
  - name: QUEUE_JWT_PUBLIC_KEY_PEM
    valueFrom:
      secretKeyRef:
        name: goti-queue-v2-prod-secrets
        key: QUEUE_JWT_PUBLIC_KEY_PEM
  # --- DB pool (SDD Step 5 / S4: RDS max_conn=200, 6서비스 공유) ---
  - name: QUEUE_DATABASE_MAX_CONNS
    value: "3"
  - name: QUEUE_DATABASE_MIN_CONNS
    value: "5"
  - name: QUEUE_DATABASE_MAX_CONN_IDLE_TIME_SEC
    value: "30"
  - name: QUEUE_DATABASE_MAX_CONN_LIFETIME_SEC
    value: "1800"
  # --- 애플리케이션 ---
  # 티켓팅 수용인원 1000명 기준 (2026-04-14 부하테스트 기준 변경).
  # 이전 3000은 대기열 자체 처리량 확인용이었고, 실 admitted concurrent 1000이 ticketing 병목/성공률 측정 기준.
  - name: QUEUE_MAX_CAPACITY
    value: "1000"
  # --- OTel ---
  - name: QUEUE_OTEL_ENABLED
    value: "true"
  - name: QUEUE_OTEL_ENDPOINT
    value: "http://otel-front-prod.monitoring.svc:4317"
  - name: QUEUE_OTEL_SERVICE_NAME
    value: "goti-queue-v2"
  # OTel SDK 표준 환경변수
  - name: OTEL_SERVICE_NAME
    value: "goti-queue-v2"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://otel-front-prod.monitoring.svc:4317"
  - name: OTEL_RESOURCE_ATTRIBUTES
    value: "service.namespace=goti,deployment.environment.name=prod"
configMap:
  enabled: false
# --- Istio 보안/네트워크 정책 ---
istioPolicy:
  # queue는 Gateway로만 접근 (서비스 간 호출 없음)
  authorizationPolicy:
    enabled: false
  requestAuthentication:
    enabled: true
    issuer: "goti-user-service"
    jwks: '{"keys":[{"alg":"RS256","kty":"RSA","kid":"goti-jwt-key-1","e":"AQAB","use":"sig","n":"tXlfiSkDgSujDP6wUyQc57RrUGkTK6x3Fe-W5VhZhBumzDDoRNglcZ3C9AY_iF9GdlZOgcUdKLEVplLuEZGQpHUdA5CwgzQkwNXs242Mgo6QyHGdbDXZXEhe42vl1gcdgnahY7UQLcWGUr6--Fuc5G2LMW6rlTGwagT05SKzGRbTRef3gt8D8_hdsp654vnrdW2ReRQltnffHR9XL8buuKIduGW5vfiCVtNRFsaiT_o0SA86a5gK9qmXUGJIDPLc9onZ3v6G8gtFOES4MmR0elT2VTf22tM0GeIhnDOrjVRBa5I-M6c4OTMDrmeHKhUJygj-rjfNT5effpQzUz0_Xw"}]}'
  jwtAuthorizationPolicy:
    enabled: false
  destinationRule:
    enabled: true
image:
  repository: harbor.go-ti.shop/prod/goti-queue-go
  tag: prod-38-18d0b20
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: harbor-creds
