# ============================================================================
# [POC] 대기열 구현 — 수연 (PR #329: poc/queue-waiting-suyeon-cdn-optimized)
# ============================================================================
# 목적: EKS prod 환경에서 대기열 구현체 비교 부하테스트
# 특징: queue_service 전용 스키마, JWE 토큰 (AES-256-GCM), 자체 SecurityConfig
# 삭제 시점: 최종 구현체 결정 후 정리
# ============================================================================

nameOverride: goti-queue-suyeon

replicaCount: 1

autoscaling:
  enabled: false

image:
  repository: "707925622666.dkr.ecr.ap-northeast-2.amazonaws.com/goti-queue"
  tag: "poc-suyeon-37-8856b54"
  pullPolicy: Always

imagePullSecrets:
  - name: ecr-creds

podAnnotations:
  instrumentation.opentelemetry.io/inject-java: "goti/goti-java"

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 1Gi

gateway:
  enabled: true
  hosts:
    - "go-ti.shop"
    - "api.go-ti.shop"
  gatewayRef: "istio-system/goti-shared-gateway"
  httpRoutes:
    - match:
        - uri:
            prefix: "/api/v1/queue/suyeon"
      rewrite:
        uri: "/api/v1/queue"
      timeout: 10s
      retries:
        attempts: 2
        perTryTimeout: 5s
        retryOn: 5xx,reset,connect-failure
      route:
        - destination:
            host: goti-queue-suyeon-prod
            port:
              number: 8080

probes:
  liveness:
    httpGet:
      path: /actuator/health/liveness
      port: http
    initialDelaySeconds: 60
    periodSeconds: 10
  readiness:
    httpGet:
      path: /actuator/health/readiness
      port: http
    initialDelaySeconds: 30
    periodSeconds: 5

serviceMonitor:
  enabled: true
  port: http
  path: "/actuator/prometheus"
  interval: "15s"

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "prod"
  - name: JAVA_TOOL_OPTIONS
    value: "-XX:MaxRAMPercentage=60.0"
  - name: GOTI_MESH_ENABLED
    value: "true"
  # [POC] Redis DB 격리 — 수연=DB0, 준상=DB1, 성전=DB2
  - name: SPRING_DATA_REDIS_DATABASE
    value: "0"
  - name: REDIS_PORT
    value: "6379"
  - name: SPRING_DATA_REDIS_SSL_ENABLED
    value: "true"
  - name: SPRING_DATA_REDIS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: goti-queue-suyeon-prod-secrets
        key: REDIS_AUTH_TOKEN
  # [POC] 부하테스트용 — 대기열 최대 수용인원
  - name: QUEUE_MAX_CAPACITY
    value: "100"

envFrom:
  - secretRef:
      name: goti-queue-suyeon-prod-secrets

externalSecret:
  enabled: true
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  remoteRef:
    path: /prod/server
    overridePath: /prod/queue

istioPolicy:
  authorizationPolicy:
    enabled: false  # POC: 서비스간 통신 제한 불필요
  requestAuthentication:
    enabled: true
    jwks: '{"keys":[{"alg":"RS256","kty":"RSA","kid":"goti-jwt-key-1","e":"AQAB","use":"sig","n":"tXlfiSkDgSujDP6wUyQc57RrUGkTK6x3Fe-W5VhZhBumzDDoRNglcZ3C9AY_iF9GdlZOgcUdKLEVplLuEZGQpHUdA5CwgzQkwNXs242Mgo6QyHGdbDXZXEhe42vl1gcdgnahY7UQLcWGUr6--Fuc5G2LMW6rlTGwagT05SKzGRbTRef3gt8D8_hdsp654vnrdW2ReRQltnffHR9XL8buuKIduGW5vfiCVtNRFsaiT_o0SA86a5gK9qmXUGJIDPLc9onZ3v6G8gtFOES4MmR0elT2VTf22tM0GeIhnDOrjVRBa5I-M6c4OTMDrmeHKhUJygj-rjfNT5effpQzUz0_Xw"}]}'
  jwtAuthorizationPolicy:
    enabled: false  # POC: global-status CDN 캐싱 경로가 auth 없이 호출되므로 비활성화
    # Istio notPaths는 중간 와일드카드 미지원 (/a/*/b 불가, suffix만 가능)
    # RequestAuthentication이 JWT 검증을 수행하므로 보안 수준 유지
  destinationRule:
    enabled: true
  sidecar:
    enabled: true
    egress:
      - hosts:
          - "istio-system/*"
          - "./*"
          - "monitoring/*"
          - "~/*.amazonaws.com"
