nameOverride: goti-security-dashboard

# SQLite + RWO PVC는 동시 마운트 불가 → Recreate 전략 필수
deploymentStrategy:
  type: Recreate

service:
  type: ClusterIP
  port: 8100
  name: http

podAnnotations:
  sidecar.istio.io/inject: "true"

probes:
  liveness:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 20
    periodSeconds: 15
    failureThreshold: 3
  readiness:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 15
    periodSeconds: 10

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# SQLite 영속 저장소 (EBS gp3)
persistence:
  enabled: true
  storageClassName: "gp3"
  size: "5Gi"

extraVolumeMounts:
  - name: data
    mountPath: /data

extraVolumes:
  - name: data
    persistentVolumeClaim:
      claimName: goti-security-dashboard-prod-data

env:
  - name: DATABASE_DIR
    value: "/data"
  - name: PORT
    value: "8100"

envFrom:
  - secretRef:
      name: goti-security-dashboard-prod-secrets

# Streamlit Cloud → 외부에서 read 엔드포인트 호출
# /api/v1/events/* 는 클러스터 내부(mouse-macro, guardrail)만 호출 — 노출 불필요
gateway:
  enabled: true
  hosts:
    - "go-ti.shop"
    - "api.go-ti.shop"
  gatewayRef: "istio-system/goti-shared-gateway"
  httpRoutes:
    - match:
        - uri:
            prefix: "/api/v1/dashboard"
        - uri:
            prefix: "/api/v1/detections"
        - uri:
            prefix: "/api/v1/stats"
        - uri:
            prefix: "/api/v1/mouse-macro"
        - uri:
            prefix: "/api/v1/interventions"
        - uri:
            prefix: "/api/v1/analysis"
        - uri:
            prefix: "/api/v1/alerts"
      route:
        - destination:
            host: goti-security-dashboard-prod
            port:
              number: 8100

istioPolicy:
  authorizationPolicy:
    enabled: true
    allowFrom:
      - name: from-mouse-macro
        rules:
          - from:
              - source:
                  principals: ["cluster.local/ns/goti/sa/goti-mouse-macro-prod"]
            to:
              - operation:
                  paths: ["/api/v1/events/mouse-macro"]
                  methods: ["POST"]
      - name: from-guardrail
        rules:
          - from:
              - source:
                  principals: ["cluster.local/ns/goti/sa/goti-guardrail-prod"]
            to:
              - operation:
                  paths: ["/api/v1/events/blocked"]
                  methods: ["POST"]
      # 브라우저(대시보드 프론트) → Istio ingress gateway 경유 GET 요청 허용
      - name: from-ingress-gateway
        rules:
          - from:
              - source:
                  namespaces: ["istio-system"]
            to:
              - operation:
                  paths:
                    - "/api/v1/dashboard/overview"
                    - "/api/v1/detections"
                    - "/api/v1/stats/summary"
                    - "/api/v1/mouse-macro/sessions"
                    - "/api/v1/mouse-macro/sessions/*"
                    - "/api/v1/analytics/detection-types"
                    - "/api/v1/analytics/hourly-trend"
                    - "/api/v1/analytics/risk-distribution"
                    - "/api/v1/alerts"
                    - "/api/v1/interventions/*/action"
                    - "/api/v1/analysis/guardrail/*"
                    - "/api/v1/analysis/mouse-macro/*"
                    - "/health"
                  methods: ["GET", "POST", "OPTIONS"]
  requestAuthentication:
    enabled: false
  jwtAuthorizationPolicy:
    enabled: false
  destinationRule:
    enabled: false
  sidecar:
    enabled: true
    egress:
      - hosts:
          - "istio-system/*"
          - "./*"
