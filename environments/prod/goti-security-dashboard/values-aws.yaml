image:
  repository: "harbor.go-ti.shop/prod/goti-security-dashboard"
  tag: "prod-5-d34e743"
  pullPolicy: IfNotPresent
 
imagePullSecrets:
  - name: harbor-creds

externalSecret:
  enabled: true
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  remoteRef:
    path: /prod/security-dashboard

istioPolicy:
  sidecar:
    enabled: true
    egress:
      - hosts:
          - "istio-system/*"
          - "./*"
          - "monitoring/*"
          - "~/*.upstage.ai"
