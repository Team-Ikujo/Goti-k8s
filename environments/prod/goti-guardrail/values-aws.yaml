# AWS EKS — Harbor에서 직접 pull (ECR replication 미설정)
replicaCount: 1
image:
  repository: "707925622666.dkr.ecr.ap-northeast-2.amazonaws.com/goti-guardrail"
  tag: "prod-3-e74c600"
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: ecr-creds
externalSecret:
  enabled: true
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  remoteRef:
    path: /prod/guardrail
istioPolicy:
  sidecar:
    enabled: true
    egress:
      - hosts:
          - "istio-system/*"
          - "./*"
          - "monitoring/*"
          - "~/*.amazonaws.com"
