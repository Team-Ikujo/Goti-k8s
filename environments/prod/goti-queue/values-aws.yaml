replicaCount: 2
image:
  repository: "harbor.go-ti.shop/prod/goti-queue"
  tag: "prod-52-c0a6964"
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: harbor-creds
externalSecret:
  enabled: true
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  remoteRef:
    path: /prod/server
    overridePath: /prod/queue
istioPolicy:
  sidecar:
    enabled: true
    egress:
      - hosts:
          - "istio-system/*"
          - "./*"
          - "monitoring/*"
          - "~/*.amazonaws.com"
