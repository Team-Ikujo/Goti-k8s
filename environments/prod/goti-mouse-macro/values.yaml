nameOverride: goti-mouse-macro
replicaCount: 1

service:
  type: ClusterIP
  port: 8000
  name: http

podAnnotations:
  sidecar.istio.io/inject: "true"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000   # Dockerfile: useradd -u 1000 appuser
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true  # /tmp은 emptyDir로 마운트됨
  capabilities:
    drop: ["ALL"]

autoscaling:
  enabled: false

probes:
  liveness:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 20
    periodSeconds: 15
    failureThreshold: 3
  readiness:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 15
    periodSeconds: 10

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

gateway:
  enabled: true
  hosts:
    - "go-ti.shop"
    - "api.go-ti.shop"
  gatewayRef: "istio-system/goti-shared-gateway"
  httpRoutes:
    - match:
        - uri:
            prefix: "/api/v1/mouse/predict"
      rewrite:
        uri: "/predict"
      route:
        - destination:
            host: goti-mouse-macro-prod
            port:
              number: 8000

env:
  - name: AWS_REGION
    value: "ap-northeast-2"
  - name: S3_MODEL_PREFIX
    value: ""
  - name: DASHBOARD_SERVER_URL
    value: "http://goti-security-dashboard-prod.goti.svc.cluster.local:8100"

envFrom:
  - secretRef:
      name: goti-mouse-macro-prod-secrets

istioPolicy:
  authorizationPolicy:
    enabled: false
  requestAuthentication:
    enabled: false
  jwtAuthorizationPolicy:
    enabled: false
  destinationRule:
    enabled: false
  sidecar:
    enabled: false
