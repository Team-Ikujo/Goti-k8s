# AWS(EKS) 전용 설정 — harbor 이미지, IRSA, ESO
image:
  repository: "harbor.go-ti.shop/prod/goti-mouse"
  tag: "prod-12-1548e4c"
  pullPolicy: IfNotPresent

# harbor-creds: infrastructure/prod/external-secrets/config/harbor-creds-externalsecret.yaml 에서 생성
imagePullSecrets:
  - name: ecr-creds

serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::707925622666:role/goti-prod-mouse-macro-role"

# ESO: /prod/mouse-macro/* → goti-mouse-macro-prod-secrets
# SSM 경로: S3_BUCKET (IRSA로 AWS 자격증명 주입, Access Key 불필요)
externalSecret:
  enabled: true
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  remoteRef:
    path: /prod/mouse-macro

istioPolicy:
  sidecar:
    enabled: true
    egress:
      - hosts:
          - "istio-system/*"
          - "./*"
          - "monitoring/*"
          - "~/*.amazonaws.com"
