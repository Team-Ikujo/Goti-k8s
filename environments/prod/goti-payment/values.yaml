nameOverride: goti-payment
podAnnotations:
  instrumentation.opentelemetry.io/inject-java: "goti/goti-java"
resources:
  requests:
    cpu: 250m
    memory: 384Mi
  limits:
    cpu: 1000m
    memory: 768Mi
gateway:
  enabled: true
  hosts:
    - "go-ti.shop"
    - "api.go-ti.shop"
  gatewayRef: "istio-system/goti-shared-gateway"
  httpRoutes:
    - match:
        - uri:
            prefix: "/api/v1/payments"
      route:
        - destination:
            host: goti-payment-prod
            port:
              number: 8080
    - match:
        - uri:
            prefix: "/api/docs/payment/swagger-ui/"
      rewrite:
        uri: "/swagger-ui/"
      route:
        - destination:
            host: goti-payment-prod
            port:
              number: 8080
    - match:
        - uri:
            prefix: "/api/docs/payment/v3/"
      rewrite:
        uri: "/v3/"
      route:
        - destination:
            host: goti-payment-prod
            port:
              number: 8080
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  keda:
    enabled: true
    cooldownPeriod: 300
    triggers:
      # ticketing과 동시 준비 (결제는 ticketing 직후 연속으로 발생)
      # - type: cron
      #   metadata:
      #     timezone: "Asia/Seoul"
      #     start: "30 10 * * *" # 10:30 KST — 티켓 오픈 30분 전 사전 준비
      #     end: "0 13 * * *" # 13:00 KST
      #     desiredReplicas: "4"
      - type: prometheus
        metadata:
          serverAddress: http://mimir-prod-query-frontend.monitoring.svc:8080/prometheus
          metricName: http_rps_payment
          query: sum(rate(http_server_request_duration_seconds_count{job="goti/goti-payment"}[1m]))
          threshold: "30"
probes:
  liveness:
    httpGet:
      path: /actuator/health/liveness
      port: http
    initialDelaySeconds: 60
    periodSeconds: 10
  readiness:
    httpGet:
      path: /actuator/health/readiness
      port: http
    initialDelaySeconds: 30
    periodSeconds: 5
env:
  - name: SPRING_PROFILES_ACTIVE
    value: "prod"
  - name: JAVA_TOOL_OPTIONS
    value: "-XX:MaxRAMPercentage=60.0"
  - name: GOTI_MESH_ENABLED
    value: "true"
  - name: TICKETING_BASE_URL
    value: "http://goti-ticketing-prod.goti.svc.cluster.local:8080"
  - name: RESALE_BASE_URL
    value: "http://goti-resale-prod.goti.svc.cluster.local:8080"
  - name: REDIS_PORT
    value: "6379"
  - name: SPRING_DATA_REDIS_SSL_ENABLED
    value: "true"
  - name: SPRING_DATA_REDIS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: goti-payment-prod-secrets
        key: REDIS_AUTH_TOKEN
  - name: SPRINGDOC_SWAGGER_UI_CONFIG_URL
    value: "/api/docs/payment/v3/api-docs/swagger-config"
  - name: SPRINGDOC_SWAGGER_UI_URL
    value: "/api/docs/payment/v3/api-docs"
envFrom:
  - secretRef:
      name: goti-payment-prod-secrets
# --- Istio 보안/네트워크 정책 ---
istioPolicy:
  # resale → payment (양도 결제/환불)
  authorizationPolicy:
    enabled: true
    allowFrom:
      - name: from-resale
        rules:
          - from:
              - source:
                  principals:
                    - "cluster.local/ns/goti/sa/goti-resale-prod"
                    - "cluster.local/ns/goti/sa/goti-resale-v2-prod"
            to:
              - operation:
                  paths: ["/api/v1/resales/payments", "/api/v1/resales/payments/*"]
                  methods: ["POST", "PATCH"]
  requestAuthentication:
    enabled: true
    jwks: '{"keys":[{"alg":"RS256","kty":"RSA","kid":"goti-jwt-key-1","e":"AQAB","use":"sig","n":"tXlfiSkDgSujDP6wUyQc57RrUGkTK6x3Fe-W5VhZhBumzDDoRNglcZ3C9AY_iF9GdlZOgcUdKLEVplLuEZGQpHUdA5CwgzQkwNXs242Mgo6QyHGdbDXZXEhe42vl1gcdgnahY7UQLcWGUr6--Fuc5G2LMW6rlTGwagT05SKzGRbTRef3gt8D8_hdsp654vnrdW2ReRQltnffHR9XL8buuKIduGW5vfiCVtNRFsaiT_o0SA86a5gK9qmXUGJIDPLc9onZ3v6G8gtFOES4MmR0elT2VTf22tM0GeIhnDOrjVRBa5I-M6c4OTMDrmeHKhUJygj-rjfNT5effpQzUz0_Xw"}]}'
  jwtAuthorizationPolicy:
    enabled: true
    excludePaths:
      - "/actuator"
      - "/actuator/*"
      - "/swagger-ui"
      - "/swagger-ui/*"
      - "/v3/api-docs"
      - "/v3/api-docs/*"
  destinationRule:
    enabled: true
