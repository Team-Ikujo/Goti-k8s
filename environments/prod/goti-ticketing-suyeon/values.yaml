# ============================================================================
# [POC] 수연 대기열 전용 Ticketing 서비스
# ============================================================================
# 목적: 수연 POC 부하테스트 시 ticketing API를 전용 pod에서 처리
# 특징: 수연 브랜치의 ticketing 모듈 — ReservationSession 포함
# 라우팅: /suyeon/api/v1/** → rewrite → /api/v1/** → 이 서비스
# 삭제 시점: 최종 구현체 결정 후 정리
# ============================================================================

nameOverride: goti-ticketing-suyeon

replicaCount: 1

autoscaling:
  enabled: false

image:
  repository: "707925622666.dkr.ecr.ap-northeast-2.amazonaws.com/goti-ticketing"
  tag: "poc-suyeon-33-4310a17"  # TODO: cd-poc-queue.yml로 빌드 후 태그 교체
  pullPolicy: Always

imagePullSecrets:
  - name: ecr-creds

podAnnotations:
  instrumentation.opentelemetry.io/inject-java: "goti/goti-java"

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 1Gi

gateway:
  enabled: true
  hosts:
    - "go-ti.shop"
    - "api.go-ti.shop"
  gatewayRef: "istio-system/goti-shared-gateway"
  httpRoutes:
    - match:
        - uri:
            prefix: "/suyeon/api/v1/orders"
      rewrite:
        uri: "/api/v1/orders"
      timeout: 10s
      route:
        - destination:
            host: goti-ticketing-suyeon-prod
            port:
              number: 8080
    - match:
        - uri:
            prefix: "/suyeon/api/v1/stadium-seats"
      rewrite:
        uri: "/api/v1/stadium-seats"
      timeout: 10s
      route:
        - destination:
            host: goti-ticketing-suyeon-prod
            port:
              number: 8080
    - match:
        - uri:
            prefix: "/suyeon/api/v1/seat-reservations"
      rewrite:
        uri: "/api/v1/seat-reservations"
      timeout: 10s
      route:
        - destination:
            host: goti-ticketing-suyeon-prod
            port:
              number: 8080
    - match:
        - uri:
            prefix: "/suyeon/api/v1/game-seats"
      rewrite:
        uri: "/api/v1/game-seats"
      timeout: 10s
      route:
        - destination:
            host: goti-ticketing-suyeon-prod
            port:
              number: 8080
    - match:
        - uri:
            prefix: "/suyeon/api/v1/seats"
      rewrite:
        uri: "/api/v1/seats"
      timeout: 10s
      route:
        - destination:
            host: goti-ticketing-suyeon-prod
            port:
              number: 8080
    - match:
        - uri:
            prefix: "/suyeon/api/v1/games"
      rewrite:
        uri: "/api/v1/games"
      timeout: 10s
      route:
        - destination:
            host: goti-ticketing-suyeon-prod
            port:
              number: 8080
    - match:
        - uri:
            prefix: "/suyeon/api/v1/tickets"
      rewrite:
        uri: "/api/v1/tickets"
      timeout: 10s
      route:
        - destination:
            host: goti-ticketing-suyeon-prod
            port:
              number: 8080
    - match:
        - uri:
            prefix: "/suyeon/api/v1/teams"
      rewrite:
        uri: "/api/v1/teams"
      timeout: 10s
      route:
        - destination:
            host: goti-ticketing-suyeon-prod
            port:
              number: 8080
    - match:
        - uri:
            prefix: "/suyeon/api/v1/stadiums/"
      rewrite:
        uri: "/api/v1/stadiums/"
      timeout: 10s
      route:
        - destination:
            host: goti-ticketing-suyeon-prod
            port:
              number: 8080

probes:
  liveness:
    httpGet:
      path: /actuator/health/liveness
      port: http
    initialDelaySeconds: 60
    periodSeconds: 10
  readiness:
    httpGet:
      path: /actuator/health/readiness
      port: http
    initialDelaySeconds: 30
    periodSeconds: 5

serviceMonitor:
  enabled: false

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "prod"
  - name: JAVA_TOOL_OPTIONS
    value: "-XX:MaxRAMPercentage=60.0"
  - name: GOTI_MESH_ENABLED
    value: "true"
  - name: STADIUM_API_URL
    value: "http://goti-stadium-prod.goti.svc.cluster.local:8080"
  - name: REDIS_PORT
    value: "6379"
  - name: SPRING_DATA_REDIS_SSL_ENABLED
    value: "true"
  - name: SPRING_DATA_REDIS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: goti-ticketing-suyeon-prod-secrets
        key: REDIS_AUTH_TOKEN

envFrom:
  - secretRef:
      name: goti-ticketing-suyeon-prod-secrets

externalSecret:
  enabled: true
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  remoteRef:
    path: /prod/server
    overridePath: /prod/ticketing

istioPolicy:
  authorizationPolicy:
    enabled: true
    allowFrom:
      - name: from-payment-suyeon
        rules:
          - from:
              - source:
                  principals: ["cluster.local/ns/goti/sa/goti-payment-suyeon-prod"]
            to:
              - operation:
                  paths: ["/api/v1/orders/*"]
                  methods: ["GET", "POST"]
  requestAuthentication:
    enabled: true
    jwksUri: "http://goti-user-prod.goti.svc.cluster.local:8080/.well-known/jwks.json"
  jwtAuthorizationPolicy:
    enabled: false
  destinationRule:
    enabled: true
  sidecar:
    enabled: true
    egress:
      - hosts:
          - "istio-system/*"
          - "./*"
          - "monitoring/*"
          - "kafka/*"
          - "~/*.amazonaws.com"
