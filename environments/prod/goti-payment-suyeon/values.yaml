# ============================================================================
# [POC] 수연 대기열 전용 Payment 서비스
# ============================================================================
# 목적: payment → ticketing 내부 통신을 ticketing-suyeon으로 연결
# 라우팅: /suyeon/api/v1/payments/** → rewrite → /api/v1/payments/**
# 삭제 시점: 최종 구현체 결정 후 정리
# ============================================================================

nameOverride: goti-payment-suyeon

replicaCount: 1

autoscaling:
  enabled: false

image:
  repository: "707925622666.dkr.ecr.ap-northeast-2.amazonaws.com/goti-payment"
  tag: "TODO-SUYEON-PAYMENT"  # TODO: cd-poc-queue.yml로 빌드 후 태그 교체
  pullPolicy: Always

imagePullSecrets:
  - name: ecr-creds

podAnnotations:
  instrumentation.opentelemetry.io/inject-java: "goti/goti-java"

resources:
  requests:
    cpu: 250m
    memory: 384Mi
  limits:
    cpu: 1000m
    memory: 768Mi

gateway:
  enabled: true
  hosts:
    - "go-ti.shop"
    - "api.go-ti.shop"
  gatewayRef: "istio-system/goti-shared-gateway"
  httpRoutes:
    - match:
        - uri:
            prefix: "/suyeon/api/v1/payments"
      rewrite:
        uri: "/api/v1/payments"
      timeout: 15s
      retries:
        attempts: 2
        perTryTimeout: 5s
        retryOn: 5xx,reset,connect-failure
      route:
        - destination:
            host: goti-payment-suyeon-prod
            port:
              number: 8080

probes:
  liveness:
    httpGet:
      path: /actuator/health/liveness
      port: http
    initialDelaySeconds: 60
    periodSeconds: 10
  readiness:
    httpGet:
      path: /actuator/health/readiness
      port: http
    initialDelaySeconds: 30
    periodSeconds: 5

serviceMonitor:
  enabled: false

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "prod"
  - name: JAVA_TOOL_OPTIONS
    value: "-XX:MaxRAMPercentage=60.0"
  - name: GOTI_MESH_ENABLED
    value: "true"
  # [POC] 핵심: ticketing-suyeon pod으로 내부 통신
  - name: TICKETING_BASE_URL
    value: "http://goti-ticketing-suyeon-prod.goti.svc.cluster.local:8080"
  - name: REDIS_PORT
    value: "6379"
  - name: SPRING_DATA_REDIS_SSL_ENABLED
    value: "true"
  - name: SPRING_DATA_REDIS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: goti-payment-suyeon-prod-secrets
        key: REDIS_AUTH_TOKEN

envFrom:
  - secretRef:
      name: goti-payment-suyeon-prod-secrets

externalSecret:
  enabled: true
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  remoteRef:
    path: /prod/server
    overridePath: /prod/payment

istioPolicy:
  authorizationPolicy:
    enabled: false
  requestAuthentication:
    enabled: true
    jwksUri: "http://goti-user-prod.goti.svc.cluster.local:8080/.well-known/jwks.json"
  jwtAuthorizationPolicy:
    enabled: false
  destinationRule:
    enabled: true
  sidecar:
    enabled: true
    egress:
      - hosts:
          - "istio-system/*"
          - "./*"
          - "monitoring/*"
          - "kafka/*"
          - "~/*.amazonaws.com"
