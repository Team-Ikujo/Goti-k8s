# TODO(jwks-automation): user-service JWT 키 회전 시 본 파일 inline jwks를
# 모든 Go 서비스와 수동 동기화 필요. 메모리: project_jwks_automation_todo.md
nameOverride: goti-payment-go
service:
  type: ClusterIP
  port: 8080
  name: http
serviceMonitor:
  enabled: true
  port: http
  path: /metrics
  interval: 15s
  release: kube-prometheus-stack-prod
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 256Mi
pdb:
  enabled: true
  minAvailable: 1
# CRITICAL: Java goti-payment VS와 동일 (host, path) 조합 → Istio
# MULTIPLE_VIRTUAL_SERVICES_FOR_HOST. gateway.enabled=false로 유지.
# cutover 시 Java values의 gateway.enabled=false로 전환 후 본 파일 true.
# Swagger 라우팅은 Go 미구현 전제로 누락 — Java 전용 유지.
gateway:
  enabled: false
  hosts:
    - "go-ti.shop"
    - "api.go-ti.shop"
  gatewayRef: "istio-system/goti-shared-gateway"
  httpRoutes:
    - match:
        - uri:
            prefix: "/api/v1/payments"
      route:
        - destination:
            host: goti-payment-go-prod
            port:
              number: 8080
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  keda:
    enabled: true
    cooldownPeriod: 300
    triggers:
      - type: prometheus
        metadata:
          serverAddress: http://mimir-prod-query-frontend.monitoring.svc.cluster.local:8080/prometheus
          metricName: http_rps_payment_go
          query: sum(rate(http_server_request_duration_seconds_count{service_name="goti-payment-go"}[1m]))
          threshold: "30"
probes:
  liveness:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 3
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    httpGet:
      path: /readyz
      port: http
    initialDelaySeconds: 3
    periodSeconds: 5
    failureThreshold: 3
podAnnotations:
  sidecar.istio.io/inject: "true"
  traffic.sidecar.istio.io/excludeOutboundPorts: "6379"
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
securityContext:
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault
# 환경변수: PAYMENT_ prefix (Viper가 config.Load("payment")에서 자동 생성)
env:
  # --- 인프라 (Secret에서 주입) ---
  - name: PAYMENT_DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: goti-payment-go-prod-secrets
        key: PAYMENT_DATABASE_URL
  - name: PAYMENT_REDIS_URL
    valueFrom:
      secretKeyRef:
        name: goti-payment-go-prod-secrets
        key: PAYMENT_REDIS_URL
  - name: PAYMENT_JWT_PUBLIC_KEY_PEM
    valueFrom:
      secretKeyRef:
        name: goti-payment-go-prod-secrets
        key: PAYMENT_JWT_PUBLIC_KEY_PEM
  # --- DB pool (SDD Step 5 / S4) ---
  - name: PAYMENT_DATABASE_MAX_CONNS
    value: "3"
  - name: PAYMENT_DATABASE_MIN_CONNS
    value: "1"
  - name: PAYMENT_DATABASE_MAX_CONN_IDLE_TIME_SEC
    value: "30"
  - name: PAYMENT_DATABASE_MAX_CONN_LIFETIME_SEC
    value: "1800"
  # --- 서비스 간 통신 ---
  - name: PAYMENT_SERVICES_TICKETING
    value: "http://goti-ticketing-go-prod.goti.svc.cluster.local:8080"
  - name: PAYMENT_SERVICES_RESALE
    value: "http://goti-resale-go-prod.goti.svc.cluster.local:8080"
  # --- OTel ---
  - name: PAYMENT_OTEL_ENABLED
    value: "true"
  - name: PAYMENT_OTEL_ENDPOINT
    value: "http://otel-collector.monitoring.svc.cluster.local:4317"
  - name: PAYMENT_OTEL_SERVICE_NAME
    value: "goti-payment-go"
  - name: OTEL_SERVICE_NAME
    value: "goti-payment-go"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://otel-collector.monitoring.svc.cluster.local:4317"
configMap:
  enabled: false
# --- Istio 보안/네트워크 정책 ---
# TODO(phase 7): Java resale deprecation 후 from-resale 규칙을 resale-go SA로 변경.
# 공존 기간 동안은 양쪽 SA 모두 허용.
istioPolicy:
  authorizationPolicy:
    enabled: true
    allowFrom:
      - name: from-resale
        rules:
          - from:
              - source:
                  principals:
                    - "cluster.local/ns/goti/sa/goti-resale-prod"
                    - "cluster.local/ns/goti/sa/goti-resale-go-prod"
            to:
              - operation:
                  paths: ["/api/v1/resales/payments", "/api/v1/resales/payments/*"]
                  methods: ["POST", "PATCH"]
  requestAuthentication:
    enabled: true
    issuer: "goti-user-service"
    jwks: '{"keys":[{"alg":"RS256","kty":"RSA","kid":"goti-jwt-key-1","e":"AQAB","use":"sig","n":"tXlfiSkDgSujDP6wUyQc57RrUGkTK6x3Fe-W5VhZhBumzDDoRNglcZ3C9AY_iF9GdlZOgcUdKLEVplLuEZGQpHUdA5CwgzQkwNXs242Mgo6QyHGdbDXZXEhe42vl1gcdgnahY7UQLcWGUr6--Fuc5G2LMW6rlTGwagT05SKzGRbTRef3gt8D8_hdsp654vnrdW2ReRQltnffHR9XL8buuKIduGW5vfiCVtNRFsaiT_o0SA86a5gK9qmXUGJIDPLc9onZ3v6G8gtFOES4MmR0elT2VTf22tM0GeIhnDOrjVRBa5I-M6c4OTMDrmeHKhUJygj-rjfNT5effpQzUz0_Xw"}]}'
  jwtAuthorizationPolicy:
    enabled: true
    excludePaths:
      - "/healthz"
      - "/readyz"
      - "/metrics"
  destinationRule:
    enabled: true
image:
  repository: harbor.go-ti.shop/prod/goti-payment-go
  tag: prod-7-5577103
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: harbor-creds
