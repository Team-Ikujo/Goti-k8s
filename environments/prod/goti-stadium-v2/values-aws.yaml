# SG1: 0% weight 첫 배포 — replicaCount: 0 (Java goti-stadium-prod 무영향 보장)
replicaCount: 1
image:
  repository: "707925622666.dkr.ecr.ap-northeast-2.amazonaws.com/goti-stadium-go"
  pullPolicy: IfNotPresent
  tag: prod-48-0a4e690
externalSecret:
  enabled: true
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  remoteRef:
    path: /prod/stadium-go
# TODO(ticketing-go-sync): "~/*.amazonaws.com"는 Istio Sidecar hosts 비표준
# (`~`는 sidecar 자체 namespace 의미). 외부 도메인은 "*.amazonaws.com" 형식이 표준.
# ticketing-go-aws.values도 동일 패턴 사용 중이므로 함께 동기 수정 필요.
istioPolicy:
  sidecar:
    enabled: true
    egress:
      - hosts:
          - "istio-system/*"
          - "./*"
          - "monitoring/*"
          - "~/*.amazonaws.com"
# Cutover: Go 활성화
gateway:
  enabled: true
