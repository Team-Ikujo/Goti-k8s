nameOverride: goti-ticketing-v2
service:
  type: ClusterIP
  port: 8080
  name: http
serviceMonitor:
  enabled: true
  port: http
  path: /metrics
  interval: 15s
  release: kube-prometheus-stack-prod
# Resource sizing rationale (CR-009, CR-010):
#  - CPU request 1 core / limit 2 core → ratio 1:2, CFS throttling jitter 최소화
#  - Go GOMAXPROCS는 limit 기준 자동 승격, env로 명시하여 안정성 확보
#  - 8 replicas × 2 core = 16 core burst (기존 24 core 대비 절감)
#  - Memory request 512Mi / limit 1Gi → GOMEMLIMIT=900MiB 로 OOM 여유 확보
resources:
  requests:
    cpu: 1000m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 1Gi
pdb:
  enabled: true
  minAvailable: 1
# CRITICAL: Java goti-ticketing VS와 동일 (host, path) 조합 → Istio
# MULTIPLE_VIRTUAL_SERVICES_FOR_HOST. cutover 전까지 gateway.enabled=false로 유지.
# cutover 시 Java values의 gateway.enabled=false로 전환 후 본 파일 true.
gateway:
  enabled: false
  hosts:
    - "go-ti.shop"
    - "api.go-ti.shop"
  gatewayRef: "istio-system/goti-shared-gateway"
  httpRoutes:
    - match:
        - uri:
            prefix: "/api/v1/orders"
        - uri:
            prefix: "/api/v1/games"
        - uri:
            prefix: "/api/v1/tickets"
        - uri:
            prefix: "/api/v1/seats"
        - uri:
            prefix: "/api/v1/seat-reservations"
        - uri:
            prefix: "/api/v1/stadium-seats"
        - uri:
            prefix: "/api/v1/teams"
        - uri:
            prefix: "/api/v1/stadiums/"
        - uri:
            prefix: "/api/v1/game-seats"
      route:
        - destination:
            host: goti-ticketing-v2-prod
            port:
              number: 8080
autoscaling:
  enabled: true
  # SDD-0007 PR-3: scale-up 반응성 튜닝. min 12 prewarm, max 24.
  # DB 예산: MaxConns 10 × 24 = 240 < pgbouncer pool 300 안전.
  minReplicas: 2
  maxReplicas: 24
  keda:
    enabled: true
    pollingInterval: 10
    cooldownPeriod: 120
    advanced:
      horizontalPodAutoscalerConfig:
        behavior:
          scaleUp:
            stabilizationWindowSeconds: 15
            policies:
              - {type: Pods, value: 8, periodSeconds: 15}
              - {type: Percent, value: 200, periodSeconds: 15}
            selectPolicy: Max
          scaleDown:
            stabilizationWindowSeconds: 300
            policies:
              - {type: Percent, value: 25, periodSeconds: 60}
    triggers:
      - type: cron
        metadata:
          timezone: "Asia/Seoul"
          start: "20 09 * * *"
          end: "0 13 * * *"
          # 2026-04-15: AWS 재기동 spot capacity 부족으로 임시 하향 (원래 18, 부하 직전 원복)
          desiredReplicas: "4"
      - type: prometheus
        metadata:
          serverAddress: http://mimir-prod-query-frontend.monitoring.svc.cluster.local:8080/prometheus
          metricName: http_rps_ticketing_go
          query: sum(rate(http_server_request_duration_seconds_count{service_name="goti-ticketing-v2"}[45s]))
          threshold: "30"
      - type: cpu
        metricType: Utilization
        metadata:
          value: "70"
probes:
  liveness:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 3
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    httpGet:
      path: /readyz
      port: http
    initialDelaySeconds: 3
    periodSeconds: 5
    failureThreshold: 3
podAnnotations:
  sidecar.istio.io/inject: "true"
  # ElastiCache Redis TLS — Istio sidecar 우회
  traffic.sidecar.istio.io/excludeOutboundPorts: "6379,5432"
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
securityContext:
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault
# 환경변수: TICKETING_ prefix (Viper가 config.Load("ticketing")에서 자동 생성)
# envFrom 사용하지 않음 — 개별 매핑으로 명시적 관리
env:
  # --- Go runtime (CR-009/010) ---
  # GOMAXPROCS: CPU limit 2 core에 맞춰 명시 (auto-detect도 동일하지만 안정성 위해 고정)
  - name: GOMAXPROCS
    value: "2"
  # GOMEMLIMIT: memory limit 1Gi의 ~90% → GC가 OOM 직전 aggressive 하게 동작
  - name: GOMEMLIMIT
    value: "900MiB"
  # --- 인프라 (Secret에서 주입) ---
  # --- DATABASE via PgBouncer (ADR 0013) ---
  # TODO: 서비스별 dedicated user 복구 — 현재는 master goti 단일 사용 (pgbouncer 멀티유저 설정 후 복구)
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: pgbouncer-secret
        key: db-user-password
  - name: TICKETING_DATABASE_URL
    value: "host=pgbouncer.goti.svc port=5432 user=goti password=$(DB_PASSWORD) dbname=goti_ticketing sslmode=disable"
  - name: TICKETING_DATABASE_PGBOUNCER_COMPAT
    value: "true"
  - name: TICKETING_REDIS_URL
    valueFrom:
      secretKeyRef:
        name: goti-ticketing-v2-prod-secrets
        key: TICKETING_REDIS_URL
  - name: TICKETING_JWT_PUBLIC_KEY_PEM
    valueFrom:
      secretKeyRef:
        name: goti-ticketing-v2-prod-secrets
        key: TICKETING_JWT_PUBLIC_KEY_PEM
  - name: TICKETING_TICKETING_QR_SECRET
    valueFrom:
      secretKeyRef:
        name: goti-ticketing-v2-prod-secrets
        key: TICKETING_TICKETING_QR_SECRET
  - name: TICKETING_QUEUE_TOKEN_SECRET
    valueFrom:
      secretKeyRef:
        name: goti-ticketing-v2-prod-secrets
        key: TICKETING_QUEUE_TOKEN_SECRET
  # --- DB pool (SDD-0007 PR-3) ---
  # maxReplicas=24 전제, 24 × 10 = 240 < pgbouncer pool 300 안전.
  # PgBouncer session 모드 + goti_ticketing pool_size=150 × 2 replicas.
  # 이전 (2026-04-14) "18 복귀" 결정은 본 PR의 maxReplicas=24 + cron prewarm 18 도입으로 무효화됨.
  - name: TICKETING_DATABASE_MAX_CONNS
    value: "10"
  - name: TICKETING_DATABASE_MIN_CONNS
    value: "5"
  - name: TICKETING_DATABASE_MAX_CONN_IDLE_TIME_SEC
    value: "30"
  - name: TICKETING_DATABASE_MAX_CONN_LIFETIME_SEC
    value: "1800"
  # --- 서비스 간 통신 ---
  - name: TICKETING_SERVICES_STADIUM
    value: "http://goti-stadium-v2-prod.goti.svc.cluster.local:8080"
  - name: TICKETING_SERVICES_PAYMENT
    value: "http://goti-payment-v2-prod.goti.svc.cluster.local:8080"
  - name: TICKETING_SERVICES_RESALE
    value: "http://goti-resale-v2-prod.goti.svc.cluster.local:8080"
  # --- ticketing 도메인 스케줄러 (viper default 없음, 필수 주입) ---
  - name: TICKETING_TICKETING_HOLD_EXPIRY_INTERVAL_MS
    value: "1000"
  - name: TICKETING_TICKETING_HOLD_EXPIRY_BATCH_SIZE
    value: "100"
  - name: TICKETING_TICKETING_INVENTORY_SYNC_INTERVAL_MS
    value: "5000"
  # --- OTel ---
  - name: TICKETING_OTEL_ENABLED
    value: "true"
  - name: TICKETING_OTEL_ENDPOINT
    value: "http://otel-front-prod.monitoring.svc:4317"
  - name: TICKETING_OTEL_SERVICE_NAME
    value: "goti-ticketing-v2"
  # OTel SDK 표준 환경변수 (Go SDK가 직접 참조)
  - name: OTEL_SERVICE_NAME
    value: "goti-ticketing-v2"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://otel-front-prod.monitoring.svc:4317"
  - name: OTEL_RESOURCE_ATTRIBUTES
    value: "service.namespace=goti,deployment.environment.name=prod"
configMap:
  enabled: false
# --- Istio 보안/네트워크 정책 ---
istioPolicy:
  authorizationPolicy:
    enabled: true
    allowFrom:
      - name: from-payment
        rules:
          - from:
              - source:
                  principals:
                    - "cluster.local/ns/goti/sa/goti-payment-prod"
                    - "cluster.local/ns/goti/sa/goti-payment-v2-prod"
            to:
              - operation:
                  paths: ["/api/v1/orders/*"]
                  methods: ["GET", "POST"]
      - name: from-resale
        rules:
          - from:
              - source:
                  principals:
                    - "cluster.local/ns/goti/sa/goti-resale-prod"
                    - "cluster.local/ns/goti/sa/goti-resale-v2-prod"
            to:
              - operation:
                  paths: ["/api/v1/tickets/resales/*", "/internal/*"]
                  methods: ["GET", "PATCH", "POST"]
  requestAuthentication:
    enabled: true
    issuer: "goti-user-service"
    jwks: '{"keys":[{"alg":"RS256","kty":"RSA","kid":"goti-jwt-key-1","e":"AQAB","use":"sig","n":"tXlfiSkDgSujDP6wUyQc57RrUGkTK6x3Fe-W5VhZhBumzDDoRNglcZ3C9AY_iF9GdlZOgcUdKLEVplLuEZGQpHUdA5CwgzQkwNXs242Mgo6QyHGdbDXZXEhe42vl1gcdgnahY7UQLcWGUr6--Fuc5G2LMW6rlTGwagT05SKzGRbTRef3gt8D8_hdsp654vnrdW2ReRQltnffHR9XL8buuKIduGW5vfiCVtNRFsaiT_o0SA86a5gK9qmXUGJIDPLc9onZ3v6G8gtFOES4MmR0elT2VTf22tM0GeIhnDOrjVRBa5I-M6c4OTMDrmeHKhUJygj-rjfNT5effpQzUz0_Xw"}]}'
  jwtAuthorizationPolicy:
    enabled: true
    excludePaths:
      - "/api/v1/games"
      - "/api/v1/games/*"
      - "/api/v1/stadiums"
      - "/api/v1/stadiums/*"
      - "/api/v1/orders/internal"
      - "*/payment-order"
      - "*/payment-confirmations"
      - "/api/v1/tickets/purchase-infos"
      - "/api/v1/tickets/resales/*"
      - "/internal/*"
      - "/healthz"
      - "/readyz"
      - "/metrics"
  destinationRule:
    enabled: true
image:
  repository: harbor.go-ti.shop/prod/goti-ticketing-go
  tag: prod-47-942b299
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: harbor-creds
