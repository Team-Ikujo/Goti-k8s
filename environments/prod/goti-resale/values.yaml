nameOverride: goti-resale
podAnnotations:
  instrumentation.opentelemetry.io/inject-java: "goti/goti-java"
resources:
  requests:
    cpu: 250m
    memory: 384Mi
  limits:
    cpu: 1000m
    memory: 768Mi
gateway:
  enabled: true
  hosts:
    - "go-ti.shop"
    - "api.go-ti.shop"
  gatewayRef: "istio-system/goti-shared-gateway"
  httpRoutes:
    - match:
        - uri:
            prefix: "/api/v1/resales"
      route:
        - destination:
            host: goti-resale-prod
            port:
              number: 8080
    - match:
        - uri:
            prefix: "/api/docs/resale/swagger-ui/"
      rewrite:
        uri: "/swagger-ui/"
      route:
        - destination:
            host: goti-resale-prod
            port:
              number: 8080
    - match:
        - uri:
            prefix: "/api/docs/resale/v3/"
      rewrite:
        uri: "/v3/"
      route:
        - destination:
            host: goti-resale-prod
            port:
              number: 8080
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  keda:
    enabled: true
    cooldownPeriod: 180
    triggers:
      # 양도 트래픽은 티켓 판매 이후 간헐적 — Cron 불필요, Prometheus만으로 충분
      - type: prometheus
        metadata:
          serverAddress: http://mimir-prod-query-frontend.monitoring.svc:8080/prometheus
          metricName: http_rps_resale
          query: sum(rate(http_server_request_duration_seconds_count{service_name="goti-resale"}[1m]))
          threshold: "20"
probes:
  liveness:
    httpGet:
      path: /actuator/health/liveness
      port: http
    initialDelaySeconds: 60
    periodSeconds: 10
  readiness:
    httpGet:
      path: /actuator/health/readiness
      port: http
    initialDelaySeconds: 30
    periodSeconds: 5
env:
  - name: SPRING_PROFILES_ACTIVE
    value: "prod"
  - name: JAVA_TOOL_OPTIONS
    value: "-XX:MaxRAMPercentage=60.0"
  - name: GOTI_MESH_ENABLED
    value: "true"
  - name: TICKETING_BASE_URL
    value: "http://goti-ticketing-prod.goti.svc.cluster.local:8080"
  - name: INTERNAL_TICKETING_BASE_URL
    value: "http://goti-ticketing-prod.goti.svc.cluster.local:8080"
  - name: PAYMENT_BASE_URL
    value: "http://goti-payment-prod.goti.svc.cluster.local:8080"
  - name: REDIS_PORT
    value: "6379"
  - name: SPRING_DATA_REDIS_SSL_ENABLED
    value: "true"
  - name: SPRING_DATA_REDIS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: goti-resale-prod-secrets
        key: REDIS_AUTH_TOKEN
  - name: SPRINGDOC_SWAGGER_UI_CONFIG_URL
    value: "/api/docs/resale/v3/api-docs/swagger-config"
  - name: SPRINGDOC_SWAGGER_UI_URL
    value: "/api/docs/resale/v3/api-docs"
envFrom:
  - secretRef:
      name: goti-resale-prod-secrets
# --- Istio 보안/네트워크 정책 ---
istioPolicy:
  # payment → resale (양도 완료/거래 조회), ticketing → resale (마이페이지 양도 조회)
  authorizationPolicy:
    enabled: true
    allowFrom:
      - name: from-payment
        rules:
          - from:
              - source:
                  principals: ["cluster.local/ns/goti/sa/goti-payment-prod"]
            to:
              - operation:
                  paths: ["/api/v1/resales/orders/*"]
                  methods: ["GET", "PATCH"]
      - name: from-ticketing
        rules:
          - from:
              - source:
                  principals: ["cluster.local/ns/goti/sa/goti-ticketing-prod"]
            to:
              - operation:
                  paths: ["/api/v1/resales/listings/count"]
                  methods: ["GET"]
  requestAuthentication:
    enabled: true
    jwks: '{"keys":[{"alg":"RS256","kty":"RSA","kid":"goti-jwt-key-1","e":"AQAB","use":"sig","n":"tXlfiSkDgSujDP6wUyQc57RrUGkTK6x3Fe-W5VhZhBumzDDoRNglcZ3C9AY_iF9GdlZOgcUdKLEVplLuEZGQpHUdA5CwgzQkwNXs242Mgo6QyHGdbDXZXEhe42vl1gcdgnahY7UQLcWGUr6--Fuc5G2LMW6rlTGwagT05SKzGRbTRef3gt8D8_hdsp654vnrdW2ReRQltnffHR9XL8buuKIduGW5vfiCVtNRFsaiT_o0SA86a5gK9qmXUGJIDPLc9onZ3v6G8gtFOES4MmR0elT2VTf22tM0GeIhnDOrjVRBa5I-M6c4OTMDrmeHKhUJygj-rjfNT5effpQzUz0_Xw"}]}'
  jwtAuthorizationPolicy:
    enabled: true
    excludePaths:
      - "/api/v1/resales/histories"
      - "/api/v1/resales/histories/*"
      - "/api/v1/resales/listings/count"
      - "/actuator"
      - "/actuator/*"
      - "/swagger-ui"
      - "/swagger-ui/*"
      - "/v3/api-docs"
      - "/v3/api-docs/*"
  destinationRule:
    enabled: true
image:
  repository: harbor.go-ti.shop/prod/goti-resale
  tag: prod-51-b39eebc
imagePullSecrets:
  - name: ecr-creds
