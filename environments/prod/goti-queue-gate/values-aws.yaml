# AWS EKS — Harbor에서 직접 pull (ECR replication 미설정)
replicaCount: 2
image:
  repository: "harbor.go-ti.shop/prod/goti-queue-gate"
  tag: "prod-3-8add224"
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: harbor-creds
externalSecret:
  enabled: true
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  remoteRef:
    path: /prod/queue-gate
istioPolicy:
  sidecar:
    enabled: true
    egress:
      - hosts:
          - "istio-system/*"
          - "./*"
          - "monitoring/*"
          - "~/*.amazonaws.com"
