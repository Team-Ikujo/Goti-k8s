nameOverride: goti-ticketing-go
service:
  type: ClusterIP
  port: 8080
  name: http
serviceMonitor:
  enabled: true
  port: http
  path: /metrics
  interval: 15s
  release: kube-prometheus-stack-prod
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 256Mi
pdb:
  enabled: true
  minAvailable: 1
# CRITICAL: Java goti-ticketing VS와 동일 (host, path) 조합 → Istio
# MULTIPLE_VIRTUAL_SERVICES_FOR_HOST. cutover 전까지 gateway.enabled=false로 유지.
# cutover 시 Java values의 gateway.enabled=false로 전환 후 본 파일 true.
gateway:
  enabled: false
  hosts:
    - "go-ti.shop"
    - "api.go-ti.shop"
  gatewayRef: "istio-system/goti-shared-gateway"
  httpRoutes:
    - match:
        - uri:
            prefix: "/api/v1/orders"
        - uri:
            prefix: "/api/v1/games"
        - uri:
            prefix: "/api/v1/tickets"
        - uri:
            prefix: "/api/v1/seats"
        - uri:
            prefix: "/api/v1/seat-reservations"
        - uri:
            prefix: "/api/v1/stadium-seats"
        - uri:
            prefix: "/api/v1/teams"
        - uri:
            prefix: "/api/v1/stadiums/"
        - uri:
            prefix: "/api/v1/game-seats"
      route:
        - destination:
            host: goti-ticketing-go-prod
            port:
              number: 8080
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  keda:
    enabled: true
    cooldownPeriod: 300
    triggers:
      # - type: cron
      #   metadata:
      #     timezone: "Asia/Seoul"
      #     start: "30 10 * * *"
      #     end: "0 13 * * *"
      #     desiredReplicas: "4"
      - type: prometheus
        metadata:
          serverAddress: http://mimir-prod-query-frontend.monitoring.svc:8080/prometheus
          metricName: http_rps_ticketing_go
          query: sum(rate(http_server_request_duration_seconds_count{service_name="goti-ticketing-go"}[1m]))
          threshold: "50"
probes:
  liveness:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 3
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    httpGet:
      path: /readyz
      port: http
    initialDelaySeconds: 3
    periodSeconds: 5
    failureThreshold: 3
podAnnotations:
  sidecar.istio.io/inject: "true"
  # ElastiCache Redis TLS — Istio sidecar 우회
  traffic.sidecar.istio.io/excludeOutboundPorts: "6379"
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
securityContext:
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault
# 환경변수: TICKETING_ prefix (Viper가 config.Load("ticketing")에서 자동 생성)
# envFrom 사용하지 않음 — 개별 매핑으로 명시적 관리
env:
  # --- 인프라 (Secret에서 주입) ---
  - name: TICKETING_DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: goti-ticketing-go-prod-secrets
        key: TICKETING_DATABASE_URL
  - name: TICKETING_REDIS_URL
    valueFrom:
      secretKeyRef:
        name: goti-ticketing-go-prod-secrets
        key: TICKETING_REDIS_URL
  - name: TICKETING_JWT_PUBLIC_KEY_PEM
    valueFrom:
      secretKeyRef:
        name: goti-ticketing-go-prod-secrets
        key: TICKETING_JWT_PUBLIC_KEY_PEM
  - name: TICKETING_TICKETING_QR_SECRET
    valueFrom:
      secretKeyRef:
        name: goti-ticketing-go-prod-secrets
        key: TICKETING_TICKETING_QR_SECRET
  - name: TICKETING_QUEUE_TOKEN_SECRET
    valueFrom:
      secretKeyRef:
        name: goti-ticketing-go-prod-secrets
        key: TICKETING_QUEUE_TOKEN_SECRET
  # --- DB pool (SDD Step 5 / S4: RDS max_conn=200, 6서비스 공유) ---
  - name: TICKETING_DATABASE_MAX_CONNS
    value: "3"
  - name: TICKETING_DATABASE_MIN_CONNS
    value: "1"
  - name: TICKETING_DATABASE_MAX_CONN_IDLE_TIME_SEC
    value: "30"
  - name: TICKETING_DATABASE_MAX_CONN_LIFETIME_SEC
    value: "1800"
  # --- 서비스 간 통신 ---
  - name: TICKETING_SERVICES_STADIUM
    value: "http://goti-stadium-go-prod.goti.svc.cluster.local:8080"
  - name: TICKETING_SERVICES_PAYMENT
    value: "http://goti-payment-go-prod.goti.svc.cluster.local:8080"
  - name: TICKETING_SERVICES_RESALE
    value: "http://goti-resale-go-prod.goti.svc.cluster.local:8080"
  # --- ticketing 도메인 스케줄러 (viper default 없음, 필수 주입) ---
  - name: TICKETING_TICKETING_HOLD_EXPIRY_INTERVAL_MS
    value: "1000"
  - name: TICKETING_TICKETING_HOLD_EXPIRY_BATCH_SIZE
    value: "100"
  - name: TICKETING_TICKETING_INVENTORY_SYNC_INTERVAL_MS
    value: "5000"
  # --- OTel ---
  - name: TICKETING_OTEL_ENABLED
    value: "true"
  - name: TICKETING_OTEL_ENDPOINT
    value: "http://otel-collector.monitoring.svc.cluster.local:4317"
  - name: TICKETING_OTEL_SERVICE_NAME
    value: "goti-ticketing-go"
  # OTel SDK 표준 환경변수 (Go SDK가 직접 참조)
  - name: OTEL_SERVICE_NAME
    value: "goti-ticketing-go"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://otel-collector.monitoring.svc.cluster.local:4317"
configMap:
  enabled: false
# --- Istio 보안/네트워크 정책 ---
istioPolicy:
  authorizationPolicy:
    enabled: true
    allowFrom:
      - name: from-payment
        rules:
          - from:
              - source:
                  principals:
                    - "cluster.local/ns/goti/sa/goti-payment-prod"
                    - "cluster.local/ns/goti/sa/goti-payment-go-prod"
            to:
              - operation:
                  paths: ["/api/v1/orders/*"]
                  methods: ["GET", "POST"]
      - name: from-resale
        rules:
          - from:
              - source:
                  principals:
                    - "cluster.local/ns/goti/sa/goti-resale-prod"
                    - "cluster.local/ns/goti/sa/goti-resale-go-prod"
            to:
              - operation:
                  paths: ["/api/v1/tickets/resales/*", "/internal/*"]
                  methods: ["GET", "PATCH", "POST"]
  requestAuthentication:
    enabled: true
    issuer: "goti-user-service"
    jwks: '{"keys":[{"alg":"RS256","kty":"RSA","kid":"goti-jwt-key-1","e":"AQAB","use":"sig","n":"tXlfiSkDgSujDP6wUyQc57RrUGkTK6x3Fe-W5VhZhBumzDDoRNglcZ3C9AY_iF9GdlZOgcUdKLEVplLuEZGQpHUdA5CwgzQkwNXs242Mgo6QyHGdbDXZXEhe42vl1gcdgnahY7UQLcWGUr6--Fuc5G2LMW6rlTGwagT05SKzGRbTRef3gt8D8_hdsp654vnrdW2ReRQltnffHR9XL8buuKIduGW5vfiCVtNRFsaiT_o0SA86a5gK9qmXUGJIDPLc9onZ3v6G8gtFOES4MmR0elT2VTf22tM0GeIhnDOrjVRBa5I-M6c4OTMDrmeHKhUJygj-rjfNT5effpQzUz0_Xw"}]}'
  jwtAuthorizationPolicy:
    enabled: true
    excludePaths:
      - "/api/v1/games"
      - "/api/v1/games/*"
      - "/api/v1/stadiums"
      - "/api/v1/stadiums/*"
      - "/api/v1/orders/internal"
      - "*/payment-order"
      - "*/payment-confirmations"
      - "/api/v1/tickets/purchase-infos"
      - "/api/v1/tickets/resales/*"
      - "/internal/*"
      - "/healthz"
      - "/readyz"
      - "/metrics"
  destinationRule:
    enabled: true
image:
  repository: harbor.go-ti.shop/prod/goti-ticketing-go
  tag: prod-27-b82aae9
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: harbor-creds
