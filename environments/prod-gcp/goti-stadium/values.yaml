nameOverride: goti-stadium
replicaCount: 1
image:
  repository: "asia-northeast3-docker.pkg.dev/project-7b8317dd-9b4d-4f5f-ba2/goti-prod-registry/goti-stadium-go"
  tag: "gcp-9-bc2e881"
  pullPolicy: IfNotPresent
service: # GKE Workload Identity → Artifact Registry 자동 인증
  type: ClusterIP
  port: 8080
  name: http
serviceMonitor:
  enabled: true
  port: http
  path: /metrics
  interval: 15s
  release: kube-prometheus-stack-prod-gcp
probes:
  liveness:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 3
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    httpGet:
      path: /readyz
      port: http
    initialDelaySeconds: 3
    periodSeconds: 5
    failureThreshold: 3
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
podAnnotations:
  sidecar.istio.io/inject: "true"
  # Memorystore Redis TLS+AUTH — Istio mTLS와 충돌하므로 sidecar 우회
  traffic.sidecar.istio.io/excludeOutboundPorts: "6379"
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault
env:
  # --- 인프라 (Secret에서 주입) ---
  - name: STADIUM_DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: goti-stadium-prod-gcp-secrets
        key: DATASOURCE_URL
  - name: STADIUM_REDIS_URL
    valueFrom:
      secretKeyRef:
        name: goti-stadium-prod-gcp-secrets
        key: REDIS_URL
  - name: STADIUM_JWT_PUBLIC_KEY_PEM
    valueFrom:
      secretKeyRef:
        name: goti-stadium-prod-gcp-secrets
        key: JWT_PUBLIC_KEY_PEM
  # --- OTel ---
  - name: STADIUM_OTEL_ENABLED
    value: "true"
  - name: STADIUM_OTEL_ENDPOINT
    value: "http://otel-collector.monitoring.svc.cluster.local:4317"
  - name: STADIUM_OTEL_SERVICE_NAME
    value: "goti-stadium-go"
  - name: OTEL_SERVICE_NAME
    value: "goti-stadium-go"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://otel-collector.monitoring.svc.cluster.local:4317"
configMap:
  enabled: false
gateway:
  enabled: true
  hosts:
    - "go-ti.shop"
    - "api.go-ti.shop"
    - "gcp-api.go-ti.shop"
  gatewayRef: "istio-ingress/goti-shared-gateway"
  httpRoutes:
    - match:
        - uri:
            exact: "/api/v1/stadiums"
        - uri:
            prefix: "/api/v1/baseball-teams"
      route:
        - destination:
            host: goti-stadium-prod-gcp
            port:
              number: 8080
      corsPolicy:
        allowOrigins:
          - exact: https://go-ti.shop
          - exact: https://www.go-ti.shop
        allowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        allowHeaders:
          - Authorization
          - Content-Type
          - X-Requested-With
          - X-GR-BS
        allowCredentials: true
        maxAge: 24h
externalSecret:
  enabled: true
  refreshInterval: "1h"
  secretStoreRef:
    name: gcp-store
    kind: ClusterSecretStore
  remoteRef:
    nameRegexp: "^goti-prod-server-"
    nameRewriteSource: "^goti-prod-server-(.*)$"
    overrideNameRegexp: "^goti-prod-stadium-"
    overrideNameRewriteSource: "^goti-prod-stadium-(.*)$"
# --- Istio 보안/네트워크 정책 ---
istioPolicy:
  authorizationPolicy:
    enabled: true
    allowFrom:
      - name: from-ticketing
        rules:
          - from:
              - source:
                  principals: ["cluster.local/ns/goti/sa/goti-ticketing-prod-gcp"]
            to:
              - operation:
                  paths: ["/api/v1/stadiums*", "/api/v1/baseball-teams*"]
                  methods: ["GET"]
  requestAuthentication:
    enabled: true
    issuer: "goti-user-service"
    jwks: '{"keys":[{"alg":"RS256","kty":"RSA","kid":"goti-jwt-key-1","e":"AQAB","use":"sig","n":"tXlfiSkDgSujDP6wUyQc57RrUGkTK6x3Fe-W5VhZhBumzDDoRNglcZ3C9AY_iF9GdlZOgcUdKLEVplLuEZGQpHUdA5CwgzQkwNXs242Mgo6QyHGdbDXZXEhe42vl1gcdgnahY7UQLcWGUr6--Fuc5G2LMW6rlTGwagT05SKzGRbTRef3gt8D8_hdsp654vnrdW2ReRQltnffHR9XL8buuKIduGW5vfiCVtNRFsaiT_o0SA86a5gK9qmXUGJIDPLc9onZ3v6G8gtFOES4MmR0elT2VTf22tM0GeIhnDOrjVRBa5I-M6c4OTMDrmeHKhUJygj-rjfNT5effpQzUz0_Xw"}]}'
  jwtAuthorizationPolicy:
    enabled: true
    excludePaths:
      - "/api/v1/stadiums"
      - "/api/v1/stadiums/*"
      - "/api/v1/baseball-teams"
      - "/api/v1/baseball-teams/*"
      - "/healthz"
      - "/readyz"
      - "/metrics"
  destinationRule:
    enabled: true
  sidecar:
    enabled: true
    egress:
      - hosts:
          - "istio-system/*"
          - "./*"
          - "monitoring/*"
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 60
  keda:
    enabled: false
