nameOverride: goti-resale
replicaCount: 0
image:
  repository: "asia-northeast3-docker.pkg.dev/project-7b8317dd-9b4d-4f5f-ba2/goti-prod-registry/goti-resale-go"
  tag: "gcp-1-1bfe89e"
  pullPolicy: IfNotPresent
service: # GKE Workload Identity → Artifact Registry 자동 인증
  type: ClusterIP
  port: 8080
  name: http
serviceMonitor:
  enabled: true
  port: http
  path: /metrics
  interval: 15s
  release: kube-prometheus-stack-prod-gcp
probes:
  liveness:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 3
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    httpGet:
      path: /readyz
      port: http
    initialDelaySeconds: 3
    periodSeconds: 5
    failureThreshold: 3
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
podAnnotations:
  sidecar.istio.io/inject: "true"
  # Memorystore Redis TLS+AUTH — Istio mTLS와 충돌하므로 sidecar 우회
  traffic.sidecar.istio.io/excludeOutboundPorts: "6379"
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault
env:
  # --- 인프라 (Secret에서 주입) ---
  - name: RESALE_DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: goti-resale-prod-gcp-secrets
        key: DATASOURCE_URL
  - name: RESALE_REDIS_URL
    valueFrom:
      secretKeyRef:
        name: goti-resale-prod-gcp-secrets
        key: REDIS_URL
  - name: RESALE_JWT_PUBLIC_KEY_PEM
    valueFrom:
      secretKeyRef:
        name: goti-resale-prod-gcp-secrets
        key: JWT_PUBLIC_KEY_PEM
  # --- 서비스 간 통신 ---
  - name: RESALE_SERVICES_TICKETING
    value: "http://goti-ticketing-prod-gcp.goti.svc.cluster.local:8080"
  - name: RESALE_SERVICES_PAYMENT
    value: "http://goti-payment-prod-gcp.goti.svc.cluster.local:8080"
  # --- OTel ---
  - name: RESALE_OTEL_ENABLED
    value: "true"
  - name: RESALE_OTEL_ENDPOINT
    value: "http://otel-collector.monitoring.svc.cluster.local:4317"
  - name: RESALE_OTEL_SERVICE_NAME
    value: "goti-resale-go"
  - name: OTEL_SERVICE_NAME
    value: "goti-resale-go"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://otel-collector.monitoring.svc.cluster.local:4317"
configMap:
  enabled: false
gateway:
  enabled: true
  hosts:
    - "go-ti.shop"
    - "api.go-ti.shop"
    - "gcp-api.go-ti.shop"
  gatewayRef: "istio-ingress/goti-shared-gateway"
  httpRoutes:
    - match:
        - uri:
            prefix: "/api/v1/resales"
      route:
        - destination:
            host: goti-resale-prod-gcp
            port:
              number: 8080
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 6
  keda:
    enabled: true
    cooldownPeriod: 180
    triggers:
      - type: prometheus
        metadata:
          serverAddress: http://mimir-prod-query-frontend.monitoring.svc:8080/prometheus
          metricName: http_rps_resale_go
          query: sum(rate(http_server_request_duration_seconds_count{service_name="goti-resale-go"}[1m]))
          threshold: "20"
externalSecret:
  enabled: true
  refreshInterval: "1h"
  secretStoreRef:
    name: gcp-store
    kind: ClusterSecretStore
  remoteRef:
    nameRegexp: "^goti-prod-server-"
    nameRewriteSource: "^goti-prod-server-(.*)$"
    overrideNameRegexp: "^goti-prod-resale-"
    overrideNameRewriteSource: "^goti-prod-resale-(.*)$"
# --- Istio 보안/네트워크 정책 ---
istioPolicy:
  # payment → resale (양도 완료/거래 조회), ticketing → resale (마이페이지 양도 조회)
  authorizationPolicy:
    enabled: true
    allowFrom:
      - name: from-payment
        rules:
          - from:
              - source:
                  principals: ["cluster.local/ns/goti/sa/goti-payment-prod-gcp"]
            to:
              - operation:
                  paths: ["/api/v1/resales/orders/*"]
                  methods: ["GET", "PATCH"]
      - name: from-ticketing
        rules:
          - from:
              - source:
                  principals: ["cluster.local/ns/goti/sa/goti-ticketing-prod-gcp"]
            to:
              - operation:
                  paths: ["/api/v1/resales/listings/count"]
                  methods: ["GET"]
  requestAuthentication:
    enabled: true
    issuer: "goti-user-service"
    jwks: '{"keys":[{"alg":"RS256","kty":"RSA","kid":"goti-jwt-key-1","e":"AQAB","use":"sig","n":"tXlfiSkDgSujDP6wUyQc57RrUGkTK6x3Fe-W5VhZhBumzDDoRNglcZ3C9AY_iF9GdlZOgcUdKLEVplLuEZGQpHUdA5CwgzQkwNXs242Mgo6QyHGdbDXZXEhe42vl1gcdgnahY7UQLcWGUr6--Fuc5G2LMW6rlTGwagT05SKzGRbTRef3gt8D8_hdsp654vnrdW2ReRQltnffHR9XL8buuKIduGW5vfiCVtNRFsaiT_o0SA86a5gK9qmXUGJIDPLc9onZ3v6G8gtFOES4MmR0elT2VTf22tM0GeIhnDOrjVRBa5I-M6c4OTMDrmeHKhUJygj-rjfNT5effpQzUz0_Xw"}]}'
  jwtAuthorizationPolicy:
    enabled: true
    excludePaths:
      - "/api/v1/resales/histories"
      - "/api/v1/resales/histories/*"
      - "/api/v1/resales/listings/count"
      - "/api/v1/resales/orders/purchases"
      - "/healthz"
      - "/readyz"
      - "/metrics"
  destinationRule:
    enabled: true
  sidecar:
    enabled: true
    egress:
      - hosts:
          - "istio-system/*"
          - "./*"
          - "monitoring/*"
