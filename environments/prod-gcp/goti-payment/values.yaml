nameOverride: goti-payment
replicaCount: 0
image:
  repository: "harbor.go-ti.shop/prod/goti-payment-go"
  tag: "prod-10-a2b7aea"
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: harbor-creds
service: # GKE Workload Identity → Artifact Registry 자동 인증
  type: ClusterIP
  port: 8080
  name: http
serviceMonitor:
  enabled: true
  port: http
  path: /metrics
  interval: 15s
  release: kube-prometheus-stack-prod-gcp
probes:
  liveness:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 3
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    httpGet:
      path: /readyz
      port: http
    initialDelaySeconds: 3
    periodSeconds: 5
    failureThreshold: 3
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
podAnnotations:
  sidecar.istio.io/inject: "true"
  # Memorystore Redis TLS+AUTH — Istio mTLS와 충돌하므로 sidecar 우회
  traffic.sidecar.istio.io/excludeOutboundPorts: "6379"
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault
env:
  # --- 인프라 (Secret에서 주입) ---
  - name: PAYMENT_DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: goti-payment-prod-gcp-secrets
        key: DATASOURCE_URL
  - name: PAYMENT_REDIS_URL
    valueFrom:
      secretKeyRef:
        name: goti-payment-prod-gcp-secrets
        key: REDIS_URL
  - name: PAYMENT_JWT_PUBLIC_KEY_PEM
    valueFrom:
      secretKeyRef:
        name: goti-payment-prod-gcp-secrets
        key: JWT_PUBLIC_KEY_PEM
  # --- OTel ---
  - name: PAYMENT_OTEL_ENABLED
    value: "true"
  - name: PAYMENT_OTEL_ENDPOINT
    value: "http://otel-collector.monitoring.svc.cluster.local:4317"
  - name: PAYMENT_OTEL_SERVICE_NAME
    value: "goti-payment-go"
  - name: OTEL_SERVICE_NAME
    value: "goti-payment-go"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://otel-collector.monitoring.svc.cluster.local:4317"
  # --- 서비스 간 통신 (payment → ticketing, resale) ---
  - name: PAYMENT_SERVICES_TICKETING
    value: "http://goti-ticketing-prod-gcp.goti.svc.cluster.local:8080"
  - name: PAYMENT_SERVICES_RESALE
    value: "http://goti-resale-prod-gcp.goti.svc.cluster.local:8080"
configMap:
  enabled: false
gateway:
  enabled: true
  hosts:
    - "go-ti.shop"
    - "api.go-ti.shop"
    - "gcp-api.go-ti.shop"
  gatewayRef: "istio-ingress/goti-shared-gateway"
  httpRoutes:
    - match:
        - uri:
            prefix: "/api/v1/payments"
      route:
        - destination:
            host: goti-payment-prod-gcp
            port:
              number: 8080
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 8
  keda:
    enabled: true
    cooldownPeriod: 300
    triggers:
      - type: cron
        metadata:
          timezone: "Asia/Seoul"
          start: "30 10 * * *"
          end: "0 13 * * *"
          desiredReplicas: "2" # Go는 cold start 빠름 (Java 4 → Go 2)
      - type: prometheus
        metadata:
          serverAddress: http://mimir-prod-query-frontend.monitoring.svc:8080/prometheus
          metricName: http_rps_payment_go
          query: sum(rate(http_server_request_duration_seconds_count{service_name="goti-payment-go"}[1m]))
          threshold: "30"
externalSecret:
  enabled: true
  refreshInterval: "1h"
  secretStoreRef:
    name: gcp-store
    kind: ClusterSecretStore
  remoteRef:
    nameRegexp: "^goti-prod-server-"
    nameRewriteSource: "^goti-prod-server-(.*)$"
    overrideNameRegexp: "^goti-prod-payment-"
    overrideNameRewriteSource: "^goti-prod-payment-(.*)$"
# --- Istio 보안/네트워크 정책 ---
istioPolicy:
  # resale → payment (양도 결제/환불)
  authorizationPolicy:
    enabled: true
    allowFrom:
      - name: from-resale
        rules:
          - from:
              - source:
                  principals: ["cluster.local/ns/goti/sa/goti-resale-prod-gcp"]
            to:
              - operation:
                  paths: ["/api/v1/payments/resales", "/api/v1/payments/resales/*"]
                  methods: ["POST", "PATCH"]
  requestAuthentication:
    enabled: true
    issuer: "goti-user-service"
    jwks: '{"keys":[{"alg":"RS256","kty":"RSA","kid":"goti-jwt-key-1","e":"AQAB","use":"sig","n":"tXlfiSkDgSujDP6wUyQc57RrUGkTK6x3Fe-W5VhZhBumzDDoRNglcZ3C9AY_iF9GdlZOgcUdKLEVplLuEZGQpHUdA5CwgzQkwNXs242Mgo6QyHGdbDXZXEhe42vl1gcdgnahY7UQLcWGUr6--Fuc5G2LMW6rlTGwagT05SKzGRbTRef3gt8D8_hdsp654vnrdW2ReRQltnffHR9XL8buuKIduGW5vfiCVtNRFsaiT_o0SA86a5gK9qmXUGJIDPLc9onZ3v6G8gtFOES4MmR0elT2VTf22tM0GeIhnDOrjVRBa5I-M6c4OTMDrmeHKhUJygj-rjfNT5effpQzUz0_Xw"}]}'
  jwtAuthorizationPolicy:
    enabled: true
    excludePaths:
      - "/healthz"
      - "/readyz"
      - "/metrics"
  destinationRule:
    enabled: true
  sidecar:
    enabled: true
    egress:
      - hosts:
          - "istio-system/*"
          - "./*"
          - "monitoring/*"
