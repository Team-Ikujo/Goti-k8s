nameOverride: goti-user
replicaCount: 2
image:
  repository: "asia-northeast3-docker.pkg.dev/project-7b8317dd-9b4d-4f5f-ba2/goti-prod-registry/goti-user-go"
  tag: "gcp-3-a47c425"
  pullPolicy: IfNotPresent
service: # GKE Workload Identity → Artifact Registry 자동 인증
  type: ClusterIP
  port: 8080
  name: http
serviceMonitor:
  enabled: true
  port: http
  path: /metrics
  interval: 15s
  release: kube-prometheus-stack-prod-gcp
probes:
  liveness:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 3
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    httpGet:
      path: /readyz
      port: http
    initialDelaySeconds: 3
    periodSeconds: 5
    failureThreshold: 3
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
podAnnotations:
  sidecar.istio.io/inject: "true"
  # Memorystore Redis TLS+AUTH — Istio mTLS와 충돌하므로 sidecar 우회
  traffic.sidecar.istio.io/excludeOutboundPorts: "6379"
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault
env:
  # --- 인프라 (Secret에서 주입) ---
  - name: USER_DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: goti-user-prod-gcp-secrets
        key: DATASOURCE_URL
  - name: USER_REDIS_URL
    valueFrom:
      secretKeyRef:
        name: goti-user-prod-gcp-secrets
        key: REDIS_URL
  - name: USER_JWT_PUBLIC_KEY_PEM
    valueFrom:
      secretKeyRef:
        name: goti-user-prod-gcp-secrets
        key: JWT_PUBLIC_KEY_PEM
  # goti-user는 로그인 시 JWT 서명 발급 → private key 필수.
  # AWS SSM의 /prod/user/JWT_RSA_PRIVATE_KEY와 동일 값 (cross-cloud 세션 호환).
  - name: USER_JWT_PRIVATE_KEY_PEM
    valueFrom:
      secretKeyRef:
        name: goti-user-prod-gcp-secrets
        key: JWT_RSA_PRIVATE_KEY
  # --- OAuth (Secret에서 주입) ---
  # Go 코드가 os.Getenv("OAUTH_..")로 직접 읽으므로 USER_ 접두사 없음.
  # Secret 키는 Terraform config 네이밍(KAKAO_CLIENT_ID / KAKAO_SECRET 등)을 그대로 사용.
  - name: OAUTH_KAKAO_CLIENT_ID
    valueFrom:
      secretKeyRef:
        name: goti-user-prod-gcp-secrets
        key: KAKAO_CLIENT_ID
  - name: OAUTH_KAKAO_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: goti-user-prod-gcp-secrets
        key: KAKAO_SECRET
  - name: OAUTH_KAKAO_REDIRECT_URI
    valueFrom:
      secretKeyRef:
        name: goti-user-prod-gcp-secrets
        key: KAKAO_REDIRECT_URI
  - name: OAUTH_NAVER_CLIENT_ID
    valueFrom:
      secretKeyRef:
        name: goti-user-prod-gcp-secrets
        key: NAVER_CLIENT_ID
  - name: OAUTH_NAVER_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: goti-user-prod-gcp-secrets
        key: NAVER_SECRET
  - name: OAUTH_NAVER_REDIRECT_URI
    valueFrom:
      secretKeyRef:
        name: goti-user-prod-gcp-secrets
        key: NAVER_REDIRECT_URI
  - name: OAUTH_GOOGLE_CLIENT_ID
    valueFrom:
      secretKeyRef:
        name: goti-user-prod-gcp-secrets
        key: GOOGLE_CLIENT_ID
  - name: OAUTH_GOOGLE_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: goti-user-prod-gcp-secrets
        key: GOOGLE_SECRET
  - name: OAUTH_GOOGLE_REDIRECT_URI
    valueFrom:
      secretKeyRef:
        name: goti-user-prod-gcp-secrets
        key: GOOGLE_REDIRECT_URI
  # --- SMS (CoolSMS/Nurigo) ---
  # Go 코드가 os.Getenv("SMS_*")로 직접 읽으므로 USER_ 접두사 없음.
  # AWS는 envFrom으로 bulk load되지만 GCP는 개별 명시 필요.
  - name: SMS_ENABLED
    value: "true"
  - name: SMS_API_KEY
    valueFrom:
      secretKeyRef:
        name: goti-user-prod-gcp-secrets
        key: SMS_API_KEY
  - name: SMS_API_SECRET
    valueFrom:
      secretKeyRef:
        name: goti-user-prod-gcp-secrets
        key: SMS_API_SECRET
  - name: SMS_API_SENDER
    valueFrom:
      secretKeyRef:
        name: goti-user-prod-gcp-secrets
        key: SMS_API_SENDER
  - name: SMS_API_DOMAIN
    valueFrom:
      secretKeyRef:
        name: goti-user-prod-gcp-secrets
        key: SMS_API_DOMAIN
  # --- OTel ---
  - name: USER_OTEL_ENABLED
    value: "true"
  - name: USER_OTEL_ENDPOINT
    value: "http://otel-collector.monitoring.svc.cluster.local:4317"
  - name: USER_OTEL_SERVICE_NAME
    value: "goti-user-go"
  - name: OTEL_SERVICE_NAME
    value: "goti-user-go"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://otel-collector.monitoring.svc.cluster.local:4317"
configMap:
  enabled: false
gateway:
  enabled: true
  hosts:
    - "go-ti.shop"
    - "api.go-ti.shop"
    - "gcp-api.go-ti.shop"
  gatewayRef: "istio-ingress/goti-shared-gateway"
  httpRoutes:
    - match:
        - uri:
            prefix: "/api/v1/auth"
        - uri:
            prefix: "/api/v1/members"
        - uri:
            prefix: "/api/v1/test"
      route:
        - destination:
            host: goti-user-prod-gcp
            port:
              number: 8080
autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 10
  keda:
    enabled: true
    cooldownPeriod: 300
    triggers:
      - type: cron
        metadata:
          timezone: "Asia/Seoul"
          start: "50 10 * * *"
          end: "0 13 * * *"
          desiredReplicas: "3" # Go는 cold start 빠름 (Java 5 → Go 3)
      - type: prometheus
        metadata:
          serverAddress: http://mimir-prod-query-frontend.monitoring.svc:8080/prometheus
          metricName: http_rps_user_go
          query: sum(rate(http_server_request_duration_seconds_count{service_name="goti-user-go"}[1m]))
          threshold: "40"
externalSecret:
  enabled: true
  refreshInterval: "1h"
  secretStoreRef:
    name: gcp-store
    kind: ClusterSecretStore
  remoteRef:
    nameRegexp: "^goti-prod-server-"
    nameRewriteSource: "^goti-prod-server-(.*)$"
    overrideNameRegexp: "^goti-prod-user-"
    overrideNameRewriteSource: "^goti-prod-user-(.*)$"
# --- Istio 보안/네트워크 정책 ---
istioPolicy:
  authorizationPolicy:
    enabled: true
    allowFrom: []
  requestAuthentication:
    enabled: true
    issuer: "goti-user-service"
    jwks: '{"keys":[{"alg":"RS256","kty":"RSA","kid":"goti-jwt-key-1","e":"AQAB","use":"sig","n":"tXlfiSkDgSujDP6wUyQc57RrUGkTK6x3Fe-W5VhZhBumzDDoRNglcZ3C9AY_iF9GdlZOgcUdKLEVplLuEZGQpHUdA5CwgzQkwNXs242Mgo6QyHGdbDXZXEhe42vl1gcdgnahY7UQLcWGUr6--Fuc5G2LMW6rlTGwagT05SKzGRbTRef3gt8D8_hdsp654vnrdW2ReRQltnffHR9XL8buuKIduGW5vfiCVtNRFsaiT_o0SA86a5gK9qmXUGJIDPLc9onZ3v6G8gtFOES4MmR0elT2VTf22tM0GeIhnDOrjVRBa5I-M6c4OTMDrmeHKhUJygj-rjfNT5effpQzUz0_Xw"}]}'
  testIpAllowlist:
    enabled: false
  jwtAuthorizationPolicy:
    enabled: true
    excludePaths:
      - "/api/v1/auth"
      - "/api/v1/auth/*"
      - "/api/v1/test"
      - "/api/v1/test/*"
      - "/healthz"
      - "/readyz"
      - "/metrics"
      - "/.well-known"
      - "/.well-known/*"
  destinationRule:
    enabled: true
  sidecar:
    enabled: true
    egress:
      - hosts:
          - "istio-system/*"
          - "./*"
          - "monitoring/*"
          - "~/*.googleapis.com" # OAuth (Google)
          - "~/*.naver.com" # OAuth (Naver)
          - "~/*.kakao.com" # OAuth (Kakao)
          - "~/*.nurigo.com" # SMS (CoolSMS)
