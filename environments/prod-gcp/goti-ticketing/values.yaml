nameOverride: goti-ticketing
replicaCount: 2

image:
  repository: "asia-northeast3-docker.pkg.dev/project-7b8317dd-9b4d-4f5f-ba2/goti-prod-registry/goti-ticketing-go"
  tag: "bootstrap-20260414-gamestatus"
  pullPolicy: IfNotPresent

imagePullSecrets: []  # GKE Workload Identity → Artifact Registry 자동 인증

service:
  type: ClusterIP
  port: 8080
  name: http

serviceMonitor:
  enabled: true
  port: http
  path: /metrics
  interval: 15s
  release: kube-prometheus-stack-prod-gcp

probes:
  liveness:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 3
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    httpGet:
      path: /readyz
      port: http
    initialDelaySeconds: 3
    periodSeconds: 5
    failureThreshold: 3

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

podAnnotations:
  sidecar.istio.io/inject: "true"
  # Memorystore Redis TLS+AUTH — Istio mTLS와 충돌하므로 sidecar 우회
  traffic.sidecar.istio.io/excludeOutboundPorts: "6379"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

env:
  # --- 인프라 (Secret에서 주입) ---
  - name: TICKETING_DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: goti-ticketing-prod-gcp-secrets
        key: DATASOURCE_URL
  - name: TICKETING_REDIS_URL
    valueFrom:
      secretKeyRef:
        name: goti-ticketing-prod-gcp-secrets
        key: REDIS_URL
  - name: TICKETING_JWT_PUBLIC_KEY_PEM
    valueFrom:
      secretKeyRef:
        name: goti-ticketing-prod-gcp-secrets
        key: JWT_PUBLIC_KEY_PEM
  - name: TICKETING_TICKETING_QR_SECRET
    valueFrom:
      secretKeyRef:
        name: goti-ticketing-prod-gcp-secrets
        key: TICKETING_QR_SECRET
  - name: TICKETING_QUEUE_TOKEN_SECRET
    valueFrom:
      secretKeyRef:
        name: goti-ticketing-prod-gcp-secrets
        key: QUEUE_TOKEN_SECRET
  # --- ticketing 도메인 스케줄러 (viper default 없음, 필수 주입) ---
  - name: TICKETING_TICKETING_HOLD_EXPIRY_INTERVAL_MS
    value: "1000"
  - name: TICKETING_TICKETING_HOLD_EXPIRY_BATCH_SIZE
    value: "100"
  - name: TICKETING_TICKETING_INVENTORY_SYNC_INTERVAL_MS
    value: "5000"
  # --- 서비스 간 통신 ---
  - name: TICKETING_SERVICES_STADIUM
    value: "http://goti-stadium-prod-gcp.goti.svc.cluster.local:8080"
  - name: TICKETING_SERVICES_PAYMENT
    value: "http://goti-payment-prod-gcp.goti.svc.cluster.local:8080"
  - name: TICKETING_SERVICES_RESALE
    value: "http://goti-resale-prod-gcp.goti.svc.cluster.local:8080"
  # --- OTel ---
  - name: TICKETING_OTEL_ENABLED
    value: "true"
  - name: TICKETING_OTEL_ENDPOINT
    value: "http://otel-collector.monitoring.svc.cluster.local:4317"
  - name: TICKETING_OTEL_SERVICE_NAME
    value: "goti-ticketing-go"
  - name: OTEL_SERVICE_NAME
    value: "goti-ticketing-go"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://otel-collector.monitoring.svc.cluster.local:4317"

configMap:
  enabled: false

gateway:
  enabled: true
  hosts:
    - "go-ti.shop"
    - "api.go-ti.shop"
    - "gcp-api.go-ti.shop"
  gatewayRef: "istio-ingress/goti-shared-gateway"
  httpRoutes:
    - match:
        - uri:
            prefix: "/api/v1/orders"
        - uri:
            prefix: "/api/v1/games"
        - uri:
            prefix: "/api/v1/tickets"
        - uri:
            prefix: "/api/v1/seats"
        - uri:
            prefix: "/api/v1/seat-reservations"
        - uri:
            prefix: "/api/v1/stadium-seats"
        - uri:
            prefix: "/api/v1/game-seats"
        - uri:
            prefix: "/api/v1/teams"
        - uri:
            prefix: "/api/v1/stadiums/"
      route:
        - destination:
            host: goti-ticketing-prod-gcp
            port:
              number: 8080

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  keda:
    enabled: true
    cooldownPeriod: 300
    triggers:
      - type: cron
        metadata:
          timezone: "Asia/Seoul"
          start: "30 10 * * *"
          end: "0 13 * * *"
          desiredReplicas: "3"  # Go는 cold start 빠름 (Java 6 → Go 3)
      - type: prometheus
        metadata:
          serverAddress: http://mimir-prod-query-frontend.monitoring.svc:8080/prometheus
          metricName: http_rps_ticketing_go
          query: sum(rate(http_server_request_duration_seconds_count{service_name="goti-ticketing-go"}[1m]))
          threshold: "50"

externalSecret:
  enabled: true
  refreshInterval: "1h"
  secretStoreRef:
    name: gcp-store
    kind: ClusterSecretStore
  remoteRef:
    nameRegexp: "^goti-prod-server-"
    nameRewriteSource: "^goti-prod-server-(.*)$"
    overrideNameRegexp: "^goti-prod-ticketing-"
    overrideNameRewriteSource: "^goti-prod-ticketing-(.*)$"

# --- Istio 보안/네트워크 정책 ---
istioPolicy:
  authorizationPolicy:
    enabled: true
    allowFrom:
      - name: from-payment
        rules:
          - from:
              - source:
                  principals: ["cluster.local/ns/goti/sa/goti-payment-prod-gcp"]
            to:
              - operation:
                  paths: ["/api/v1/orders/*"]
                  methods: ["GET", "POST"]
      - name: from-resale
        rules:
          - from:
              - source:
                  principals: ["cluster.local/ns/goti/sa/goti-resale-prod-gcp"]
            to:
              - operation:
                  paths: ["/api/v1/tickets/resales/*", "/internal/*"]
                  methods: ["GET", "PATCH", "POST"]
  requestAuthentication:
    enabled: true
    issuer: "goti-user-service"
    jwks: '{"keys":[{"alg":"RS256","kty":"RSA","kid":"goti-jwt-key-1","e":"AQAB","use":"sig","n":"tXlfiSkDgSujDP6wUyQc57RrUGkTK6x3Fe-W5VhZhBumzDDoRNglcZ3C9AY_iF9GdlZOgcUdKLEVplLuEZGQpHUdA5CwgzQkwNXs242Mgo6QyHGdbDXZXEhe42vl1gcdgnahY7UQLcWGUr6--Fuc5G2LMW6rlTGwagT05SKzGRbTRef3gt8D8_hdsp654vnrdW2ReRQltnffHR9XL8buuKIduGW5vfiCVtNRFsaiT_o0SA86a5gK9qmXUGJIDPLc9onZ3v6G8gtFOES4MmR0elT2VTf22tM0GeIhnDOrjVRBa5I-M6c4OTMDrmeHKhUJygj-rjfNT5effpQzUz0_Xw"}]}'
  jwtAuthorizationPolicy:
    enabled: true
    excludePaths:
      - "/api/v1/games"
      - "/api/v1/games/*"
      - "/api/v1/stadiums"
      - "/api/v1/stadiums/*"
      - "/api/v1/orders/internal"
      - "*/payment-order"
      - "*/payment-confirmations"
      - "/api/v1/tickets/purchase-infos"
      - "/api/v1/tickets/resales/*"
      - "/internal/*"
      - "/healthz"
      - "/readyz"
      - "/metrics"
  destinationRule:
    enabled: true
  sidecar:
    enabled: true
    egress:
      - hosts:
          - "istio-system/*"
          - "./*"
          - "monitoring/*"
