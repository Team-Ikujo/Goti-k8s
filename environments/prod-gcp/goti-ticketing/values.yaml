nameOverride: goti-ticketing
replicaCount: 2
image:
  repository: "asia-northeast3-docker.pkg.dev/goti-gcp/goti-prod-registry/goti-ticketing"
  tag: "prod-43-6f4c644"
  pullPolicy: IfNotPresent
imagePullSecrets: []
podAnnotations:
  instrumentation.opentelemetry.io/inject-java: "goti/goti-java"
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi
probes:
  liveness:
    httpGet:
      path: /actuator/health/liveness
      port: http
    initialDelaySeconds: 60
    periodSeconds: 10
  readiness:
    httpGet:
      path: /actuator/health/readiness
      port: http
    initialDelaySeconds: 30
    periodSeconds: 5
env:
  - name: SPRING_PROFILES_ACTIVE
    value: "prod"
  - name: JAVA_TOOL_OPTIONS
    value: "-XX:MaxRAMPercentage=60.0"
  - name: REDIS_PORT
    value: "6379"
  - name: SPRING_DATA_REDIS_SSL_ENABLED
    value: "true"
  - name: SPRING_DATA_REDIS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: goti-ticketing-prod-secrets
        key: REDIS_AUTH_TOKEN
envFrom:
  - secretRef:
      name: goti-ticketing-prod-secrets
externalSecret:
  enabled: true
  refreshInterval: "1h"
  secretStoreRef:
    name: gcp-store
    kind: ClusterSecretStore
  remoteRef:
    nameRegexp: "^goti-prod-server-"
    nameRewriteSource: "^goti-prod-server-(.*)$"
    overrideNameRegexp: "^goti-prod-ticketing-"
    overrideNameRewriteSource: "^goti-prod-ticketing-(.*)$"
istioPolicy:
  # payment → ticketing (결제 확인 콜백), resale → ticketing (내부 연동)
  authorizationPolicy:
    enabled: true
    allowFrom:
      - name: from-payment
        rules:
          - from:
              - source:
                  principals: ["cluster.local/ns/goti/sa/goti-payment-prod"]
            to:
              - operation:
                  paths: ["/api/v1/orders/*"]
                  methods: ["GET", "POST"]
      - name: from-resale
        rules:
          - from:
              - source:
                  principals: ["cluster.local/ns/goti/sa/goti-resale-prod"]
            to:
              - operation:
                  paths: ["/api/v1/tickets/resales/*"]
                  methods: ["GET", "PATCH", "POST"]
  requestAuthentication:
    enabled: true
    jwks: '{"keys":[{"alg":"RS256","kty":"RSA","kid":"goti-jwt-key-1","e":"AQAB","use":"sig","n":"tXlfiSkDgSujDP6wUyQc57RrUGkTK6x3Fe-W5VhZhBumzDDoRNglcZ3C9AY_iF9GdlZOgcUdKLEVplLuEZGQpHUdA5CwgzQkwNXs242Mgo6QyHGdbDXZXEhe42vl1gcdgnahY7UQLcWGUr6--Fuc5G2LMW6rlTGwagT05SKzGRbTRef3gt8D8_hdsp654vnrdW2ReRQltnffHR9XL8buuKIduGW5vfiCVtNRFsaiT_o0SA86a5gK9qmXUGJIDPLc9onZ3v6G8gtFOES4MmR0elT2VTf22tM0GeIhnDOrjVRBa5I-M6c4OTMDrmeHKhUJygj-rjfNT5effpQzUz0_Xw"}]}'
  jwtAuthorizationPolicy:
    enabled: true
    excludePaths:
      - "/api/v1/games"
      - "/api/v1/games/*"
      - "/api/v1/stadiums"
      - "/api/v1/stadiums/*"
      - "/api/v1/orders/internal"
      - "*/payment-order"
      - "*/payment-confirmations"
      - "/api/v1/tickets/purchase-infos"
      - "/api/v1/tickets/resales/*"
      - "/actuator"
      - "/actuator/*"
      - "/swagger-ui"
      - "/swagger-ui/*"
      - "/v3/api-docs"
      - "/v3/api-docs/*"
  destinationRule:
    enabled: true
  sidecar:
    enabled: true
    egress:
      - hosts:
          - "istio-system/*"
          - "./*"
          - "monitoring/*"
          - "kafka/*"
