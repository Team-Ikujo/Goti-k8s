nameOverride: goti-load-observer
replicaCount: 1
image:
  repository: "asia-northeast3-docker.pkg.dev/project-7b8317dd-9b4d-4f5f-ba2/goti-prod-registry/goti-load-observer"
  tag: "gcp-3-cc57b0f"
  pullPolicy: IfNotPresent
imagePullSecrets: []
service:
  type: ClusterIP
  port: 9090
  name: metrics
serviceMonitor:
  enabled: true
  port: metrics
  interval: 30s
  path: /metrics
  release: kube-prometheus-stack-prod-gcp
probes:
  liveness:
    httpGet:
      path: /healthz
      port: metrics
    initialDelaySeconds: 5
    periodSeconds: 15
    failureThreshold: 3
  readiness:
    httpGet:
      path: /healthz
      port: metrics
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3
resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi
env:
  - name: DB_DSN
    valueFrom:
      secretKeyRef:
        name: goti-load-observer-prod-gcp-secrets
        key: LOAD_OBSERVER_DB_DSN
  - name: REDIS_ADDR
    valueFrom:
      secretKeyRef:
        name: goti-load-observer-prod-gcp-secrets
        key: LOAD_OBSERVER_REDIS_ADDR
  # Memorystore AUTH 활성 — Go config.go 의 REDIS_PASSWORD env 로 주입
  - name: REDIS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: goti-load-observer-prod-gcp-secrets
        key: LOAD_OBSERVER_REDIS_PASSWORD
  - name: SERVER_PORT
    value: "9090"
  - name: POLL_INTERVAL_DB
    value: "60s"
  - name: POLL_INTERVAL_REDIS
    value: "30s"
  # Cloudflare Worker → /__worker-metrics/ingest shared secret.
  # GCP Secret Manager 에 동일 값 (goti-prod-load-observer-WORKER_INGEST_TOKEN) 필요.
  # AWS 쪽 SSM 값과 반드시 **동일**해야 Worker fanout 시 양쪽 모두 authorized.
  - name: WORKER_INGEST_TOKEN
    valueFrom:
      secretKeyRef:
        name: goti-load-observer-prod-gcp-secrets
        key: WORKER_INGEST_TOKEN
podAnnotations:
  sidecar.istio.io/inject: "true"
  # Memorystore Redis TLS+AUTH — Istio mTLS와 충돌하므로 sidecar 우회
  traffic.sidecar.istio.io/excludeOutboundPorts: "6379"
gateway:
  # Cloudflare Worker → /__worker-metrics/ingest 수신용 VirtualService.
  # gcp-api.go-ti.shop 로 들어온 traffic 중 이 prefix 만 load-observer 로 라우팅.
  # (aws-api.go-ti.shop 는 AWS 쪽 cluster 의 동일 VS 가 별도로 처리)
  enabled: true
  hosts:
    - "gcp-api.go-ti.shop"
  gatewayRef: "istio-ingress/goti-shared-gateway"
  httpRoutes:
    - match:
        - uri:
            prefix: "/__worker-metrics/"
      route:
        - destination:
            host: goti-load-observer-prod-gcp
            port:
              number: 9090
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault
externalSecret:
  enabled: true
  refreshInterval: "1h"
  secretStoreRef:
    name: gcp-store
    kind: ClusterSecretStore
  remoteRef:
    nameRegexp: "^goti-prod-load-observer-"
    nameRewriteSource: "^goti-prod-load-observer-(.*)$"
istioPolicy:
  authorizationPolicy:
    enabled: true
    allowFrom:
      - name: allow-monitoring-scrape
        rules:
          - from:
              - source:
                  namespaces: ["monitoring"]
            to:
              - operation:
                  paths: ["/metrics", "/healthz"]
                  methods: ["GET"]
      - name: allow-istio-gateway
        rules:
          - from:
              - source:
                  namespaces: ["istio-system"]
  destinationRule:
    enabled: true
  sidecar:
    enabled: true
    egress:
      - hosts:
          - "istio-system/*"
          - "./*"
          - "monitoring/*"
