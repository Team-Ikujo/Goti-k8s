nameOverride: goti-queue-gate

replicaCount: 1

image:
  repository: "asia-northeast3-docker.pkg.dev/project-7b8317dd-9b4d-4f5f-ba2/goti-prod-registry/goti-queue-gate"
  tag: "bootstrap-20260413"
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  type: ClusterIP
  port: 8080
  name: http

serviceMonitor:
  enabled: true
  port: http
  path: /metrics
  interval: 15s
  release: kube-prometheus-stack-prod-gcp

probes:
  liveness:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 3
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    httpGet:
      path: /readyz
      port: http
    initialDelaySeconds: 3
    periodSeconds: 5
    failureThreshold: 3

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

env:
  - name: QUEUEGATE_REDIS_URL
    valueFrom:
      secretKeyRef:
        name: goti-queue-gate-prod-gcp-secrets
        key: QUEUEGATE_REDIS_URL
  - name: QUEUEGATE_GATE_QUEUE_URL
    valueFrom:
      secretKeyRef:
        name: goti-queue-gate-prod-gcp-secrets
        key: QUEUEGATE_GATE_QUEUE_URL

podAnnotations:
  sidecar.istio.io/inject: "true"
  # Memorystore Redis TLS+AUTH — Istio mTLS와 충돌하므로 sidecar 우회
  traffic.sidecar.istio.io/excludeOutboundPorts: "6379"

gateway:
  enabled: true
  hosts:
    - "go-ti.shop"
    - "api.go-ti.shop"
    - "gcp-api.go-ti.shop"
  gatewayRef: "istio-system/goti-shared-gateway"
  httpRoutes:
    - match:
        - uri:
            prefix: "/gate"
      route:
        - destination:
            host: goti-queue-gate-prod
            port:
              number: 8080

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

configMap:
  enabled: false

externalSecret:
  enabled: true
  refreshInterval: "1h"
  secretStoreRef:
    name: gcp-store
    kind: ClusterSecretStore
  remoteRef:
    nameRegexp: "^goti-prod-queue-gate-"
    nameRewriteSource: "^goti-prod-queue-gate-(.*)$"

autoscaling:
  enabled: false

istioPolicy:
  authorizationPolicy:
    enabled: false
  destinationRule:
    enabled: true
  sidecar:
    enabled: true
    egress:
      - hosts:
          - "istio-system/*"
          - "./*"
          - "monitoring/*"
