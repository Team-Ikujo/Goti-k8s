nameOverride: goti-load-observer

replicaCount: 1

image:
  repository: "707925622666.dkr.ecr.ap-northeast-2.amazonaws.com/goti-load-observer"
  tag: "dev-6-7b42f0f"  # CD가 자동 업데이트
  pullPolicy: Always

imagePullSecrets:
  - name: ecr-creds

service:
  type: ClusterIP
  port: 9090
  name: metrics

serviceMonitor:
  enabled: true
  port: metrics
  interval: 30s
  path: /metrics
  release: kube-prometheus-stack-dev

probes:
  liveness:
    httpGet:
      path: /healthz
      port: metrics
    initialDelaySeconds: 5
    periodSeconds: 15
    failureThreshold: 3
  readiness:
    httpGet:
      path: /healthz
      port: metrics
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3

resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

env:
  - name: DB_DSN
    value: "postgresql://goti-db-server:KSn@BAcxoQla@172.20.0.1:5432/goti?sslmode=disable"
  - name: REDIS_ADDR
    value: "172.20.0.1:6379"
  - name: SERVER_PORT
    value: "9090"
  - name: POLL_INTERVAL_DB
    value: "60s"
  - name: POLL_INTERVAL_REDIS
    value: "30s"

podAnnotations:
  sidecar.istio.io/inject: "true"
  # dev: 호스트 PC DB/Redis는 Envoy 프록시 우회
  traffic.sidecar.istio.io/excludeOutboundPorts: "5432,6379"

gateway:
  enabled: false

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

configMap:
  enabled: false

externalSecret:
  enabled: false

istioPolicy:
  authorizationPolicy:
    enabled: false
  destinationRule:
    enabled: true
  sidecar:
    enabled: true
    egress:
      - hosts:
          - "istio-system/*"
          - "./*"
          - "monitoring/*"
