nameOverride: goti-load-observer

replicaCount: 1

image:
  repository: "707925622666.dkr.ecr.ap-northeast-2.amazonaws.com/goti-load-observer"
  tag: "dev-4-9abc823"  # CD가 자동 업데이트
  pullPolicy: Always

imagePullSecrets:
  - name: ecr-creds

service:
  type: ClusterIP
  port: 8080
  name: http

probes:
  liveness:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 15
    failureThreshold: 3
  readiness:
    httpGet:
      path: /ready
      port: http
    initialDelaySeconds: 15
    periodSeconds: 10
    failureThreshold: 3

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

env:
  - name: STADIUM_URL
    value: "http://goti-stadium-dev.goti.svc:8080"
  - name: TICKETING_URL
    value: "http://goti-ticketing-dev.goti.svc:8080"
  - name: USER_URL
    value: "http://goti-user-dev.goti.svc:8080"
  - name: POLL_INTERVAL
    value: "10s"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "alloy-dev.monitoring.svc:4317"
  - name: OTEL_SERVICE_NAME
    value: "goti-load-observer"
  - name: OTEL_SERVICE_NAMESPACE
    value: "goti"
  - name: SERVER_PORT
    value: "8080"

podAnnotations:
  # goti namespace 내부 서비스 직접 호출 — Envoy 프록시 우회 불필요
  sidecar.istio.io/inject: "true"

gateway:
  enabled: false  # 내부 서비스 (외부 노출 불필요)

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532  # distroless nonroot UID
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

configMap:
  enabled: false

externalSecret:
  enabled: false

istioPolicy:
  authorizationPolicy:
    enabled: false
  destinationRule:
    enabled: true
  sidecar:
    enabled: true
    egress:
      - hosts:
          - "istio-system/*"
          - "./*"
          - "monitoring/*"
