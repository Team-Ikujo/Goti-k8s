nameOverride: goti-queue

replicaCount: 1

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

image:
  repository: "707925622666.dkr.ecr.ap-northeast-2.amazonaws.com/goti-queue"
  tag: "dev-77-93771f5"
  pullPolicy: Always

imagePullSecrets:
  - name: ecr-creds

podAnnotations:
  instrumentation.opentelemetry.io/inject-java: "goti/goti-java"
  traffic.sidecar.istio.io/excludeOutboundPorts: "5432,6379"

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

gateway:
  enabled: true
  hosts:
    - "dev.go-ti.shop"
    - "api.go-ti.shop"
    - "dev-api.go-ti.shop"
  gatewayRef: "istio-system/goti-shared-gateway"
  httpRoutes:
    - match:
        - uri:
            prefix: "/api/v1/queue"
      timeout: 10s
      retries:
        attempts: 2
        perTryTimeout: 5s
        retryOn: 5xx,reset,connect-failure
      route:
        - destination:
            host: goti-queue-dev
            port:
              number: 8080
    - match:
        - uri:
            prefix: "/api/KIA/v1/queue"
        - uri:
            prefix: "/api/SS/v1/queue"
      rewrite:
        uri: "/api/v1/queue"
      timeout: 10s
      retries:
        attempts: 2
        perTryTimeout: 5s
        retryOn: 5xx,reset,connect-failure
      route:
        - destination:
            host: goti-queue-dev
            port:
              number: 8080
    - match:
        - uri:
            prefix: "/api/docs/queue/swagger-ui/"
      rewrite:
        uri: "/swagger-ui/"
      route:
        - destination:
            host: goti-queue-dev
            port:
              number: 8080
    - match:
        - uri:
            prefix: "/api/docs/queue/v3/"
      rewrite:
        uri: "/v3/"
      route:
        - destination:
            host: goti-queue-dev
            port:
              number: 8080

probes:
  liveness:
    httpGet:
      path: /actuator/health/liveness
      port: http
    initialDelaySeconds: 60
    periodSeconds: 10
  readiness:
    httpGet:
      path: /actuator/health/readiness
      port: http
    initialDelaySeconds: 30
    periodSeconds: 5

serviceMonitor:
  enabled: true
  port: http
  path: "/actuator/prometheus"
  interval: "15s"

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "dev"
  - name: JAVA_TOOL_OPTIONS
    value: "-Xms256m -Xmx512m -XX:+UseG1GC -XX:+UseContainerSupport"
  - name: GOTI_MESH_ENABLED
    value: "true"
  # dev 전용: 대기열 데이터 정리 내부 API 활성화 (prod 활성화 금지)
  - name: QUEUE_CLEANUP_API_ENABLED
    value: "true"
  - name: SPRINGDOC_SWAGGER_UI_CONFIG_URL
    value: "/api/docs/queue/v3/api-docs/swagger-config"
  - name: SPRINGDOC_SWAGGER_UI_URL
    value: "/api/docs/queue/v3/api-docs"

envFrom:
  - secretRef:
      name: goti-queue-dev-secrets

externalSecret:
  enabled: true
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  remoteRef:
    path: /dev/server
    overridePath: /dev/kind/server
  additionalPaths:
    - path: /dev/queue
    - path: /dev/kind/queue

# --- Istio 보안/네트워크 정책 ---

istioPolicy:
  authorizationPolicy:
    enabled: true
    allowFrom: []

  requestAuthentication:
    enabled: true
    jwksUri: "http://goti-user-dev.goti.svc.cluster.local:8080/.well-known/jwks.json"

  jwtAuthorizationPolicy:
    enabled: true
    excludePaths:
      - "*/global-status"
      - "/actuator"
      - "/actuator/*"
      - "/swagger-ui"
      - "/swagger-ui/*"
      - "/v3/api-docs"
      - "/v3/api-docs/*"

  destinationRule:
    enabled: true

  sidecar:
    enabled: true
    egress:
      - hosts:
          - "istio-system/*"
          - "./*"
          - "monitoring/*"
          - "~/*.amazonaws.com"
