nameOverride: goti-guardrail

replicaCount: 1

image:
  repository: "707925622666.dkr.ecr.ap-northeast-2.amazonaws.com/goti-guardrail"
  tag: "latest"  # TODO: CI/CD 구축 후 실제 태그로 교체
  pullPolicy: Always

imagePullSecrets:
  - name: ecr-creds

podAnnotations:
  # dev only: 호스트 PC Redis는 Envoy 프록시 우회
  traffic.sidecar.istio.io/excludeOutboundPorts: "6379"

service:
  type: ClusterIP
  port: 8000
  name: http

probes:
  liveness:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    httpGet:
      path: /health/ready
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 3

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

env:
  - name: GUARDRAIL_REDIS_URL
    value: "redis://host.docker.internal:6379/1"  # dev: 호스트 PC Redis, DB 1번

gateway:
  enabled: false  # Guardrail은 Istio ExtAuthz로 연동 (VirtualService 불필요)

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: false
  minAvailable: 1

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

configMap:
  enabled: false

externalSecret:
  enabled: false

# --- Istio 보안/네트워크 정책 ---
istioPolicy:
  authorizationPolicy:
    enabled: false  # ExtAuthz로 사용되므로 별도 설정 불필요
  destinationRule:
    enabled: true
  sidecar:
    enabled: true
    egress:
      - hosts:
          - "istio-system/*"
          - "./*"
          - "monitoring/*"
