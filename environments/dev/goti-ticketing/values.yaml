serviceMonitor:
  enabled: true
  port: http
  path: "/actuator/prometheus"
  interval: "15s"

probes:
  liveness:
    httpGet:
      path: /actuator/health/liveness
      port: http
    initialDelaySeconds: 60
    periodSeconds: 10
  readiness:
    httpGet:
      path: /actuator/health/readiness
      port: http
    initialDelaySeconds: 30
    periodSeconds: 5

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "dev"
  - name: JAVA_TOOL_OPTIONS
    value: "-Xms256m -Xmx512m -XX:+UseG1GC -XX:+UseContainerSupport"
  - name: GOTI_MESH_ENABLED
    value: "true"
  - name: STADIUM_API_URL
    value: "http://goti-stadium-dev.goti.svc.cluster.local:8080"
  - name: RESALE_BASE_URL
    value: "http://goti-resale-dev.goti.svc.cluster.local:8080"
  - name: PAYMENT_BASE_URL
    value: "http://goti-payment-dev.goti.svc.cluster.local:8080"
  - name: SPRINGDOC_SWAGGER_UI_CONFIG_URL
    value: "/api/docs/ticketing/v3/api-docs/swagger-config"
  - name: SPRINGDOC_SWAGGER_UI_URL
    value: "/api/docs/ticketing/v3/api-docs"

envFrom:
  - secretRef:
      name: goti-ticketing-dev-secrets

externalSecret:
  enabled: true
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  remoteRef:
    path: /dev/server  # TODO: 서비스별 경로 분리 예정 (/dev/ticketing 등)
    overridePath: /dev/kind/server

# --- Istio 보안/네트워크 정책 ---

istioPolicy:
  # Phase 1: payment → ticketing (결제 확인 콜백), resale → ticketing (내부 연동)
  authorizationPolicy:
    enabled: true
    allowFrom:
      - name: from-payment
        rules:
          - from:
              - source:
                  principals: ["cluster.local/ns/goti/sa/goti-payment-dev"]
            to:
              - operation:
                  paths: ["/api/v1/orders/*"]  # prefix match: 모든 /api/v1/orders/ 하위 경로 포함
                  methods: ["GET", "POST"]
      - name: from-resale
        rules:
          - from:
              - source:
                  principals: ["cluster.local/ns/goti/sa/goti-resale-dev"]
            to:
              - operation:
                  paths: ["/api/v1/tickets/resales/*"]
                  methods: ["GET", "PATCH", "POST"]

  # JWT 검증: issuer/outputClaimToHeaders는 base values 상속
  requestAuthentication:
    enabled: true
    jwksUri: "http://goti-user-dev.goti.svc.cluster.local:8080/.well-known/jwks.json"

  # JWT 필수 강제: 공개 API 외 경로에 JWT 없으면 403
  jwtAuthorizationPolicy:
    enabled: true
    excludePaths:
      - "/api/v1/games"
      - "/api/v1/games/*"
      - "/api/v1/stadiums"
      - "/api/v1/stadiums/*"
      - "/api/v1/stadium-seats"
      - "/api/v1/stadium-seats/*"
      - "/api/v1/teams"
      - "/api/v1/teams/*"
      - "/api/v1/orders/internal"    # 내부용: payment → ticketing (주문 조회)
      - "*/payment-order"          # 내부용: payment → ticketing (mTLS principal로 보호, suffix match)
      - "*/payment-confirmations"  # 내부용: payment → ticketing (결제 확인 콜백, suffix match)
      - "/api/v1/tickets/purchase-infos"  # 내부용: resale → ticketing
      - "/api/v1/tickets/resales/*"       # 내부용: resale → ticketing
      - "/actuator"
      - "/actuator/*"
      - "/swagger-ui"
      - "/swagger-ui/*"
      - "/v3/api-docs"
      - "/v3/api-docs/*"

  # Phase 2: Resilience (공통 설정은 goti-server/values.yaml 기본값 사용)
  destinationRule:
    enabled: true

  # Phase 2: Sidecar egress 제한
  sidecar:
    enabled: true
    egress:
      - hosts:
          - "istio-system/*"
          - "./*"
          - "monitoring/*"
          - "kafka/*"
          - "~/*.amazonaws.com"
