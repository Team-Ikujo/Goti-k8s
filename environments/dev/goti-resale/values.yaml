nameOverride: goti-resale

image:
  repository: "707925622666.dkr.ecr.ap-northeast-2.amazonaws.com/goti-resale"
  tag: "dev-f1c1d61"
  pullPolicy: Always

imagePullSecrets:
  - name: ecr-creds

podAnnotations:
  instrumentation.opentelemetry.io/inject-java: "goti/goti-java"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

gateway:
  enabled: true
  hosts:
    - "dev.go-ti.shop"
  gatewayRef: "istio-system/goti-shared-gateway"
  httpRoutes:
    - match:
        - uri:
            prefix: "/api/v1/resale/"
      route:
        - destination:
            host: goti-resale-dev
            port:
              number: 8080
    - match:
        - uri:
            prefix: "/resale/swagger-ui/"
      rewrite:
        uri: "/swagger-ui/"
      route:
        - destination:
            host: goti-resale-dev
            port:
              number: 8080
    - match:
        - uri:
            prefix: "/resale/v3/"
      rewrite:
        uri: "/v3/"
      route:
        - destination:
            host: goti-resale-dev
            port:
              number: 8080

probes:
  liveness:
    httpGet:
      path: /actuator/health/liveness
      port: http
    initialDelaySeconds: 60
    periodSeconds: 10
  readiness:
    httpGet:
      path: /actuator/health/readiness
      port: http
    initialDelaySeconds: 30
    periodSeconds: 5

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "dev"
  - name: JAVA_TOOL_OPTIONS
    value: "-XX:MaxRAMPercentage=60.0"

envFrom:
  - secretRef:
      name: goti-resale-dev-secrets

externalSecret:
  enabled: true
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  remoteRef:
    path: /dev/server  # TODO: 서비스별 경로 분리 예정 (/dev/resale 등)
    overridePath: /dev/kind/server
