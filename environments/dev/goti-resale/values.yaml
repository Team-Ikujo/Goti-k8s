nameOverride: goti-resale

replicaCount: 1

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

image:
  repository: "707925622666.dkr.ecr.ap-northeast-2.amazonaws.com/goti-resale"
  tag: "dev-64-03f59dc"
  pullPolicy: Always

imagePullSecrets:
  - name: ecr-creds

podAnnotations:
  instrumentation.opentelemetry.io/inject-java: "goti/goti-java"
  traffic.sidecar.istio.io/excludeOutboundPorts: "5432,6379"

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

gateway:
  enabled: true
  hosts:
    - "dev.go-ti.shop"
    - "api.go-ti.shop"
    - "dev-api.go-ti.shop"
  gatewayRef: "istio-system/goti-shared-gateway"
  httpRoutes:
    - match:
        - uri:
            prefix: "/api/v1/resales"
      timeout: 10s
      retries:
        attempts: 2
        perTryTimeout: 3s
        retryOn: 5xx,reset,connect-failure
      route:
        - destination:
            host: goti-resale-dev
            port:
              number: 8080
    - match:
        - uri:
            prefix: "/api/docs/resale/swagger-ui/"
      rewrite:
        uri: "/swagger-ui/"
      route:
        - destination:
            host: goti-resale-dev
            port:
              number: 8080
    - match:
        - uri:
            prefix: "/api/docs/resale/v3/"
      rewrite:
        uri: "/v3/"
      route:
        - destination:
            host: goti-resale-dev
            port:
              number: 8080

serviceMonitor:
  enabled: true
  port: http
  path: "/actuator/prometheus"
  interval: "15s"

probes:
  liveness:
    httpGet:
      path: /actuator/health/liveness
      port: http
    initialDelaySeconds: 60
    periodSeconds: 10
  readiness:
    httpGet:
      path: /actuator/health/readiness
      port: http
    initialDelaySeconds: 30
    periodSeconds: 5

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "dev"
  - name: JAVA_TOOL_OPTIONS
    value: "-Xms256m -Xmx512m -XX:+UseG1GC -XX:+UseContainerSupport"
  - name: GOTI_MESH_ENABLED
    value: "true"
  - name: SPRINGDOC_SWAGGER_UI_CONFIG_URL
    value: "/api/docs/resale/v3/api-docs/swagger-config"
  - name: SPRINGDOC_SWAGGER_UI_URL
    value: "/api/docs/resale/v3/api-docs"

envFrom:
  - secretRef:
      name: goti-resale-dev-secrets

externalSecret:
  enabled: true
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  remoteRef:
    path: /dev/server  # TODO: 서비스별 경로 분리 예정 (/dev/resale 등)
    overridePath: /dev/kind/server

# --- Istio 보안/네트워크 정책 ---

istioPolicy:
  # Phase 1: payment → resale (양도 완료/거래 조회)
  authorizationPolicy:
    enabled: true
    allowFrom:
      - name: from-payment
        rules:
          - from:
              - source:
                  principals: ["cluster.local/ns/goti/sa/goti-payment-dev"]
            to:
              - operation:
                  paths: ["/api/v1/resales/orders/*"]
                  methods: ["GET", "PATCH"]

  # JWT 검증: issuer/outputClaimToHeaders는 base values 상속
  requestAuthentication:
    enabled: true
    jwksUri: "http://goti-user-dev.goti.svc.cluster.local:8080/.well-known/jwks.json"

  # JWT 필수 강제: histories는 공개, 나머지는 인증 필수
  jwtAuthorizationPolicy:
    enabled: true
    excludePaths:
      - "/api/v1/resales/histories"
      - "/api/v1/resales/histories/*"
      - "/actuator"
      - "/actuator/*"
      - "/swagger-ui"
      - "/swagger-ui/*"
      - "/v3/api-docs"
      - "/v3/api-docs/*"

  # Phase 2: Resilience (공통 설정은 goti-server/values.yaml 기본값 사용)
  destinationRule:
    enabled: true

  # Phase 2: Sidecar egress 제한
  sidecar:
    enabled: true
    egress:
      - hosts:
          - "istio-system/*"
          - "./*"
          - "monitoring/*"
          - "kafka/*"
          - "~/*.amazonaws.com"
