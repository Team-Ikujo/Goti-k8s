# ============================================================================
# [POC] 준상 대기열 전용 Payment 서비스 (기존 이미지 재사용)
# ============================================================================
# 목적: payment → ticketing 내부 통신을 ticketing-junsang으로 연결
# 특징: 기존 goti-payment 이미지 그대로, TICKETING_BASE_URL만 변경
# 라우팅: /junsang/api/v1/payments/** → rewrite → /api/v1/payments/**
# 삭제 시점: 최종 구현체 결정 후 이 파일 + AppSet element 삭제
# ============================================================================

nameOverride: goti-payment-junsang

replicaCount: 1

autoscaling:
  enabled: false

image:
  repository: "707925622666.dkr.ecr.ap-northeast-2.amazonaws.com/goti-payment"
  tag: "dev-44-3737148"  # 기존 payment 이미지 그대로 사용
  pullPolicy: Always

imagePullSecrets:
  - name: ecr-creds

podAnnotations:
  instrumentation.opentelemetry.io/inject-java: "goti/goti-java"
  traffic.sidecar.istio.io/excludeOutboundPorts: "5432,6379"

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

gateway:
  enabled: true
  hosts:
    - "dev.go-ti.shop"
    - "api.go-ti.shop"
    - "dev-api.go-ti.shop"
  gatewayRef: "istio-system/goti-shared-gateway"
  httpRoutes:
    - match:
        - uri:
            prefix: "/junsang/api/v1/payments"
      rewrite:
        uri: "/api/v1/payments"
      timeout: 15s
      retries:
        attempts: 2
        perTryTimeout: 5s
        retryOn: 5xx,reset,connect-failure
      route:
        - destination:
            host: goti-payment-junsang-dev
            port:
              number: 8080

probes:
  liveness:
    httpGet:
      path: /actuator/health/liveness
      port: http
    initialDelaySeconds: 60
    periodSeconds: 10
  readiness:
    httpGet:
      path: /actuator/health/readiness
      port: http
    initialDelaySeconds: 30
    periodSeconds: 5

serviceMonitor:
  enabled: false

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "dev"
  - name: JAVA_TOOL_OPTIONS
    value: "-Xms256m -Xmx512m -XX:+UseG1GC -XX:+UseContainerSupport"
  - name: GOTI_MESH_ENABLED
    value: "true"
  # [POC] 핵심: ticketing-junsang pod으로 내부 통신
  - name: TICKETING_BASE_URL
    value: "http://goti-ticketing-junsang-dev.goti.svc.cluster.local:8080"

envFrom:
  - secretRef:
      name: goti-payment-junsang-dev-secrets

externalSecret:
  enabled: true
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  remoteRef:
    path: /dev/server
    overridePath: /dev/kind/server

istioPolicy:
  authorizationPolicy:
    enabled: false  # POC: 서비스간 통신 제한 불필요
  requestAuthentication:
    enabled: true
    jwksUri: "http://goti-user-dev.goti.svc.cluster.local:8080/.well-known/jwks.json"
  jwtAuthorizationPolicy:
    enabled: true
    excludePaths:
      - "/actuator/*"
  destinationRule:
    enabled: true
  sidecar:
    enabled: true
    egress:
      - hosts:
          - "istio-system/*"
          - "./*"
          - "monitoring/*"
