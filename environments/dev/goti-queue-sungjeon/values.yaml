# ============================================================================
# [POC] 대기열 구현 방식2 — 성전 (PR #311: poc/queue-waiting-sungjeon)
# ============================================================================
# 목적: 대기열 구현체 비교 부하테스트용 임시 배포
# 특징: resale_service 스키마, Redis key expiration listener, 자체 토큰 암호화
# 삭제 시점: 최종 구현체 결정 후 이 파일 + AppSet element + ECR 이미지 삭제
# 관련 PR: https://github.com/Team-Ikujo/Goti-server/pull/311
# ============================================================================

nameOverride: goti-queue-sungjeon

replicaCount: 1

# POC이므로 오토스케일링 비활성화 — 고정 리소스로 공정한 비교
autoscaling:
  enabled: false

image:
  repository: "707925622666.dkr.ecr.ap-northeast-2.amazonaws.com/goti-queue"
  tag: "poc-sungjeon-2-5c79616"
  pullPolicy: Always

imagePullSecrets:
  - name: ecr-creds

podAnnotations:
  instrumentation.opentelemetry.io/inject-java: "goti/goti-java"
  # dev only: 호스트 PC DB/Redis는 Envoy 프록시 우회
  traffic.sidecar.istio.io/excludeOutboundPorts: "5432,6379"

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

# [POC] 외부 부하테스트 접근을 위한 라우팅
# /api/v1/queue/sungjeon/** → rewrite → /api/v1/queues/** → 이 서비스
# 성전 구현체는 /api/v1/queues (복수형) base path 사용
# 최종 결정 후 이 파일 전체 삭제
gateway:
  enabled: true
  hosts:
    - "dev.go-ti.shop"
    - "api.go-ti.shop"
    - "dev-api.go-ti.shop"
  gatewayRef: "istio-system/goti-shared-gateway"
  httpRoutes:
    - match:
        - uri:
            prefix: "/api/v1/queue/sungjeon"
      rewrite:
        uri: "/api/v1/queues"
      timeout: 10s
      retries:
        attempts: 2
        perTryTimeout: 5s
        retryOn: 5xx,reset,connect-failure
      route:
        - destination:
            host: goti-queue-sungjeon-dev
            port:
              number: 8080

probes:
  liveness:
    httpGet:
      path: /actuator/health/liveness
      port: 9090
    initialDelaySeconds: 60
    periodSeconds: 10
  readiness:
    httpGet:
      path: /actuator/health/readiness
      port: 9090
    initialDelaySeconds: 30
    periodSeconds: 5

service:
  type: ClusterIP
  port: 8080
  name: http
  additionalPorts:
    - name: management
      port: 9090
      targetPort: 9090

serviceMonitor:
  enabled: true
  port: management
  path: "/actuator/prometheus"
  interval: "15s"

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "dev"
  - name: JAVA_TOOL_OPTIONS
    value: "-Xms256m -Xmx512m -XX:+UseG1GC -XX:+UseContainerSupport"
  # --- DB: 호스트 PC PostgreSQL ---
  # 성전 구현체는 resale_service 스키마를 사용 (application.yml 하드코딩)
  - name: DATASOURCE_URL
    value: "jdbc:postgresql://172.20.0.1:5432/goti"
  - name: DATASOURCE_USERNAME
    value: "goti-db-server"
  # --- Redis: 호스트 PC ---
  - name: REDIS_HOST
    value: "172.20.0.1"
  # [POC] Redis DB 격리 — 수연=DB0, 준상=DB1, 성전=DB2
  - name: SPRING_DATA_REDIS_DATABASE
    value: "2"
  # Istio mesh 인증: X-User-Id/X-User-Role 헤더 → Spring SecurityContext 변환
  - name: GOTI_MESH_ENABLED
    value: "true"
  # --- Queue 토큰 시크릿 ---
  # 성전 구현체는 자체 TokenEncryptor 사용 (env: QUEUE_TOKEN_SECRET_KEY)
  - name: QUEUE_TOKEN_SECRET_KEY
    value: "goti-queue-secret-key-1234567890"

envFrom:
  - secretRef:
      name: goti-queue-sungjeon-dev-secrets

# 성전 구현체에 필요한 시크릿: DATASOURCE_PASSWORD
externalSecret:
  enabled: true
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  remoteRef:
    path: /dev/server
    overridePath: /dev/kind/server

# --- Istio: JWT 인증 활성화 ---
istioPolicy:
  authorizationPolicy:
    enabled: false  # POC: 서비스간 통신 제한 불필요
  requestAuthentication:
    enabled: true
    jwksUri: "http://goti-user-dev.goti.svc.cluster.local:8080/.well-known/jwks.json"
  jwtAuthorizationPolicy:
    enabled: true
    excludePaths: []
  destinationRule:
    enabled: true
  sidecar:
    enabled: true
    egress:
      - hosts:
          - "istio-system/*"
          - "./*"
          - "monitoring/*"
