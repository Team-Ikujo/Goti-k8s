nameOverride: goti-user

replicaCount: 1

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

image:
  repository: "707925622666.dkr.ecr.ap-northeast-2.amazonaws.com/goti-user"
  tag: "dev-58-e8b3d70"
  pullPolicy: Always

imagePullSecrets:
  - name: ecr-creds

podAnnotations:
  instrumentation.opentelemetry.io/inject-java: "goti/goti-java"
  # dev only: 호스트 PC DB/Redis는 Envoy 프록시 우회
  traffic.sidecar.istio.io/excludeOutboundPorts: "5432,6379"

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

gateway:
  enabled: true
  hosts:
    - "dev.go-ti.shop"
    - "api.go-ti.shop"
    - "dev-api.go-ti.shop"
  gatewayRef: "istio-system/goti-shared-gateway"
  httpRoutes:
    - match:
        - uri:
            prefix: "/api/v1/auth"
        - uri:
            prefix: "/api/v1/test"
      timeout: 5s
      retries:
        attempts: 2
        perTryTimeout: 2s
        retryOn: 5xx,reset,connect-failure
      route:
        - destination:
            host: goti-user-dev
            port:
              number: 8080
    - match:
        - uri:
            prefix: "/api/docs/user/swagger-ui/"
      rewrite:
        uri: "/swagger-ui/"
      route:
        - destination:
            host: goti-user-dev
            port:
              number: 8080
    - match:
        - uri:
            prefix: "/api/docs/user/v3/"
      rewrite:
        uri: "/v3/"
      route:
        - destination:
            host: goti-user-dev
            port:
              number: 8080

serviceMonitor:
  enabled: true
  port: http
  path: "/actuator/prometheus"
  interval: "15s"

probes:
  liveness:
    httpGet:
      path: /actuator/health/liveness
      port: http
    initialDelaySeconds: 60
    periodSeconds: 10
  readiness:
    httpGet:
      path: /actuator/health/readiness
      port: http
    initialDelaySeconds: 30
    periodSeconds: 5

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "dev"
  - name: JAVA_TOOL_OPTIONS
    value: "-Xms256m -Xmx512m -XX:+UseG1GC -XX:+UseContainerSupport"
  - name: SPRINGDOC_SWAGGER_UI_CONFIG_URL
    value: "/api/docs/user/v3/api-docs/swagger-config"
  - name: SPRINGDOC_SWAGGER_UI_URL
    value: "/api/docs/user/v3/api-docs"

envFrom:
  - secretRef:
      name: goti-user-dev-secrets

externalSecret:
  enabled: true
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  remoteRef:
    path: /dev/server  # 공통 (DB, Redis, JWT_RSA_PUBLIC_KEY 등)
    overridePath: /dev/kind/server
  # 동일 key는 마지막 path 값으로 덮어씀 (Kind override용)
  additionalPaths:
    - path: /dev/user       # user 전용 (JWT_RSA_PRIVATE_KEY)
    - path: /dev/kind/user  # Kind 환경 override

# --- Istio 보안/네트워크 정책 ---

istioPolicy:
  # Phase 1: user 서비스는 다른 서비스로부터 호출받지 않음 (Gateway 통해서만 접근)
  authorizationPolicy:
    enabled: true
    allowFrom: []

  # JWT 검증: issuer/outputClaimToHeaders는 base values 상속
  requestAuthentication:
    enabled: true
    jwksUri: "http://goti-user-dev.goti.svc.cluster.local:8080/.well-known/jwks.json"

  # 테스트 API IP 제한: 허용된 IP 외 /api/v1/test/* 차단
  testIpAllowlist:
    enabled: true
    allowedIps:
      - "221.152.162.218/32"
      # - "팀원B_IP/32"
      # - "팀원C_IP/32"
      # - "팀원D_IP/32"

  # JWT 필수 강제: 공개 API 외 경로에 JWT 없으면 403
  jwtAuthorizationPolicy:
    enabled: true
    excludePaths:
      - "/api/v1/auth"
      - "/api/v1/auth/*"
      - "/api/v1/test"
      - "/api/v1/test/*"
      - "/actuator"
      - "/actuator/*"
      - "/swagger-ui"
      - "/swagger-ui/*"
      - "/v3/api-docs"
      - "/v3/api-docs/*"
      - "/.well-known"
      - "/.well-known/*"

  # Phase 2: Resilience (공통 설정은 goti-server/values.yaml 기본값 사용)
  destinationRule:
    enabled: true

  # Phase 2: Sidecar egress 제한
  sidecar:
    enabled: true
    egress:
      - hosts:
          - "istio-system/*"
          - "./*"
          - "monitoring/*"
          - "kafka/*"
          # OAuth 소셜 로그인 (Google, Naver, Kakao)
          - "~/*.googleapis.com"
          - "~/*.naver.com"
          - "~/*.kakao.com"
          # SMS 발송 (Nurigo/CoolSMS)
          - "~/*.nurigo.com"
          # AWS (SSM Parameter Store, STS)
          - "~/*.amazonaws.com"
