replicaCount: 1

image:
  repository: goti-server
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

service:
  type: ClusterIP
  port: 8080
  name: http

gateway:
  enabled: false
  hosts:
    - "goti.local"
  gatewayRef: ""
  matchPrefixes: []
  httpRoutes: []

probes:
  liveness:
    httpGet:
      path: /actuator/health/liveness
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    httpGet:
      path: /actuator/health/readiness
      port: http
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 3

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: false
  minAvailable: 1

env: []
envFrom: []

configMap:
  enabled: false
  data: {}

externalSecret:
  enabled: false
  refreshInterval: "1h"
  secretStoreRef:
    name: ""
    kind: ClusterSecretStore
  remoteRef:
    path: ""
  additionalPaths: []  # 추가 Parameter Store 경로 (서비스별 시크릿 분리용)

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

extraVolumeMounts: []
extraVolumes: []

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Istio 보안/네트워크 정책
istioPolicy:
  # Phase 1: 서비스별 AuthorizationPolicy (서비스 간 통신 허용)
  authorizationPolicy:
    enabled: false
    allowFrom: []
  # Phase 2: DestinationRule (circuit breaker, connection pool)
  destinationRule:
    enabled: false
    connectionPool:
      tcp:
        maxConnections: 100
        connectTimeout: 5s
      http:
        maxRequestsPerConnection: 100
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
    loadBalancer:
      simple: LEAST_REQUEST
  # JWT 검증: Istio RequestAuthentication (기본 비활성화)
  requestAuthentication:
    enabled: false
    issuer: "goti-user-service"
    jwksUri: ""
    forwardOriginalToken: true
    outputClaimToHeaders:
      - header: "X-User-Id"
        claim: "sub"
      - header: "X-User-Role"
        claim: "role"
  # JWT 필수 강제: 공개 API 외 경로에 JWT 없으면 403 (기본 비활성화)
  jwtAuthorizationPolicy:
    enabled: false
    excludePaths: []
  # Phase 2: Sidecar (egress 제한, 기본 비활성화)
  sidecar:
    enabled: false
    egress: []
