replicaCount: 1

image:
  repository: goti-server
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

service:
  type: ClusterIP
  port: 8080
  name: http

gateway:
  enabled: false
  hosts:
    - "goti.local"
  gatewayRef: ""
  matchPrefixes: []
  httpRoutes: []

probes:
  liveness:
    httpGet:
      path: /actuator/health/liveness
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    httpGet:
      path: /actuator/health/readiness
      port: http
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 3

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: false
  minAvailable: 1

env: []
envFrom: []

configMap:
  enabled: false
  data: {}

externalSecret:
  enabled: false
  refreshInterval: "1h"
  secretStoreRef:
    name: ""
    kind: ClusterSecretStore
  remoteRef:
    path: ""
  additionalPaths: []  # 추가 Parameter Store 경로 (서비스별 시크릿 분리용)

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

extraVolumeMounts: []
extraVolumes: []

persistence:
  enabled: false
  storageClassName: "gp3"
  size: "5Gi"

podAnnotations: {}
nodeSelector: {}
# GKE spot 풀(taint: node-role=spot) 사용 허용. AWS EKS 등 taint 없는 환경에서는 무해.
tolerations:
  - key: node-role
    operator: Equal
    value: spot
    effect: NoSchedule
# spot 노드 우선 스케줄, 없으면 core로 fallback. GCP 전용 label이지만 AWS에서는 조건 미매치로 무시됨.
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: cloud.google.com/gke-spot
              operator: In
              values: ["true"]

# Istio 보안/네트워크 정책
istioPolicy:
  # Phase 1: 서비스별 AuthorizationPolicy (서비스 간 통신 허용)
  authorizationPolicy:
    enabled: false
    allowFrom: []
  # Phase 2: DestinationRule (circuit breaker, connection pool)
  # 2026-04-14 부하테스트 튜닝:
  #   - maxConnections 100 → 500: 1000 VU × 6~10 pod 기준 pod당 ~100~166 concurrent 수용
  #   - maxRequestsPerConnection 100 → 1000: 장기 load 중 잦은 재연결/TLS handshake 증가 방지
  #   - consecutive5xxErrors 5 → 20: context canceled 기반 500 (서버 책임 아님) 에 의한 억울한 ejection 완화
  #   - baseEjectionTime 30s → 15s: ejection 걸려도 빠른 복귀
  #   - maxEjectionPercent 50 → 33: 다수 이젝트 시 남은 pod 과부하 방지
  destinationRule:
    enabled: false
    connectionPool:
      tcp:
        maxConnections: 500
        connectTimeout: 5s
      http:
        maxRequestsPerConnection: 1000
    outlierDetection:
      consecutive5xxErrors: 20
      interval: 30s
      baseEjectionTime: 15s
      maxEjectionPercent: 33
    loadBalancer:
      simple: LEAST_REQUEST
  # JWT 검증: Istio RequestAuthentication (기본 비활성화)
  requestAuthentication:
    enabled: false
    issuer: "goti-user-service"
    # JWKS 소스: jwks (인라인) 또는 jwksUri (동적 조회, STRICT mTLS 불가)
    # jwksFromSecret: non-ArgoCD 환경에서 Secret lookup 사용 시 설정
    #   name: ""         # 비워두면 {fullname}-secrets
    #   key: "ISTIO_JWKS"
    jwksUri: ""
    forwardOriginalToken: true
    outputClaimToHeaders:
      - header: "X-User-Id"
        claim: "sub"
      - header: "X-User-Role"
        claim: "role"
  # JWT 필수 강제: 공개 API 외 경로에 JWT 없으면 403 (기본 비활성화)
  jwtAuthorizationPolicy:
    enabled: false
    excludePaths: []
  # Phase 2: Sidecar (egress 제한, 기본 비활성화)
  sidecar:
    enabled: false
    egress: []
