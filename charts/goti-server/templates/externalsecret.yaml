{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "goti-common.fullname" . }}-secrets
  labels:
    {{- include "goti-common.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ include "goti-common.fullname" . }}-secrets
    creationPolicy: Owner
  dataFrom:
    {{- if .Values.externalSecret.remoteRef.nameRegexp }}
    {{- /* GCP Secret Manager 모드: secret ID prefix regexp 사용 (path 계층 없음) */}}
    - find:
        name:
          regexp: "{{ .Values.externalSecret.remoteRef.nameRegexp }}"
      rewrite:
        - regexp:
            source: "{{ .Values.externalSecret.remoteRef.nameRewriteSource }}"
            target: "$1"
    {{- if .Values.externalSecret.remoteRef.overrideNameRegexp }}
    - find:
        name:
          regexp: "{{ .Values.externalSecret.remoteRef.overrideNameRegexp }}"
      rewrite:
        - regexp:
            source: "{{ .Values.externalSecret.remoteRef.overrideNameRewriteSource }}"
            target: "$1"
    {{- end }}
    {{- else }}
    {{- /* AWS SSM / 기본 모드: 경로 prefix 기반 find */}}
    - find:
        path: {{ .Values.externalSecret.remoteRef.path }}
        name:
          regexp: ".*"
      rewrite:
        - regexp:
            source: "^{{ .Values.externalSecret.remoteRef.path }}/(.*)$"
            target: "$1"
    {{- if .Values.externalSecret.remoteRef.overridePath }}
    - find:
        path: {{ .Values.externalSecret.remoteRef.overridePath }}
        name:
          regexp: ".*"
      rewrite:
        - regexp:
            source: "^{{ .Values.externalSecret.remoteRef.overridePath }}/(.*)$"
            target: "$1"
    {{- end }}
    {{- range .Values.externalSecret.additionalPaths }}
    - find:
        path: {{ .path }}
        name:
          regexp: ".*"
      rewrite:
        - regexp:
            source: "^{{ .path }}/(.*)$"
            target: "$1"
    {{- end }}
    {{- end }}
{{- end }}
