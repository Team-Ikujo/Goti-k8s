{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-synthetic-scripts
  labels:
    app: synthetic-traffic
    app.kubernetes.io/part-of: goti
data:
  synthetic-traffic.js: |
    import http from 'k6/http';
    import { check, sleep } from 'k6';
    import { Rate, Trend, Counter } from 'k6/metrics';

    var apiSuccessRate = new Rate('synthetic_api_success_rate');
    var apiDuration = new Trend('synthetic_api_duration', true);
    var apiCalls = new Counter('synthetic_api_calls');

    export var options = {
      scenarios: {
        synthetic: {
          executor: 'constant-vus',
          vus: parseInt(__ENV.K6_VUS || '3'),
          duration: __ENV.K6_DURATION || '4m',
        },
      },
      thresholds: {
        synthetic_api_success_rate: ['rate>0.95'],
        synthetic_api_duration: ['p(95)<2000'],
      },
      noConnectionReuse: false,
    };

    var SVC = {
      ticketing: __ENV.SVC_TICKETING,
      user:      __ENV.SVC_USER,
      stadium:   __ENV.SVC_STADIUM,
      payment:   __ENV.SVC_PAYMENT,
      resale:    __ENV.SVC_RESALE,
    };

    function apiGet(baseUrl, path, authToken) {
      var url = baseUrl + path;
      var headers = { 'Content-Type': 'application/json' };
      if (authToken) { headers['Authorization'] = 'Bearer ' + authToken; }
      var res = http.get(url, { headers: headers });
      apiCalls.add(1);
      apiDuration.add(res.timings.duration);
      apiSuccessRate.add(res.status >= 200 && res.status < 400);
      if (res.status >= 400) { console.warn('GET ' + path + ' -> ' + res.status); }
      return res;
    }

    function apiPost(baseUrl, path, body, authToken) {
      var url = baseUrl + path;
      var headers = { 'Content-Type': 'application/json' };
      if (authToken) { headers['Authorization'] = 'Bearer ' + authToken; }
      var payload = typeof body === 'string' ? body : JSON.stringify(body);
      var res = http.post(url, payload, { headers: headers });
      apiCalls.add(1);
      apiDuration.add(res.timings.duration);
      apiSuccessRate.add(res.status >= 200 && res.status < 400);
      if (res.status >= 400) { console.warn('POST ' + path + ' -> ' + res.status); }
      return res;
    }

    function extractData(res) {
      if (res.status !== 200) return null;
      try { var body = JSON.parse(res.body); return body.data || body; }
      catch (e) { return null; }
    }

    export function setup() {
      var signupRes = apiPost(SVC.user, '/api/v1/test/users', {
        name: 'K6-Synthetic', mobile: '00099990001', gender: 'MALE', birthDate: '1990-01-01',
      });
      var signupData = extractData(signupRes);
      if (!signupData || !signupData.accessToken) {
        console.error('setup: 유저 생성 실패 (status=' + (signupRes ? signupRes.status : 'null') + ')');
        return null;
      }
      var token = signupData.accessToken;

      var gamesRes = apiGet(SVC.ticketing, '/api/v1/games/schedules?today=false', token);
      var games = extractData(gamesRes);
      if (!Array.isArray(games) || games.length === 0) {
        console.error('setup: 경기 일정 없음');
        return null;
      }

      var game = null;
      for (var i = 0; i < games.length; i++) {
        if (games[i].ticketingStatus === 'AVAILABLE') { game = games[i]; break; }
      }
      if (!game) game = games[0];

      var gameId = String(game.gameId);
      var stadiumId = String(game.stadiumId);
      var homeTeamId = String(game.homeTeamId);

      var sectionsRes = apiGet(SVC.ticketing, '/api/v1/stadium-seats/stadiums/' + stadiumId + '/seat-sections', token);
      var sections = extractData(sectionsRes);
      var sectionIds = [];
      if (Array.isArray(sections)) {
        for (var j = 0; j < sections.length; j++) { sectionIds.push(String(sections[j].sectionId)); }
      }

      var teamSet = {};
      var teamIds = [];
      var limit = Math.min(games.length, 10);
      for (var k = 0; k < limit; k++) {
        var g = games[k];
        if (g.homeTeamId && !teamSet[g.homeTeamId]) { teamSet[g.homeTeamId] = true; teamIds.push(String(g.homeTeamId)); }
        if (g.awayTeamId && !teamSet[g.awayTeamId]) { teamSet[g.awayTeamId] = true; teamIds.push(String(g.awayTeamId)); }
        if (teamIds.length >= 5) break;
      }

      // 주문/티켓 ID 수집 (마이페이지 시나리오용)
      var orderId = null;
      var ticketId = null;
      var ordersRes = apiGet(SVC.ticketing, '/api/v1/orders', token);
      var orders = extractData(ordersRes);
      if (Array.isArray(orders) && orders.length > 0) {
        orderId = String(orders[0].orderId);
        if (orders[0].ticketId) { ticketId = String(orders[0].ticketId); }
      }

      console.log('setup: gameId=' + gameId + ', stadiumId=' + stadiumId + ', sections=' + sectionIds.length + ', teams=' + teamIds.length + ', orderId=' + orderId + ', ticketId=' + ticketId);
      return {
        token: token, gameId: gameId, stadiumId: stadiumId, homeTeamId: homeTeamId,
        sectionIds: sectionIds, teamIds: teamIds, orderId: orderId, ticketId: ticketId,
      };
    }

    // 쓰기: 좌석 HOLD (자연 만료로 데이터 소모 없음)
    function trySeatHold(testData, token) {
      if (testData.sectionIds.length === 0) return;
      var sid = testData.sectionIds[Math.floor(Math.random() * testData.sectionIds.length)];
      var statusRes = apiGet(SVC.ticketing, '/api/v1/game-seats/' + testData.gameId + '/sections/' + sid + '/seat-statuses', token);
      var seats = extractData(statusRes);
      if (!Array.isArray(seats)) return;
      var available = [];
      for (var i = 0; i < seats.length; i++) {
        if (seats[i].status === 'AVAILABLE') available.push(seats[i]);
      }
      if (available.length === 0) return;
      var seat = available[Math.floor(Math.random() * available.length)];
      var queueJti = 'synthetic-' + __VU + '-' + Date.now();
      apiPost(SVC.ticketing, '/api/v1/seat-reservations/seats/' + seat.seatId, {
        gameId: testData.gameId,
        queueTokenJti: queueJti,
      }, token);
    }

    // 쓰기: 유저 생성 (로그인 시뮬레이션)
    function trySignup() {
      var ts = Date.now();
      var mobile = '000' + String(ts).slice(-8);
      apiPost(SVC.user, '/api/v1/test/users', {
        name: 'K6-Syn-' + __VU + '-' + ts,
        mobile: mobile,
        gender: Math.random() > 0.5 ? 'MALE' : 'FEMALE',
        birthDate: '1990-01-01',
      });
    }

    export default function (testData) {
      if (!testData) { sleep(60); return; }
      var t = testData.token;
      var roll = Math.random() * 100;

      if (roll < 18) {
        // 홈: 경기 일정 (18%) — ticketing
        apiGet(SVC.ticketing, '/api/v1/games/schedules?today=false', t);
      } else if (roll < 25) {
        // 홈: 팀 상세 (7%) — stadium
        if (testData.teamIds.length > 0) {
          var tid = testData.teamIds[Math.floor(Math.random() * testData.teamIds.length)];
          apiGet(SVC.stadium, '/api/v1/baseball-teams/' + tid, t);
        }
      } else if (roll < 35) {
        // 예매: 좌석 등급 (10%) — ticketing
        apiGet(SVC.ticketing, '/api/v1/stadium-seats/stadiums/' + testData.stadiumId + '/games/' + testData.gameId + '/seat-grades', t);
      } else if (roll < 43) {
        // 예매: 구역 목록 (8%) — ticketing
        apiGet(SVC.ticketing, '/api/v1/stadium-seats/stadiums/' + testData.stadiumId + '/seat-sections', t);
      } else if (roll < 48) {
        // 예매: 가격 정책 (5%) — ticketing
        apiGet(SVC.ticketing, '/api/v1/teams/' + testData.homeTeamId + '/ticket-pricing-policies', t);
      } else if (roll < 56) {
        // 좌석맵: 좌석 목록 (8%) — ticketing
        if (testData.sectionIds.length > 0) {
          var sid1 = testData.sectionIds[Math.floor(Math.random() * testData.sectionIds.length)];
          apiGet(SVC.ticketing, '/api/v1/seats/seat-sections/' + sid1 + '/seats', t);
        }
      } else if (roll < 68) {
        // 좌석 상태: 실시간 (12%) — ticketing
        if (testData.sectionIds.length > 0) {
          var sid2 = testData.sectionIds[Math.floor(Math.random() * testData.sectionIds.length)];
          apiGet(SVC.ticketing, '/api/v1/game-seats/' + testData.gameId + '/sections/' + sid2 + '/seat-statuses', t);
        }
      } else if (roll < 72) {
        // 마이페이지: 주문 목록 (4%) — ticketing
        apiGet(SVC.ticketing, '/api/v1/orders', t);
      } else if (roll < 76) {
        // 오늘 경기 (4%) — ticketing
        apiGet(SVC.ticketing, '/api/v1/games/schedules?today=true', t);
      } else if (roll < 80) {
        // 리셀: 경기별 리셀 좌석 수 (4%) — resale
        apiGet(SVC.resale, '/api/v1/resales/listings/games/' + testData.gameId + '/count', t);
      } else if (roll < 83) {
        // 리셀: 구역별 리셀 좌석 수 (3%) — resale
        if (testData.sectionIds.length > 0) {
          var sid3 = testData.sectionIds[Math.floor(Math.random() * testData.sectionIds.length)];
          apiGet(SVC.resale, '/api/v1/resales/listings/games/' + testData.gameId + '/section/' + sid3 + '/count', t);
        }
      } else if (roll < 86) {
        // 마이티켓: 티켓 상세 (3%) — ticketing
        if (testData.ticketId) {
          apiGet(SVC.ticketing, '/api/v1/tickets/' + testData.ticketId, t);
        } else {
          apiGet(SVC.ticketing, '/api/v1/orders', t);
        }
      } else if (roll < 88) {
        // 결제 정보 조회 (2%) — payment
        if (testData.orderId) {
          apiGet(SVC.payment, '/api/v1/payments/orders/' + testData.orderId, t);
        } else {
          apiGet(SVC.ticketing, '/api/v1/orders', t);
        }
      } else if (roll < 90) {
        // 구장 상세 (2%) — stadium
        apiGet(SVC.stadium, '/api/v1/stadiums/' + testData.stadiumId, t);
      } else if (roll < 95) {
        // [쓰기] 좌석 HOLD (5%) — 자연 만료
        trySeatHold(testData, t);
      } else {
        // [쓰기] 유저 생성 (5%) — 로그인 시뮬레이션
        trySignup();
      }

      // 사용자 브라우징 패턴: 2~5초 대기
      sleep(Math.random() * 3 + 2);
    }
{{- end }}
