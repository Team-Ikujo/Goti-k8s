apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: goti-infra
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - service: guardrail
            namespace: goti
            valuesFile: environments/dev/goti-guardrail/values.yaml
          # TODO: queue-gate (Go), bot-detection (Python) 추가 예정
  template:
    metadata:
      name: "goti-{{service}}-dev"
    spec:
      project: goti
      source:
        repoURL: "https://github.com/Team-Ikujo/Goti-k8s.git"
        targetRevision: main  # dev only: HEAD tracking — prod는 반드시 semver tag 고정
        path: "charts/goti-server"
        helm:
          valueFiles:
            - "../../{{valuesFile}}"
      destination:
        server: "https://kubernetes.default.svc"
        namespace: "{{namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
