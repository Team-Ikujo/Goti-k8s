apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: goti-msa
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - service: user
            namespace: goti
            valuesFile: environments/dev/goti-user/values.yaml
          - service: stadium
            namespace: goti
            valuesFile: environments/dev/goti-stadium/values.yaml
          - service: ticketing
            namespace: goti
            valuesFile: environments/dev/goti-ticketing/values.yaml
          - service: payment
            namespace: goti
            valuesFile: environments/dev/goti-payment/values.yaml
          - service: resale
            namespace: goti
            valuesFile: environments/dev/goti-resale/values.yaml
          - service: queue
            namespace: goti
            valuesFile: environments/dev/goti-queue/values.yaml
          - service: queue-gate
            namespace: goti
            valuesFile: environments/dev/goti-queue-gate/values.yaml
  template:
    metadata:
      name: "goti-{{service}}-dev"
      annotations:
        # SSA sync와 diff 비교를 모두 server-side로 통일 — client-side diff 불일치 방지
        # ref: https://github.com/argoproj/argo-cd/issues/11106
        argocd.argoproj.io/compare-options: ServerSideDiff=true
    spec:
      project: goti
      source:
        repoURL: "https://github.com/Team-Ikujo/Goti-k8s.git"
        targetRevision: main  # dev only: HEAD tracking — prod는 반드시 semver tag 고정
        path: "charts/goti-server"
        helm:
          valueFiles:
            - "../../{{valuesFile}}"
      destination:
        server: "https://kubernetes.default.svc"
        namespace: "{{namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - PruneLast=true
          - PrunePropagationPolicy=foreground
