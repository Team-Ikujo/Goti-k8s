apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: goti-msa
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - service: user
            namespace: goti
            valuesFile: environments/dev/goti-user/values.yaml
          - service: stadium
            namespace: goti
            valuesFile: environments/dev/goti-stadium/values.yaml
          - service: ticketing
            namespace: goti
            valuesFile: environments/dev/goti-ticketing/values.yaml
          - service: payment
            namespace: goti
            valuesFile: environments/dev/goti-payment/values.yaml
          - service: resale
            namespace: goti
            valuesFile: environments/dev/goti-resale/values.yaml
          - service: queue
            namespace: goti
            valuesFile: environments/dev/goti-queue/values.yaml
          # --- [POC] 대기열 구현체 비교용 임시 배포 ---
          # 최종 구현체 결정 후 아래 2개 element + environments/dev/goti-queue-{name}/ 삭제
          - service: queue-junsang
            namespace: goti
            valuesFile: environments/dev/goti-queue-junsang/values.yaml
          - service: queue-sungjeon
            namespace: goti
            valuesFile: environments/dev/goti-queue-sungjeon/values.yaml
  template:
    metadata:
      name: "goti-{{service}}-dev"
    spec:
      project: goti
      source:
        repoURL: "https://github.com/Team-Ikujo/Goti-k8s.git"
        targetRevision: main  # dev only: HEAD tracking — prod는 반드시 semver tag 고정
        path: "charts/goti-server"
        helm:
          valueFiles:
            - "../../{{valuesFile}}"
      destination:
        server: "https://kubernetes.default.svc"
        namespace: "{{namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
