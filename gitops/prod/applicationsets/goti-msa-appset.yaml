apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: goti-msa
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          # --- MSA 핵심 서비스 (values 계층화: values.yaml + values-aws.yaml) ---
          - service: mouse-macro
            namespace: goti
            valuesFile: environments/prod/goti-mouse-macro/values.yaml
            cloudValuesFile: environments/prod/goti-mouse-macro/values-aws.yaml
          - service: security-dashboard
            namespace: goti
            valuesFile: environments/prod/goti-security-dashboard/values.yaml
            cloudValuesFile: environments/prod/goti-security-dashboard/values-aws.yaml
          - service: user
            namespace: goti
            valuesFile: environments/prod/goti-user/values.yaml
            cloudValuesFile: environments/prod/goti-user/values-aws.yaml
          - service: stadium
            namespace: goti
            valuesFile: environments/prod/goti-stadium/values.yaml
            cloudValuesFile: environments/prod/goti-stadium/values-aws.yaml
          - service: ticketing
            namespace: goti
            valuesFile: environments/prod/goti-ticketing/values.yaml
            cloudValuesFile: environments/prod/goti-ticketing/values-aws.yaml
          - service: payment
            namespace: goti
            valuesFile: environments/prod/goti-payment/values.yaml
            cloudValuesFile: environments/prod/goti-payment/values-aws.yaml
          - service: resale
            namespace: goti
            valuesFile: environments/prod/goti-resale/values.yaml
            cloudValuesFile: environments/prod/goti-resale/values-aws.yaml
          - service: guardrail
            namespace: goti
            valuesFile: environments/prod/goti-guardrail/values.yaml
            cloudValuesFile: environments/prod/goti-guardrail/values-aws.yaml
          - service: queue
            namespace: goti
            valuesFile: environments/prod/goti-queue/values.yaml
            cloudValuesFile: environments/prod/goti-queue/values-aws.yaml
          - service: queue-gate
            namespace: goti
            valuesFile: environments/prod/goti-queue-gate/values.yaml
            cloudValuesFile: environments/prod/goti-queue-gate/values-aws.yaml
          # --- Go 마이그레이션 서비스 (replicaCount=0 상태로 배포, 토글로 활성화) ---
          # Java 서비스와 values-aws.yaml replicaCount 토글로 Blue/Green cutover.
          # cutover 절차:
          #   1. CI 트리거 → Harbor 이미지 push → yq PR 자동 생성
          #   2. PR merge 시 이미지 태그만 업데이트 (replicaCount=0 유지)
          #   3. cutover 시점: Java values-aws.yaml replicaCount=0 + -go replicaCount=N
          #   4. ArgoCD auto-sync (prune+selfHeal) → rolling cutover
          - service: ticketing-v2
            namespace: goti
            valuesFile: environments/prod/goti-ticketing-v2/values.yaml
            cloudValuesFile: environments/prod/goti-ticketing-v2/values-aws.yaml
          - service: stadium-v2
            namespace: goti
            valuesFile: environments/prod/goti-stadium-v2/values.yaml
            cloudValuesFile: environments/prod/goti-stadium-v2/values-aws.yaml
          - service: queue-v2
            namespace: goti
            valuesFile: environments/prod/goti-queue-v2/values.yaml
            cloudValuesFile: environments/prod/goti-queue-v2/values-aws.yaml
          - service: payment-v2
            namespace: goti
            valuesFile: environments/prod/goti-payment-v2/values.yaml
            cloudValuesFile: environments/prod/goti-payment-v2/values-aws.yaml
          - service: resale-v2
            namespace: goti
            valuesFile: environments/prod/goti-resale-v2/values.yaml
            cloudValuesFile: environments/prod/goti-resale-v2/values-aws.yaml
          - service: user-v2
            namespace: goti
            valuesFile: environments/prod/goti-user-v2/values.yaml
            cloudValuesFile: environments/prod/goti-user-v2/values-aws.yaml
  template:
    metadata:
      name: "goti-{{service}}-prod"
      annotations:
        # SSA sync와 diff 비교를 모두 server-side로 통일 — client-side diff 불일치 방지
        # ref: https://github.com/argoproj/argo-cd/issues/11106
        argocd.argoproj.io/compare-options: ServerSideDiff=true
    spec:
      project: goti
      source:
        repoURL: "https://github.com/Team-Ikujo/Goti-k8s.git"
        targetRevision: main  # TODO: prod 배포 시 반드시 semver tag로 고정 (예: v1.2.3)
        path: "charts/goti-server"
        helm:
          valueFiles:
            - "../../{{valuesFile}}"
            - "../../{{cloudValuesFile}}"
      destination:
        server: "https://kubernetes.default.svc"
        namespace: "{{namespace}}"
      syncPolicy:
        managedNamespaceMetadata:
          labels:
            istio-injection: enabled
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - PruneLast=true
          - PrunePropagationPolicy=foreground
