# Goti 커스텀 모니터링 리소스 (대시보드 + Prometheus Rules + Istio Gateway)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-custom
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: monitoring
  sources:
    - repoURL: "https://github.com/Team-Ikujo/Goti-monitoring.git"
      targetRevision: main
      path: "charts/goti-monitoring"
      helm:
        valueFiles:
          - values-prod.yaml
    # webhook-bridge + PrometheusRule + Probe (harbor failover)
    - repoURL: "https://github.com/Team-Ikujo/Goti-k8s.git"
      targetRevision: main
      path: "infrastructure/prod/monitoring/harbor-failover"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
