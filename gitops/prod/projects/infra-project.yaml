apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: infra
  namespace: argocd
spec:
  description: "인프라 부트스트랩 프로젝트 (Istio, AppProject, ApplicationSet)"
  sourceRepos:
    - "https://github.com/Team-Ikujo/Goti-k8s.git"
    - "public.ecr.aws/karpenter"
    - "https://kedacore.github.io/charts"
    - "https://helm.goharbor.io"
    - "https://kubernetes-sigs.github.io/descheduler"
    - "https://falcosecurity.github.io/charts"
  destinations:
    - namespace: argocd
      server: "https://kubernetes.default.svc"
    - namespace: istio-system
      server: "https://kubernetes.default.svc"
    - namespace: monitoring
      server: "https://kubernetes.default.svc"
    - namespace: goti
      server: "https://kubernetes.default.svc"
    - namespace: kyverno
      server: "https://kubernetes.default.svc"
    - namespace: karpenter
      server: "https://kubernetes.default.svc"
    - namespace: kube-system
      server: "https://kubernetes.default.svc"
    - namespace: keda
      server: "https://kubernetes.default.svc"
    - namespace: harbor
      server: "https://kubernetes.default.svc"
    - namespace: falco
      server: "https://kubernetes.default.svc"
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: "apiextensions.k8s.io"
      kind: CustomResourceDefinition
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRole
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRoleBinding
    - group: "admissionregistration.k8s.io"
      kind: MutatingWebhookConfiguration
    - group: "admissionregistration.k8s.io"
      kind: ValidatingWebhookConfiguration
    # External Secrets (cluster-scoped)
    - group: "external-secrets.io"
      kind: ClusterSecretStore
    - group: "kyverno.io"
      kind: ClusterPolicy
    - group: "karpenter.sh"
      kind: NodePool
    - group: "karpenter.sh"
      kind: NodeClaim
    - group: "karpenter.k8s.aws"
      kind: EC2NodeClass
    # KEDA
    - group: "apiregistration.k8s.io"
      kind: APIService
  # Istio, ArgoCD 리소스 타입이 다양하므로 namespace 경계로 격리
  namespaceResourceWhitelist:
    # Core
    - group: ""
      kind: Service
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: Endpoints
    # Apps
    - group: "apps"
      kind: Deployment
    - group: "apps"
      kind: DaemonSet
    - group: "apps"
      kind: StatefulSet
    # RBAC
    - group: "rbac.authorization.k8s.io"
      kind: Role
    - group: "rbac.authorization.k8s.io"
      kind: RoleBinding
    # Istio
    - group: "networking.istio.io"
      kind: Gateway
    - group: "networking.istio.io"
      kind: VirtualService
    - group: "networking.istio.io"
      kind: DestinationRule
    - group: "networking.istio.io"
      kind: EnvoyFilter
    - group: "networking.istio.io"
      kind: ServiceEntry
    - group: "networking.istio.io"
      kind: Sidecar
    - group: "security.istio.io"
      kind: PeerAuthentication
    - group: "security.istio.io"
      kind: AuthorizationPolicy
    - group: "security.istio.io"
      kind: RequestAuthentication
    # Monitoring
    - group: "monitoring.coreos.com"
      kind: ServiceMonitor
    - group: "monitoring.coreos.com"
      kind: PodMonitor
    - group: "monitoring.coreos.com"
      kind: PrometheusRule
    - group: "monitoring.coreos.com"
      kind: Probe
    # ArgoCD
    - group: "argoproj.io"
      kind: Application
    - group: "argoproj.io"
      kind: ApplicationSet
    - group: "argoproj.io"
      kind: AppProject
    # NetworkPolicy
    - group: "networking.k8s.io"
      kind: NetworkPolicy
    # OTel
    - group: "opentelemetry.io"
      kind: Instrumentation
    - group: "opentelemetry.io"
      kind: OpenTelemetryCollector
    # External Secrets
    - group: "external-secrets.io"
      kind: ExternalSecret
    # Batch
    - group: "batch"
      kind: CronJob
    - group: "batch"
      kind: Job
    # Storage
    - group: ""
      kind: PersistentVolumeClaim
    # Policy
    - group: "policy"
      kind: PodDisruptionBudget
    # Autoscaling
    - group: "autoscaling"
      kind: HorizontalPodAutoscaler
