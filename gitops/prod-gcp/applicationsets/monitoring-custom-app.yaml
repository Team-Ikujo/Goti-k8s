# Goti 커스텀 모니터링 리소스 (prod-gcp) — 대시보드 + Prometheus Rules + Istio Gateway
# AWS prod와 동일 chart, values-prod-gcp.yaml 로 GCP 오버라이드
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-custom-gcp
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: monitoring
  sources:
    - repoURL: "https://github.com/Team-Ikujo/Goti-monitoring.git"
      targetRevision: main
      path: "charts/goti-monitoring"
      helm:
        valueFiles:
          - values-prod-gcp.yaml
  destination:
    server: "https://kubernetes.default.svc"
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
