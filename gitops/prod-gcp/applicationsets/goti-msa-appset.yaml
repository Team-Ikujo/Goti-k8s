apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: goti-msa-gcp
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          # Go 전환 완료 — prod-gcp 통합 values 단일 파일 사용
          - service: user
            namespace: goti
            valuesFile: environments/prod-gcp/goti-user/values.yaml
          - service: stadium
            namespace: goti
            valuesFile: environments/prod-gcp/goti-stadium/values.yaml
          - service: ticketing
            namespace: goti
            valuesFile: environments/prod-gcp/goti-ticketing/values.yaml
          - service: payment
            namespace: goti
            valuesFile: environments/prod-gcp/goti-payment/values.yaml
          - service: resale
            namespace: goti
            valuesFile: environments/prod-gcp/goti-resale/values.yaml
          - service: queue
            namespace: goti
            valuesFile: environments/prod-gcp/goti-queue/values.yaml
          # SDD-0005 D5b — Redis outbox stream → RDS 영속 consumer
          - service: outbox-worker
            namespace: goti
            valuesFile: environments/prod-gcp/goti-outbox-worker/values.yaml
          # AI 매크로 탐지 대시보드 API (Streamlit Cloud → gcp-api.go-ti.shop 경유)
          - service: security-dashboard
            namespace: goti
            valuesFile: environments/prod-gcp/goti-security-dashboard/values.yaml
  template:
    metadata:
      name: "goti-{{service}}-prod-gcp"
      annotations:
        argocd.argoproj.io/compare-options: ServerSideDiff=true
    spec:
      project: goti
      source:
        repoURL: "https://github.com/Team-Ikujo/Goti-k8s.git"
        targetRevision: main
        path: "charts/goti-server"
        helm:
          valueFiles:
            - "../../{{valuesFile}}"
      destination:
        server: "https://kubernetes.default.svc"
        namespace: "{{namespace}}"
      syncPolicy:
        managedNamespaceMetadata:
          labels:
            istio-injection: enabled
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - PruneLast=true
          - PrunePropagationPolicy=foreground
