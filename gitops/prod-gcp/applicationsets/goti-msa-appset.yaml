apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: goti-msa-gcp
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          # --- MSA 핵심 서비스 (prod-gcp 통합 values 단일 파일) ---
          - service: mouse-macro
            namespace: goti
            valuesFile: environments/prod-gcp/goti-mouse-macro/values.yaml
          - service: security-dashboard
            namespace: goti
            valuesFile: environments/prod-gcp/goti-security-dashboard/values.yaml
          - service: user
            namespace: goti
            valuesFile: environments/prod-gcp/goti-user/values.yaml
          - service: stadium
            namespace: goti
            valuesFile: environments/prod-gcp/goti-stadium/values.yaml
          - service: ticketing
            namespace: goti
            valuesFile: environments/prod-gcp/goti-ticketing/values.yaml
          - service: payment
            namespace: goti
            valuesFile: environments/prod-gcp/goti-payment/values.yaml
          - service: resale
            namespace: goti
            valuesFile: environments/prod-gcp/goti-resale/values.yaml
          - service: guardrail
            namespace: goti
            valuesFile: environments/prod-gcp/goti-guardrail/values.yaml
          - service: queue
            namespace: goti
            valuesFile: environments/prod-gcp/goti-queue/values.yaml
          - service: queue-gate
            namespace: goti
            valuesFile: environments/prod-gcp/goti-queue-gate/values.yaml
          # SDD-0005 D5b — Redis outbox stream → Postgres 영속 consumer
          - service: outbox-worker
            namespace: goti
            valuesFile: environments/prod-gcp/goti-outbox-worker/values.yaml
          # --- Go 마이그레이션 서비스 (replicaCount=0 상태로 배포, 토글로 활성화) ---
          # cutover 절차:
          #   1. CI 트리거 → Artifact Registry push → yq PR 자동 생성
          #   2. PR merge 시 이미지 태그만 업데이트 (replicaCount=0 유지)
          #   3. cutover 시점: Java values.yaml replicaCount=0 + -v2 replicaCount=N
          #   4. ArgoCD auto-sync (prune+selfHeal) → rolling cutover
          - service: ticketing-v2
            namespace: goti
            valuesFile: environments/prod-gcp/goti-ticketing-v2/values.yaml
          - service: stadium-v2
            namespace: goti
            valuesFile: environments/prod-gcp/goti-stadium-v2/values.yaml
          - service: queue-v2
            namespace: goti
            valuesFile: environments/prod-gcp/goti-queue-v2/values.yaml
          - service: payment-v2
            namespace: goti
            valuesFile: environments/prod-gcp/goti-payment-v2/values.yaml
          - service: resale-v2
            namespace: goti
            valuesFile: environments/prod-gcp/goti-resale-v2/values.yaml
          - service: user-v2
            namespace: goti
            valuesFile: environments/prod-gcp/goti-user-v2/values.yaml
  template:
    metadata:
      name: "goti-{{service}}-prod-gcp"
      annotations:
        argocd.argoproj.io/compare-options: ServerSideDiff=true
    spec:
      project: goti
      source:
        repoURL: "https://github.com/Team-Ikujo/Goti-k8s.git"
        targetRevision: main
        path: "charts/goti-server"
        helm:
          valueFiles:
            - "../../{{valuesFile}}"
      destination:
        server: "https://kubernetes.default.svc"
        namespace: "{{namespace}}"
      syncPolicy:
        managedNamespaceMetadata:
          labels:
            istio-injection: enabled
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - PruneLast=true
          - PrunePropagationPolicy=foreground
