apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: infra
  namespace: argocd
spec:
  description: "인프라 부트스트랩 프로젝트 (Istio, AppProject, ApplicationSet) — GCP"
  sourceRepos:
    - "https://github.com/Team-Ikujo/Goti-k8s.git"
    - "https://kedacore.github.io/charts"
    - "https://helm.goharbor.io"
    - "https://kubernetes-sigs.github.io/descheduler"
    - "https://falcosecurity.github.io/charts"
    # Karpenter 제외 (GKE Cluster Autoscaler 내장)
  destinations:
    - namespace: argocd
      server: "https://kubernetes.default.svc"
    - namespace: istio-system
      server: "https://kubernetes.default.svc"
    - namespace: istio-ingress
      server: "https://kubernetes.default.svc"
    - namespace: monitoring
      server: "https://kubernetes.default.svc"
    - namespace: goti
      server: "https://kubernetes.default.svc"
    - namespace: external-secrets
      server: "https://kubernetes.default.svc"
    - namespace: kyverno
      server: "https://kubernetes.default.svc"
    - namespace: kube-system
      server: "https://kubernetes.default.svc"
    - namespace: keda
      server: "https://kubernetes.default.svc"
    - namespace: harbor
      server: "https://kubernetes.default.svc"
    - namespace: falco
      server: "https://kubernetes.default.svc"
    - namespace: cert-manager
      server: "https://kubernetes.default.svc"
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: "apiextensions.k8s.io"
      kind: CustomResourceDefinition
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRole
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRoleBinding
    - group: "admissionregistration.k8s.io"
      kind: MutatingWebhookConfiguration
    - group: "admissionregistration.k8s.io"
      kind: ValidatingWebhookConfiguration
    - group: "external-secrets.io"
      kind: ClusterSecretStore
    - group: "kyverno.io"
      kind: ClusterPolicy
    - group: "storage.k8s.io"
      kind: StorageClass
    - group: "apiregistration.k8s.io"
      kind: APIService
    # cert-manager (cluster-scoped)
    - group: "cert-manager.io"
      kind: ClusterIssuer
  namespaceResourceWhitelist:
    - group: ""
      kind: Service
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: Endpoints
    - group: "apps"
      kind: Deployment
    - group: "apps"
      kind: DaemonSet
    - group: "apps"
      kind: StatefulSet
    - group: "rbac.authorization.k8s.io"
      kind: Role
    - group: "rbac.authorization.k8s.io"
      kind: RoleBinding
    - group: "networking.istio.io"
      kind: Gateway
    - group: "networking.istio.io"
      kind: VirtualService
    - group: "networking.istio.io"
      kind: DestinationRule
    - group: "networking.istio.io"
      kind: EnvoyFilter
    - group: "networking.istio.io"
      kind: ServiceEntry
    - group: "networking.istio.io"
      kind: Sidecar
    - group: "security.istio.io"
      kind: PeerAuthentication
    - group: "security.istio.io"
      kind: AuthorizationPolicy
    - group: "security.istio.io"
      kind: RequestAuthentication
    - group: "monitoring.coreos.com"
      kind: ServiceMonitor
    - group: "monitoring.coreos.com"
      kind: PodMonitor
    - group: "monitoring.coreos.com"
      kind: PrometheusRule
    - group: "monitoring.coreos.com"
      kind: Probe
    - group: "argoproj.io"
      kind: Application
    - group: "argoproj.io"
      kind: ApplicationSet
    - group: "argoproj.io"
      kind: AppProject
    - group: "networking.k8s.io"
      kind: NetworkPolicy
    - group: "opentelemetry.io"
      kind: Instrumentation
    - group: "opentelemetry.io"
      kind: OpenTelemetryCollector
    - group: "external-secrets.io"
      kind: ExternalSecret
    - group: "batch"
      kind: CronJob
    - group: "batch"
      kind: Job
    - group: "policy"
      kind: PodDisruptionBudget
    - group: "autoscaling"
      kind: HorizontalPodAutoscaler
    # cert-manager (namespace-scoped)
    - group: "cert-manager.io"
      kind: Certificate
    - group: "cert-manager.io"
      kind: CertificateRequest
    - group: "cert-manager.io"
      kind: Issuer
    - group: "cert-manager.io"
      kind: Order
    - group: "cert-manager.io"
      kind: Challenge
