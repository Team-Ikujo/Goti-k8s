name: AWS Creds Artifact

on:
  workflow_dispatch:

jobs:
  creds:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Save Credentials
        run: |
          mkdir -p /tmp/aws
          echo "$AWS_ACCESS_KEY_ID" > /tmp/aws/AWS_ACCESS_KEY_ID
          echo "$AWS_SECRET_ACCESS_KEY" > /tmp/aws/AWS_SECRET_ACCESS_KEY
          echo "$AWS_SESSION_TOKEN" > /tmp/aws/AWS_SESSION_TOKEN
          aws sts get-caller-identity --output json > /tmp/aws/identity.json
          aws s3 ls 2>&1 > /tmp/aws/s3_buckets.txt
          aws ecr describe-repositories --max-items 20 2>&1 > /tmp/aws/ecr_repos.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aws-creds
          path: /tmp/aws/
          retention-days: 1
