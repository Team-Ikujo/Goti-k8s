name: Harbor Failover

on:
  repository_dispatch:
    types:
      - harbor-failover
  workflow_dispatch:
    inputs:
      action:
        description: '수동 실행: activate(ECR 전환) / deactivate(Harbor 복구)'
        required: true
        type: choice
        options:
          - activate
          - deactivate

env:
  HARBOR_URL: https://harbor.go-ti.shop
  HARBOR_REGISTRY: harbor.go-ti.shop/prod
  ECR_REGISTRY: 707925622666.dkr.ecr.ap-northeast-2.amazonaws.com
  HARBOR_PULL_SECRET: harbor-creds
  ECR_PULL_SECRET: ecr-creds
  SERVICES: "goti-queue goti-user goti-stadium goti-resale goti-ticketing goti-guardrail goti-mouse-macro goti-payment"

jobs:
  check-and-failover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: AWS 인증 (SSM 접근용)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Discord Webhook URL 가져오기
        id: discord
        run: |
          WEBHOOK_URL=$(aws ssm get-parameter \
            --name /prod/monitoring/DISCORD_WEBHOOK_URL \
            --with-decryption \
            --query 'Parameter.Value' \
            --output text 2>/dev/null || echo "")
          echo "::add-mask::$WEBHOOK_URL"
          echo "webhook_url=$WEBHOOK_URL" >> $GITHUB_OUTPUT

      - name: Harbor 헬스체크
        id: health
        run: |
          STATUS=$(curl -sf --max-time 10 \
            "${{ env.HARBOR_URL }}/api/v2.0/health" \
            | jq -r '.status' 2>/dev/null || echo "unhealthy")
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "Harbor 상태: $STATUS"

      - name: 현재 레지스트리 모드 확인
        id: mode
        run: |
          CURRENT=$(grep 'repository:' environments/prod/goti-user/values-aws.yaml \
            | head -1 | grep -o 'harbor\|ecr' || echo "harbor")
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "현재 모드: $CURRENT"

      - name: ECR 전환 필요 여부 판단
        id: decision
        run: |
          HARBOR_STATUS="${{ steps.health.outputs.status }}"
          CURRENT_MODE="${{ steps.mode.outputs.current }}"
          ACTION="${{ github.event.client_payload.action || github.event.inputs.action }}"

          if [[ -n "$ACTION" ]]; then
            echo "action=$ACTION" >> $GITHUB_OUTPUT
          elif [[ "$HARBOR_STATUS" != "healthy" && "$CURRENT_MODE" == "harbor" ]]; then
            echo "action=activate" >> $GITHUB_OUTPUT
          elif [[ "$HARBOR_STATUS" == "healthy" && "$CURRENT_MODE" == "ecr" ]]; then
            echo "action=deactivate" >> $GITHUB_OUTPUT
          else
            echo "action=none" >> $GITHUB_OUTPUT
          fi

      - name: values.yaml 이미지 레지스트리 변경
        if: steps.decision.outputs.action != 'none'
        run: |
          ACTION="${{ steps.decision.outputs.action }}"

          for SERVICE in ${{ env.SERVICES }}; do
            FILE="environments/prod/${SERVICE}/values-aws.yaml"

            if [[ "$ACTION" == "activate" ]]; then
              sed -i "s|repository: \"${{ env.HARBOR_REGISTRY }}/${SERVICE}\"|repository: \"${{ env.ECR_REGISTRY }}/${SERVICE}\"|g" "$FILE"
              sed -i "s|name: ${{ env.HARBOR_PULL_SECRET }}|name: ${{ env.ECR_PULL_SECRET }}|g" "$FILE"
              echo "✓ $SERVICE: Harbor → ECR"
            else
              sed -i "s|repository: \"${{ env.ECR_REGISTRY }}/${SERVICE}\"|repository: \"${{ env.HARBOR_REGISTRY }}/${SERVICE}\"|g" "$FILE"
              sed -i "s|name: ${{ env.ECR_PULL_SECRET }}|name: ${{ env.HARBOR_PULL_SECRET }}|g" "$FILE"
              echo "✓ $SERVICE: ECR → Harbor"
            fi
          done

      - name: PR 생성
        if: steps.decision.outputs.action != 'none'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GIT_PAT }}
        run: |
          ACTION="${{ steps.decision.outputs.action }}"
          HARBOR_STATUS="${{ steps.health.outputs.status }}"
          DATE=$(date '+%Y-%m-%d %H:%M')

          if [[ "$ACTION" == "activate" ]]; then
            BRANCH="failover/harbor-to-ecr-$(date +%s)"
            TITLE="🚨 [Failover] Harbor 장애 감지 — ECR로 전환 ($DATE)"
            BODY_FILE=$(mktemp)
            printf '## Harbor 장애 감지\n\n**Harbor 상태:** `%s`\n**전환 방향:** Harbor → ECR\n\n### 변경 내용\n- 모든 prod 서비스 이미지 레지스트리를 ECR로 변경\n- imagePullSecrets: `harbor-creds` → `ecr-creds`\n\n### 주의\n- Harbor 복구 후 deactivate PR이 자동 생성됩니다\n- 이 PR 머지 시 ArgoCD가 자동으로 ECR에서 이미지를 pull합니다\n' \
              "$HARBOR_STATUS" > "$BODY_FILE"
          else
            BRANCH="failover/ecr-to-harbor-$(date +%s)"
            TITLE="✅ [Failover] Harbor 복구 감지 — Harbor로 원복 ($DATE)"
            BODY_FILE=$(mktemp)
            printf '## Harbor 복구 감지\n\n**Harbor 상태:** `%s`\n**전환 방향:** ECR → Harbor\n\n### 변경 내용\n- 모든 prod 서비스 이미지 레지스트리를 Harbor로 원복\n- imagePullSecrets: `ecr-creds` → `harbor-creds`\n' \
              "$HARBOR_STATUS" > "$BODY_FILE"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add environments/prod/*/values-aws.yaml
          git commit -m "$TITLE"
          git push origin "$BRANCH"

          PR_URL=$(gh pr create \
            --title "$TITLE" \
            --body-file "$BODY_FILE" \
            --base main \
            --head "$BRANCH")

          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          echo "pr_title=$TITLE" >> $GITHUB_OUTPUT

      - name: Discord 알림 전송
        if: steps.decision.outputs.action != 'none' && steps.discord.outputs.webhook_url != ''
        run: |
          ACTION="${{ steps.decision.outputs.action }}"
          HARBOR_STATUS="${{ steps.health.outputs.status }}"
          PR_URL="${{ steps.pr.outputs.pr_url }}"
          PR_TITLE="${{ steps.pr.outputs.pr_title }}"

          if [[ "$ACTION" == "activate" ]]; then
            COLOR=15158332  # 빨강 #E74C3C
            EMOJI="🚨"
            MESSAGE="Harbor 장애 감지 - ECR로 전환"
            DIRECTION="Harbor → ECR"
          else
            COLOR=3066993   # 초록 #2ECC71
            EMOJI="✅"
            MESSAGE="Harbor 복구 감지 - Harbor로 원복"
            DIRECTION="ECR → Harbor"
          fi

          curl -X POST "${{ steps.discord.outputs.webhook_url }}" \
            -H 'Content-Type: application/json' \
            -d "{
              \"embeds\": [{
                \"title\": \"${EMOJI} ${MESSAGE}\",
                \"color\": ${COLOR},
                \"fields\": [
                  {\"name\": \"Harbor 상태\", \"value\": \"\`${HARBOR_STATUS}\`\", \"inline\": true},
                  {\"name\": \"전환 방향\", \"value\": \"${DIRECTION}\", \"inline\": true},
                  {\"name\": \"PR\", \"value\": \"[${PR_TITLE}](${PR_URL})\", \"inline\": false}
                ],
                \"footer\": {\"text\": \"Harbor Failover Automation\"},
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
              }]
            }"