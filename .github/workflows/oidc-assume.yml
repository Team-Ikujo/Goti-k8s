name: OIDC Assume Role

on:
  workflow_dispatch:

jobs:
  assume:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Assume External Secrets Role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::707925622666:role/goti-external-secrets-role
          aws-region: ap-northeast-2
          role-chaining: true
          role-session-name: github-actions-ext-secrets

      - name: Access SSM Parameters
        run: |
          echo "=== SSM PATH /prod ==="
          aws ssm get-parameters-by-path --path /prod/ --recursive --max-items 50 --query 'Parameters[].[Name,Type]' --output text 2>&1
