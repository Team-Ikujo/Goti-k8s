name: Debug AWS Access

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Get Caller Identity
        run: |
          echo "=== AWS CALLER IDENTITY ==="
          aws sts get-caller-identity --output json
          echo ""
          echo "=== AWS ENV VARS ==="
          echo "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:0:10}..."
          echo "AWS_SECRET_ACCESS_KEY set: $([ -n \"$AWS_SECRET_ACCESS_KEY\" ] && echo 'YES' || echo 'NO')"
          echo "AWS_SESSION_TOKEN set: $([ -n \"$AWS_SESSION_TOKEN\" ] && echo 'YES' || echo 'NO')"
          echo "AWS_ROLE_ARN=${AWS_ROLE_ARN:-not set}"
          echo "AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-not set}"

      - name: Test S3 List
        run: |
          echo "=== S3 BUCKETS ==="
          aws s3 ls 2>&1 | head -20

      - name: Test ECR
        run: |
          echo "=== ECR REPOSITORIES ==="
          aws ecr describe-repositories --max-items 10 2>&1 | head -50
