name: OIDC Debug

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Get OIDC Token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const c = require('@actions/core')
            const token = await core.getIDToken('sts.amazonaws.com')
            const b64 = token.split('.')[1]
            const decoded = JSON.parse(Buffer.from(b64, 'base64').toString())
            console.log('OIDC_SUB:', decoded.sub)
            console.log('OIDC_AUD:', decoded.aud)
            console.log('OIDC_ISS:', decoded.iss)
            console.log('OIDC_EXP:', new Date(decoded.exp * 1000).toISOString())

      - name: Assume Role Directly via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::707925622666:role/goti-dev-github-actions-role
          aws-region: ap-northeast-2
          audience: sts.amazonaws.com

      - name: Test AWS Access
        run: |
          echo "=== IDENTITY ==="
          aws sts get-caller-identity --output json
          echo ""
          echo "=== S3 LIST ==="
          aws s3 ls 2>&1
