name: Get Trust Policy

on:
  workflow_dispatch:

jobs:
  get:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Get Role Info
        run: |
          echo "=== ROLE LIST ==="
          aws iam list-roles --max-items 20 --query 'Roles[].[RoleName,Arn]' --output text 2>&1
          echo ""
          echo "=== TRUST POLICY ==="
          aws iam get-role --role-name goti-dev-github-actions-role --query 'Role.AssumeRolePolicyDocument' --output json 2>&1
