name: Extract Server Secrets

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Get Goti-server secrets via GitHub API
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "=== GOTI-SERVER SECRETS ==="
          curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/Team-Ikujo/Goti-server/actions/secrets" | python3 -c "
import json,sys
data=json.load(sys.stdin)
for s in data.get('secrets',[]):
    print(f\"{s['name']} | {s['created_at']} | {s['updated_at']}\")
" 2>&1
