name: Renovate

on:
  schedule:
    - cron: "0 * * * *"
  repository_dispatch:
    types: [image-pushed]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run (no PRs created)"
        required: false
        default: "false"
        type: boolean

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Get ECR authorization token
        id: ecr
        run: |
          TOKEN=$(aws ecr get-authorization-token --region ap-northeast-2 --query 'authorizationData[0].authorizationToken' --output text)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Run Renovate
        uses: renovatebot/github-action@v46.1.5
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
          env-regex: "^(?:RENOVATE_\\w+|LOG_LEVEL|GITHUB_COM_TOKEN|NODE_OPTIONS|(?:HTTPS?|NO)_PROXY|(?:https?|no)_proxy|AWS_\\w+)$"
        env:
          LOG_LEVEL: debug
          RENOVATE_REPOSITORIES: '["Team-Ikujo/Goti-k8s"]'
          RENOVATE_HOST_RULES: >-
            [{"hostType":"docker","matchHost":"https://707925622666.dkr.ecr.ap-northeast-2.amazonaws.com","token":"${{ steps.ecr.outputs.token }}"}]
          RENOVATE_DRY_RUN: ${{ inputs.dry-run == 'true' && 'full' || 'null' }}
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ env.AWS_SESSION_TOKEN }}
          AWS_REGION: ap-northeast-2
