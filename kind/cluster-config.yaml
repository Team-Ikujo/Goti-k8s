# Goti 로컬 개발 환경 Kind 클러스터 설정
# control-plane 1개 + worker 3개 (모니터링 + MSA + Kafka 분산 배치)
# K8s 1.34 고정 — ArgoCD v3.3이 1.35 미지원 (protobuf 이슈 #25767)
# 최소 권장 스펙: CPU 4C+, RAM 16GB+ (4노드 기준)
# 클러스터 재생성 필요: kind delete cluster → kind create cluster --config
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: goti-dev
nodes:
  - role: control-plane
    image: &nodeImage kindest/node:v1.34.3
    extraMounts: &timezoneMount
      - hostPath: /etc/localtime
        containerPath: /etc/localtime
        readOnly: true
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # HTTP → Istio Gateway NodePort
      - containerPort: 31080
        hostPort: 80
        protocol: TCP
      # HTTPS → Istio Gateway NodePort
      - containerPort: 31443
        hostPort: 443
        protocol: TCP
      # ArgoCD NodePort (HTTP only, insecure mode in dev)
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
  - role: worker
    image: *nodeImage
    extraMounts: *timezoneMount
  - role: worker
    image: *nodeImage
    extraMounts: *timezoneMount
  - role: worker
    image: *nodeImage
    extraMounts: *timezoneMount
